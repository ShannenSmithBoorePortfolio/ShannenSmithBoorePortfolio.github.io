.about-lead { font-family: var(--serif); font-size: clamp(21px, 2.2vw, 26px); line-height: 1.45; margin: 0 0 36px; }
.about-facts { margin: 0; }
.about-facts > div { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 16px; padding: 18px 0; border-top: 1px solid var(--panel-line); }
.about-facts dt { padding-top: 3px; }
.about-facts dd { margin: 0; line-height: 1.7; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ah { text-align: center; padding-block: clamp(32px, 5vw, 64px); min-height: min(calc(100vh - 86px), 920px); min-height: min(calc(100svh - 86px), 920px); display: grid; align-content: center; }
.projects .card.reveal { transform: translateY(80px) scale(.94); transition: opacity 1s ease, transform 1.15s cubic-bezier(.16, 1, .3, 1); }
.projects .card.reveal.in { transform: none; }
.ah-stage { display: grid; justify-items: center; gap: clamp(18px, 2.6vw, 28px); }
.ah-dots { display: block; width: min(100%, 900px); height: clamp(96px, 15vw, 170px); cursor: default; }
.ah-lines { display: grid; width: min(100%, 860px); }
.ah-line { grid-area: 1 / 1; margin: 0; font-family: var(--sans); font-weight: 400; font-size: clamp(24px, 3.4vw, 40px); line-height: 1.3; letter-spacing: -0.01em; color: var(--ink); text-wrap: balance; opacity: 0; transform: translateY(18px); filter: blur(6px); transition: opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1), filter .5s ease; pointer-events: none; }
.ah-line.out { transform: translateY(-14px); }

    { type: "section", label: "Affinity mapping", count: "20 interviews", heading: "Turning 20 conversations into evidence.",

    { type: "board", kind: "gallery", caption: "Affinity mapping the interview notes", c: 1, ratio: "16 / 9", contain: true, images: [[p("affinity"), ""]] },

    { type: "section", label: "Key insights", heading: "The risk isn't that AI replaces designers. It's that designers lose the core skills that define who they are.",
      lead: "Four clusters came up again and again. Each one became a design requirement." },
    { type: "points", items: [
      { title: "1. Offloading has already begun." },
      { title: "2. Juniors lose the struggle where learning happens." },
      { title: "3. Confidence erodes before ability does." },
      { title: "4. Every designer values different skills." },
    ]},

    { type: "section", label: "Archetypes", heading: "Two archetypes, formed from the research.",
      lead: "Janice and Ben were defined from the 20 interviews and the affinity map, and each represents a different relationship with AI. I built archetypes rather than traditional personas because how designers used AI depended on their attitude to it, more than their age or role. Each one is grounded in real interview quotes, referenced by participant number." },
    { type: "board", kind: "carousel", caption: "Archetypes", slides: [
      { label: "Unaware Offloader", kind: "archetype", name: "Janice", age: "22-26", job: "Junior Product Designer", photo: p("a-janice"),
        quote: "Now I'm just using Claude for everything.", qref: "P8",
        patterns: ["Uses AI across everyday tasks without noticing.", "Can't clearly define which parts were AI assisted and which were her own work.", "Treats AI like any other tool and doesn't reflect on how it affects her as a designer."],
        relationship: ["No guilt, because she can't define what AI takes away.", "Somewhat positive, as she feels it optimises her current workload.", "Just sees AI as another tool."],
        triggers: ["Moments of friction built into the design process, for reflection.", "A visual understanding of her cognitive losses.", "More visibility of AI usage versus her own input into the design process."],
        quotes: [["I use AI unknowingly, it's baked into little features I use without me necessarily proactively wanting to use AI.", "P11"], ["It's just part of my process now, I use it all the time.", "P10"]] },
      { label: "Guilty Delegator", kind: "archetype", name: "Ben", age: "27-30", job: "Mid Level Service / Interaction Designer", photo: p("a-ben"),
        quote: "I do sense I may more and more lose core skill sets. Repetition of tasks is how you learn.", qref: "P12",
        patterns: ["Uses AI across various tasks to speed up his process.", "Feels uncomfortable with heavy use of AI, and tries to avoid it.", "Concerned about long term skill erosion and what that means for him as a designer."],
        relationship: ["Feels guilty and has some self criticism.", "Feels stuck when it comes to over delegating.", "Feels like AI is gaining the skills he needs to develop."],
        triggers: ["Reinforcement when he is making decisions himself.", "A contrast between what AI has done and what he has done.", "Moments of friction that provoke him to do tasks himself."],
        quotes: [["I slowly realised it was hampering my own ability to think and ideate. That became alarming, especially as a designer.", "P15"]] },
    ]},

    { type: "section", label: "Opportunity", heading: "Make offloading visible, and give designers a reason to think first.",
      lead: "Information alone wouldn't change behaviour; designers already knew. The opportunity was to make the cost felt. It leads to:" },
    { type: "points", items: [
      { title: "Awareness", text: "Noticing the pattern before dependence sets in." },
      { title: "Friction", text: "A small pause, so the easy path isn't always the default." },
      { title: "Independence", text: "Practising skills without AI so they don't fade." },
    ]},

    { type: "section", label: "Exploring directions", heading: "Speculative design: provoke, don't lecture.",
      lead: "Because cognitive offloading is a future-facing problem, I chose speculative design to provoke reflection and productive discomfort. I explored four directions, each a different way to deliver the three opportunity pillars: awareness, by making offloading visible; friction, by adding a pause before AI; and independence, by keeping skills in practice." },
    { type: "board", kind: "gallery", caption: "Speculative moodboards: the four directions explored", c: 1, ratio: "1405 / 916", contain: true, images: [[p("directions"), ""]] },
    { type: "subsection", heading: "Round 1: two concepts into testing.",
      lead: "After an open discussion in the studio, Brain Rot and Distorting Relationships drew the strongest reactions, so I tested both with two designers." },
    { type: "board", kind: "fade", caption: "", slides: [
      { label: "Brain Rot", image: p("brainrot-concept"), ratio: "1033 / 482", caption: "mould grows on your brain scan as you offload" },
      { label: "Distorting Relationships", image: p("relationships-concept"), ratio: "1359 / 774", caption: "AI replies like four colleagues" },
    ]},
    { type: "points", label: "What round 1 showed", items: [
      { title: "Brain Rot made designers reflect", text: "\"As you're showing me the idea, I'm reflecting on my own use.\"" },
      { title: "Distorting Relationships stayed a talking point", text: "Designers found it interesting, but \"more of a talking point\"." },
    ]},

    { type: "subsection", heading: "Round 2: two developed concepts.",
      lead: "I developed Brain Rot into Mouldy Thoughts, and Nurturing Skills into Growing Beyond AI, where your skills grow as flowers. Ten Accenture designers compared them in a feedback workshop." },
    { type: "board", kind: "fade", caption: "", slides: [
      { label: "Mouldy Thoughts", image: p("mouldy-thoughts"), ratio: "1576 / 735", caption: "mould grows on your brain as you offload" },
      { label: "Growing Beyond AI", image: p("growing-beyond"), ratio: "1527 / 718", caption: "skills grow as flowers when you practise" },

    { type: "points", label: "What round 2 showed", items: [
      { title: "Growing Beyond AI lost its pull", text: "Comfortable, but the novelty wore off, and plant-style tracker apps already exist." },
      { title: "Mouldy Thoughts moved forward", text: "\"I reflected on my usage and it made me feel bad but in a good way.\"" },
      { title: "Show the healthy brain too", text: "Four designers wanted a colourful brain that bleaches, not constant negativity." },

    { type: "section", label: "Co-design workshop", count: "4 designers", heading: "Defining how Cortexus works.",
      lead: "After the Accenture feedback workshop, four designers mapped their own process on worksheets to define how Cortexus should work. They wanted it to protect soft skills, not tools, to start with thinking on paper, and for the pause to come from the AI itself, with designers always in control." },
    { type: "board", kind: "gallery", caption: "Co-design workshop", c: 1, ratio: "3 / 2", images: [[p("reflective"), ""]] },
    { type: "section", label: "Building the prototype", heading: "Designed by hand, built with AI.",
      lead: "Before building anything, I mapped how Cortexus would work: what each mould phase looks like, what causes it, and which prompts count as offloading. I designed every screen by hand in Figma first, then used AI only to build the working prototype." },
    { type: "board", kind: "gallery", caption: "Mapping the mould phases", c: 1, ratio: "1336 / 865", contain: true, images: [[p("mould-mapping"), ""]] },
    { type: "board", kind: "gallery", caption: "Technical flow", c: 2, ratio: "558 / 789", contain: true, images: [[p("tech-flow-1"), ""], [p("tech-flow-2"), ""]] },
    { type: "board", kind: "gallery", caption: "Prompt language classification", c: 1, ratio: "526 / 326", contain: true, images: [[p("prompt-class"), ""]] },
    { type: "points", label: "Tools I used", items: [
      { title: "Figma", text: "Every screen and the design system, designed by hand first." },
      { title: "Claude", text: "Coding the interactive desktop app and the Claude extension." },
      { title: "Gemini", text: "Exploring the mould and brain scan visuals." },
    ]},
    { type: "points", label: "How I worked with AI", items: [
      { title: "AI built, I decided", text: "Claude was strong at structure, but burned through credits and pushed its own style." },
      { title: "Figma Make fell short", text: "It flattened the texture and personality the concept needed." },
      { title: "Hand first, AI second", text: "The best workflow was the habit Cortexus encourages: think first, then use AI to build." },

    { type: "board", kind: "gallery", caption: "AI-built iterations", c: 2, ratio: "4 / 3", contain: true, images: [[p("claude-proto"), ""], [p("figma-make"), ""]] },

    { type: "section", label: "User testing round 1", count: "10 designers", heading: "Prototype 1: does it make designers reflect?",
      lead: "I tested the first prototype with ten product and interaction designers at Accenture." },
    { type: "board", kind: "fade", caption: "", slides: [
      { label: "Prototype 1", image: p("p1-onboarding"), ratio: "973 / 520", caption: "onboarding" },
      { label: "Prototype 1", image: p("p1-dashboard"), ratio: "1023 / 517", caption: "dashboard and Claude overlays" },
    ]},
    { type: "board", kind: "quotes", caption: "Success criteria", c: 2, quotes: [
      "I'd be actually scared if the company could see it, because mine would be so covered in mould.",
      "We need to definitely look at our usage, and this is just the tool for making us reflect.",
    ]},
    { type: "points", label: "What needed to change", items: [
      { title: "Onboarding", text: "Needed more explanation, especially of the soft skills." },
      { title: "Terminology", text: "Inaccessible and inconsistent." },
      { title: "Dashboard", text: "Cluttered, with an unclear hierarchy." },
      { title: "Consent", text: "Data sharing came too late, and was flagged as a dark pattern." },

    { type: "section", label: "What I changed", heading: "Clearer, calmer and consent first.",

    { type: "points", items: [

      { title: "Plain language", text: "\"Patient identity\" and medical jargon were removed." },
      { title: "A calmer dashboard", text: "Cut back, with a clear hierarchy and info icons." },
      { title: "Skills explained", text: "A new \"What we track\" step explains each soft skill." },
    ]},

    { type: "section", label: "User testing round 2", count: "2 designers", heading: "Prototype 2: the real Cortexus.",
      lead: "I tested the revised prototype with two more designers. This version became the actual product." },
    { type: "board", kind: "gallery", caption: "Testing prototype 2", c: 1, ratio: "997 / 558", images: [[p("test2"), ""]] },
    { type: "board", kind: "quotes", caption: "Success criteria", c: 2, quotes: [
      "The brain makes me want to take bleach and pour it over the top of it.",
      "I really like that the concept gives you the liberty to select your prompting boundaries, and it doesn't force it on you.",
    ]},
    { type: "points", label: "What still needed to change", items: [
      { title: "Language", text: "Still too complex, and needed simplifying further." },
      { title: "Info page", text: "Confusing, because the boxes looked like functions." },
      { title: "Introduction", text: "Overwhelming, with too much to learn at once." },
      { title: "Colours and extension", text: "The colour scheme was hard to read, and extensions don't work like this." },
    ]},

    { type: "section", label: "Finalising the prototype", heading: "Clinical, sci-fi and a little unsettling.",
      lead: "After round 2 I simplified the language, split the introduction into short steps, rebranded with higher-contrast colours, and rebuilt the extension to install the way real browser extensions do." },
    { type: "board", kind: "gallery", caption: "Final design system", c: 1, ratio: "1429 / 811", contain: true, images: [[p("design-system"), ""]] },

    { type: "section", label: "Solution", heading: "Cortexus: a clinic for your design brain.",
      lead: "A desktop app and Claude extension. You choose the four soft skills you want to protect. Every time you offload one to AI, mould grows on that part of your brain scan. Write in your journal instead, and it clears." },
    { type: "media", stage: "grey", image: p("cover") },

    { type: "section", label: "Features", heading: "How each insight became a feature.",
      lead: "Recorded in the working prototype." },
    { type: "pairs", tag: "Insight 1", heading: "Offloading has already begun.", lead: "So Cortexus makes it visible, in real time.", items: [
      { ...W, video: "cx/v/f-dash", title: "Your brain, scanned", text: "Each skill sits on a region of the brain, and mould spreads through four phases as you hand it over." },
      { ...W, image: p("scr-claude-ext"), title: "Beside the AI you already use", text: "Designers use AI at their desks, so Cortexus lives in Claude as a browser extension." },
    ]},
    { type: "pairs", tag: "Insight 2", heading: "Juniors lose the struggle where learning happens.", lead: "So the pause comes from the AI itself, as co-design asked.", items: [
      { ...W, video: "cx/v/f-claude", title: "A nudge at the moment of offloading", text: "Ask Claude to decide for you, and Cortexus flags the mould before you move on." },
      { ...W, image: p("scr-claude-journal"), title: "Paper first, AI second", text: "Opening your journal clears the mould. \"Paper first, screen second\" came straight from co-design." },
    ]},
    { type: "pairs", tag: "Insight 3", heading: "Confidence erodes before ability does.", lead: "So there's always a healthy brain to work back to.", items: [
      { ...W, image: p("vibrant-brains"), title: "A colourful, healthy brain", text: "Four designers asked for a brain that's vibrant when healthy and bleaches as mould spreads." },
      { ...W, image: p("scr-phase"), title: "Four phases, never a dead end", text: "Each skill shows its phase and how many prompts are left, so there's always a way back." },
    ]},
    { type: "pairs", tag: "Insight 4", heading: "Every designer values different skills.", lead: "So designers set the rules, not the tool.", items: [
      { ...W, video: "cx/v/f-skills", title: "Choose your skills, set your limits", text: "\"I really like that the concept gives you the liberty to select your prompting boundaries.\"" },
      { ...W, video: "cx/v/f-consent", title: "Consent before anything", text: "Round 1 flagged late consent as a dark pattern, so it moved to the very first screen." },
    ]},

    { type: "section", label: "Impact", heading: "What Cortexus changes." },
    { type: "points", items: [
      { title: "Awareness", text: "The striking visuals of the rot can't be ignored, breaking the habit of reaching for AI without thinking." },
      { title: "Skill building", text: "Designers refocus on building their own skills, using AI to prevent further losses rather than cause them." },
      { title: "Independence", text: "Designers regain confidence and trust in themselves to make their own decisions again." },
    ]},

    { type: "section", label: "Reflection", heading: "What I learned" },
    { type: "points", items: [
      { title: "Designing for designers is harder.", text: "Every designer works differently, so I had to separate personal preference from shared needs." },
      { title: "Speculative design needs evidence too.", text: "Provocation only worked once it was grounded in real quotes and tested reactions." },
      { title: "AI is a tool, not a co-designer.", text: "My best work came from deciding first and using AI to build, the same habit Cortexus encourages." },
    ]},
  ];
}

/* AGRILITE case study: accessibility-first UX/UI */

    { type: "section", label: "Overview", heading: "How might a farmer decide when to spread fertiliser, in seconds, at the edge of a field?",
      lead: "Agrilite is a soil sensor and app that tells grassland farmers when it's safe to fertilise. I designed the sensor in 2024. In 2026 I went back to the app with one question: could the farmers who most need it actually use it outdoors, in gloves, in bright sun, with weak signal? It couldn't, so I redesigned it from the ground up." },
    { type: "points", items: [
      { title: "Accessibility-first", text: "Built to WCAG AA or better, with status that never relies on colour alone." },
      { title: "Responsive system", text: "Phone at the gate, tablet in the cab or kitchen, desktop for planning the week." },
      { title: "Designed for real conditions", text: "Gloves, sunlight, low signal, time pressure and mixed digital confidence." },
    ]},

    { type: "section", label: "Problem", heading: "Spread at the wrong time and the fertiliser ends up in the river.",
      lead: "Fertiliser spread at the wrong rate or time runs off into water and feeds toxic algae. It's also money lost: fertiliser is the biggest cost on many grazing farms. The sensor can tell when conditions are right. The app has to turn that into a clear decision a farmer trusts." },
    { type: "board", kind: "stats", caption: "Why it matters", stats: [
      ["33%", "of Irish farm holders are aged 65 or over. Small text and low contrast shut them out.", "CSO Census of Agriculture, 2020", "https://www.cso.ie/en/releasesandpublications/ep/p-coa/censusofagriculture2020-preliminaryresults/demographicprofileoffarmholders"],
      ["1 in 12", "men has a colour vision deficiency, so colour alone can't carry meaning.", "Colour Blind Awareness", "https://www.colourblindawareness.org/colour-blindness/"],
      ["1 decision", "Spread or don't. Everything on the screen should help with that."],
      ["Outdoors", "Bright sun, rain, gloves and weak signal are the normal conditions, not edge cases."],
    ]},

    { type: "section", label: "Users", heading: "Designing for the people farming actually involves.",
      lead: "These proto-personas are built from the 2024 research and the realities of farm work. They are assumptions to validate with farmers, not research findings." },
    { type: "users", items: [
      { who: "The experienced farmer", tag: "Low digital confidence", line: "Has farmed for 40 years. Uses a smartphone for calls and WhatsApp. Needs reading glasses.", needs: ["One clear answer, in plain words", "Large text that doesn't break the layout", "Nothing to set up before it's useful"] },
      { who: "The contractor on the move", tag: "Gloves and time pressure", line: "Spreads for several farms a day. Checks the app from the tractor door with gloves on.", needs: ["Big targets that work with gloves", "The decision visible without scrolling", "Readable in direct sunlight"] },
      { who: "The planner", tag: "Colour vision deficiency", line: "Plans the week from the kitchen table on a tablet. Can't tell red from green.", needs: ["Status shown with shape and words, not colour", "A week view that's easy to compare", "Works offline when the signal drops"] },

    { type: "section", label: "Key insights", heading: "The risks were hiding in everyday workarounds.",
      lead: "Tape held equipment together and devices had no home. Each workaround became a requirement." },
    { type: "points", items: [

      { title: "2. Everything must come off fast.", text: "In an emergency, every mount has to release without tools or thought." },
      { title: "3. Cleaning is part of the design.", text: "Engineers and cleaning staff shaped materials, sterilisation and repair." },
      { title: "4. This injury is preventable.", text: "Sharp edges cost stitches and lost shifts, and put patients and visitors at risk." },

      lead: "We prototyped in rounds, taking every version back to the ward, from early concepts to physical prototypes." },

    { type: "points", label: "What feedback changed", items: [

      { title: "Colour by unit", text: "Red for ICU and blue for HDU, so equipment goes back to the right place." },
      { title: "Magnetic mounting", text: "Tool-free removal and reattachment, for cleaning and for emergencies." },
      { title: "Cleanable details", text: "A clinical nurse manager flagged the mouse position and thickness during cleaning, which reshaped the design." },
    ]},

/* NUTRICURE × ENGINEERS WITHOUT BORDERS */
function nutricureBlocks() {
  const p = n => `nc/${n}.webp`;
  return [
    { type: "section", label: "Overview", heading: "How might a community keep feeding itself long after outside support ends?",
      lead: "Nutricure is a sustainable crop growing system for communities in India, made with an Engineers Without Borders team. It won Engineers Without Borders Ireland 2024." },
    { type: "points", items: [
      { title: "12 households", text: "Using the system in their own homes." },
      { title: "2 pilot tests", text: "With weekly tracking of crop growth." },
      { title: "1 school session", text: "Introducing children to simple solutions they could build at home." },
    ]},

    { type: "section", label: "Reframing", heading: "The obvious brief was a product. The useful brief was a service.",
      lead: "We could have built a device that grows food. Instead we designed the system of knowledge, trust and touchpoints a community needs to keep it going." },

    { type: "section", label: "Research", heading: "Starting from lived experience, not assumptions.",
      lead: "We interviewed a woman from one of the target communities about daily food access. She told us things no desk research would have: how access shifts with the seasons, what materials a typical home actually has, and what an outside idea must earn before it's trusted." },

    { type: "section", label: "Key insight", heading: "We had no shared language, so the workshop had to listen for us.",
      lead: "Interviews and surveys weren't an option, and politeness is easily mistaken for approval. So we designed feedback people could give with their hands." },
    { type: "points", items: [
      { title: "Hands-on tables", text: "People handled prototype pieces and answered by pointing, arranging and building." },
      { title: "Read behaviour, not words", text: "Hesitation, repeated attempts and what people reached for told us what worked." },
      { title: "Trust travels through people", text: "Local champions who showed others how to use the tables drove honest participation." },
    ]},
    { type: "board", kind: "gallery", caption: "Workshops with the community", c: 3, ratio: "4 / 3", images: [[p("c016"), ""], [p("c014"), ""], [p("c018"), ""]] },

    { type: "section", label: "Implementation", heading: "From prototype to everyday use.",
      lead: "After several workshops, Nutricure was set up in 12 households and ran through two pilot tests, with crop growth tracked weekly to see if it held up over time." },
    { type: "board", kind: "gallery", caption: "Setting up and testing the system", c: 3, ratio: "3 / 4", images: [[p("c020"), ""], [p("c022"), ""], [p("c024"), ""]] },
    { type: "quote", intro: "The biggest result wasn't the crop data.", text: "Families started meeting regularly to talk about growing conditions, materials and each other. Nutricure rebuilt a small piece of community infrastructure that people chose to keep." },

    { type: "section", label: "Reflection", heading: "What I learned" },
    { type: "points", items: [
      { title: "A working service beats a working prototype.", text: "It held up in someone else's life, not just ours." },
      { title: "The metric wasn't the story.", text: "We measured crop growth. What mattered was people reconnecting." },
      { title: "Respect comes before design.", text: "Every workshop only worked because people were patient and let us in." },
    ]},
  ];
}

const BLOCKS = {
  /* ---- Agrilite 2.0 case study blocks ---- */
  users: b => `<div class="ux-users">${b.items.map(u => `<article class="ux-card"><div class="cs-label">${esc(u.tag)}</div><h3 class="cs-h4">${esc(u.who)}</h3><p>${esc(u.line)}</p>

  critique: b => `<figure class="ux-crit"><div class="ux-crit-imgs"><div>${img(b.image, "2024 Agrilite summary screen")}</div><div>${img(b.image2, "2024 Agrilite plan screen")}</div></div>
      <figcaption><div class="cs-label">Audit of the 2024 app</div><ol>${b.items.map(([t, d, tag]) => `<li><div><b>${esc(t)}</b><span class="ux-tag">${esc(tag)}</span></div><p>${esc(d)}</p></li>`).join("")}</ol></figcaption></figure>`,

  ia: b => `<figure class="ux-ia"><div class="ux-ia-root">Agrilite</div><div class="ux-ia-cols">${b.cols.map(([n, q, items]) => `<div class="ux-ia-col"><b>${esc(n)}</b><span>${esc(q)}</span><ul>${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
      <figcaption>${esc(b.extra)}</figcaption></figure>`,

  simulate: b => `<figure class="ux-sim" data-sim><div class="ux-sim-bar" role="group" aria-label="See the screens as">
      ${[["normal", "Normal vision"], ["deut", "Red-green colour blindness"], ["sun", "Bright sunlight"], ["blur", "Blurred vision"]].map(([k, l], i) => `<button type="button" data-simk="${k}" aria-pressed="${i ? "false" : "true"}">${l}</button>`).join("")}</div>
      <div class="ux-sim-imgs"><div><div class="cs-label">${esc(b.bl)}</div><div class="ux-sim-shot">${img(b.b, b.bl)}</div></div><div><div class="cs-label">${esc(b.cl)}</div><div class="ux-sim-shot">${img(b.c, b.cl)}</div></div></div>
      <figcaption>Every field and day is labelled with a name, a status word and a shape, so the screens still read with colour blindness, in glare and with blurred vision.</figcaption>
      <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="f-deut"><feColorMatrix type="matrix" values="0.367 0.861 -0.228 0 0  0.280 0.673 0.047 0 0  -0.012 0.043 0.969 0 0  0 0 0 1 0"/></filter></svg></figure>`,

  encode: () => {
    const st = [["go", "Spread", "Circle with a tick", "#22632B", "#E3F1DE", '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 9.5"/>'],
      ["okay", "Okay", "Half-filled circle", "#7A4D00", "#FFF1CC", '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>'],
      ["stop", "Don't spread", "Octagon with a cross", "#A11F1A", "#FDE4E1", '<path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"/><path d="m9 9 6 6M15 9l-6 6"/>'],
      ["closed", "Closed", "Padlock", "#3E434A", "#EDEDEA", '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'],
      ["none", "Not needed", "Dashed circle", "#4D5A50", "#F0F3EE", '<circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/><path d="M8 12h8"/>']];
    return `<div class="cs-points-wrap"><div class="cs-label">Status is never colour alone</div><div class="ux-enc">${st.map(([k, w, shape, fg, bg, path]) => `<div class="ux-enc-i">
      <span class="ux-chip" style="color:${fg};background:${bg}"><svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>${w}</span>
      <span class="ux-enc-gray" aria-hidden="true"><svg viewBox="0 0 24 24">${path}</svg>${w}</span><p>${shape}</p></div>`).join("")}</div>
      <p class="cs-lead" style="max-width:none">Top row: colour, shape and word. Bottom row: the same with no colour at all. Every status is still clear.</p>
      <div class="cs-points" style="--n:3;margin-top:8px">
        <div><h3 class="cs-h4">One app, not a special mode</h3><p>There's no colour-blind setting to find. Colour is never the only signal, so the same screens work for everyone.</p></div>
        <div><h3 class="cs-h4">Shape and word on every status</h3><p>A tick, a half circle, an octagon, a padlock or a dashed circle, always with a word beside it.</p></div>
        <div><h3 class="cs-h4">It helps everyone</h3><p>The same choices make the app readable in bright sun, on a dim or cracked screen, and for older eyes.</p></div>
      </div></div>`;
  },

  contrast: b => `<div class="cs-points-wrap"><div class="cs-label">Contrast, measured</div><div class="ux-con">${b.rows.map(([n, fg, bg, r, ok]) => `<div class="ux-con-i">

/* put the key decisions just before the design decisions (or the reflection) */
function withDecisions(p, blocks) {
  if (!p.decisions) return blocks;
  const at = ["Design decisions", "Solution", "Reflection"].map(l => blocks.findIndex(b => b.type === "section" && b.label === l)).find(i => i > -1);
  const block = { type: "decisions", items: p.decisions };
  const sec = { type: "section", id: "sdec", label: "Key decisions", heading: "The calls that shaped it.", lead: "What I chose, what I ruled out, and why." };
  const out = blocks.slice();
  out.splice(at > -1 ? at : out.length, 0, sec, block);
  return out;
}

function withLens(p, blocks) {
  if (!LENS[p.id]) return blocks;
  const i = blocks.findIndex(b => b.type === "points");
  const out = blocks.slice(); out.splice(i > -1 ? i + 1 : 1, 0, { type: "lens", rows: LENS[p.id] }); return out;
}

function projectView(p) {
  const side = SIDE.includes(p);
  const list0 = side ? SIDE : PROJECTS;
  const i = list0.indexOf(p);
  const next = list0[(i + 1) % list0.length];
  const list = arr => arr.map(esc).join("<br>");
  const blocks = p.blocks || [];
  blocks.forEach((b, n) => { if (b.type === "section") b.id = "s" + n; });
  const toc = withDecisions(p, blocks).filter(b => b.type === "section" && b.label);
  return `
  <div class="readbar">
    <div class="readbar-inner"><a class="back" href="#work">← Back</a></div>

  </div>

/* reading progress: the line under Back grows to the full width as you scroll */
function updateProgress() {
  const line = app.querySelector(".progress");
  if (!line) return;
  const bar = line.parentElement;
  const left = line.offsetLeft;
  const start = app.querySelector(".back").offsetWidth + 24;   // resting length
  const full = bar.clientWidth - left * 2;                       // full width
  const max = document.documentElement.scrollHeight - innerHeight;
  const p = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
  line.style.width = (start + (full - start) * p) + "px";
}
let progTick = false;
const onScroll = () => { if (!progTick) { progTick = true; requestAnimationFrame(() => { progTick = false; updateProgress(); }); } };
addEventListener("scroll", onScroll, { passive: true });
addEventListener("resize", onScroll);

/* app videos: play while visible, never for reduced motion */
let vidObserver;
function setupVideos() {
  if (vidObserver) vidObserver.disconnect();
  const vids = [...app.querySelectorAll(".phone video, video[data-auto]")];
  if (!vids.length) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  vids.forEach(v => { v.preload = "metadata"; });
  if (still) return;
  vidObserver = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target;
    if (e.isIntersecting) { const p = v.play(); if (p) p.catch(() => {}); } else v.pause();
  }), { rootMargin: "200px 0px" });
  vids.forEach(v => vidObserver.observe(v));
}

/* carousels */
app.addEventListener("click", e => {
  const btn = e.target.closest("[data-car]");
  if (!btn) return;
  const track = document.getElementById(btn.dataset.car);
  const n = track.children.length;
  const cur = Math.round(track.scrollLeft / track.clientWidth);
  const i = btn.dataset.i != null ? +btn.dataset.i : Math.max(0, Math.min(n - 1, cur + +btn.dataset.step));
  track.scrollTo({ left: i * (track.clientWidth + 24) });
  markCar(track, i);
});
function markCar(track, i) {
  document.querySelectorAll(`.car-tab[data-car="${track.id}"]`).forEach(t => {
    const on = +t.dataset.i === i; t.classList.toggle("k", on); t.setAttribute("aria-pressed", on);
  });
}
app.addEventListener("scroll", e => {
  const t = e.target;
  if (!t.classList || !t.classList.contains("car-track")) return;
  clearTimeout(t._s); t._s = setTimeout(() => markCar(t, Math.round(t.scrollLeft / (t.clientWidth + 24))), 80);
}, true);

/* side menu: scroll to section + highlight the one in view */
let tocObserver;
function setupToc() {
  if (tocObserver) tocObserver.disconnect();
  const buttons = [...app.querySelectorAll("[data-goto]")];
  if (!buttons.length) return;
  const mark = id => buttons.forEach(b => b.setAttribute("aria-current", b.dataset.goto === id ? "true" : "false"));
  tocObserver = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) mark(e.target.id); });
  }, { rootMargin: "-30% 0px -60% 0px" });
  buttons.forEach(b => { const s = document.getElementById(b.dataset.goto); if (s) tocObserver.observe(s); });
}
app.addEventListener("click", e => {
  const go = e.target.closest("[data-goto]");
  if (go) { document.getElementById(go.dataset.goto)?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const v = e.target.closest("[data-vid]");
  if (v) {
    const video = v.closest(".stage").querySelector("video");
    const toggle = v.closest(".vid-ctrl").querySelector('[data-vid="toggle"]');
    if (v.dataset.vid === "replay") { video.currentTime = 0; video.play(); }
    else if (video.paused) video.play(); else video.pause();
    const paused = video.paused;
    toggle.innerHTML = paused ? ICON_PLAY : ICON_PAUSE;
    toggle.setAttribute("aria-label", paused ? "Play video" : "Pause video");
  }
});

/* MOTION: reveal content as it scrolls in, in reading order */
let revealObs;
function setupReveal() {
  if (revealObs) revealObs.disconnect();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return;
  const h1 = app.querySelector(".hero h1");
  if (h1 && !h1.dataset.split) {
    h1.dataset.split = 1; let i = 0;
    const walk = node => [...node.childNodes].forEach(n => {
      if (n.nodeType === 3) {
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(t => {
          if (!t) return;
          if (/^\s+$/.test(t)) frag.append(t);
          else { const sp = document.createElement("span"); sp.className = "w"; sp.style.setProperty("--i", i++); sp.textContent = t; frag.append(sp); }
        });
        n.replaceWith(frag);
      } else walk(n);
    });
    walk(h1);
    requestAnimationFrame(() => requestAnimationFrame(() => h1.classList.add("in")));
  }
  const items = [];
  const add = (sel, stagger) => app.querySelectorAll(sel).forEach(el => {
    if (el.classList.contains("reveal") || el.closest(".car-track")) return;
    el.classList.add("reveal");
    if (stagger) el.style.setProperty("--d", ([...el.parentElement.children].indexOf(el) % 4) * 0.12 + "s");
    items.push(el);
  });
  add(".card, .detail-head, .cs-section, .cs-sub, .cs-text, .cs-quote, .cs-pairs-wrap > .cs-label, .cs-pairs-wrap > h3, .cs-pairs-wrap > .cs-lead, .lcb, .cs-media, .next, .page-head, .rv-profile, .rv-row, .rv-skill, .rv-quotes figure, .rv-tools, .rv-awards li, .fun-item");
  add(".cs-points > div, .cs-pairs > figure, .dec-item, .story li, .meta > div, .lc2-persona, .lc2-princ > div, .lc2-story li, .lc2-card", true);
  app.querySelectorAll(".thumb, .hero-img").forEach(el => { el.classList.add("reveal-img"); items.push(el); });
  const story = app.querySelector(".story"); if (story) items.push(story);
  revealObs = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("in"); revealObs.unobserve(e.target);
    if (e.target.matches(".lcb")) countUp(e.target);
  }), { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
  items.forEach(el => revealObs.observe(el));
}
/* numbers count up once, when their board comes into view */
function countUp(root) {
  root.querySelectorAll(".lcs-n").forEach(el => {
    const m = el.textContent.match(/^(\d+)(%?)$/);
    if (!m) return;
    const end = +m[1], t0 = performance.now(), dur = 1100;
    const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(end * e) + m[2]; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

  const { width: w, height: h } = e.contentRect, k = Math.min(w / 390, h / 844), f = e.target.querySelector("iframe");
  f.style.transform = `translate(${(w - 390 * k) / 2}px, ${(h - 844 * k) / 2}px) scale(${k})`;
}));
function setupApps() { app.querySelectorAll(".app-phone").forEach(ph => appFit.observe(ph)); }

let reelTimer;

function setupReel() {

/* PROTOTYPE VIEWER */
function openProto(name) {
  if (document.querySelector(".pv")) return;
  const base = new URL(`proto/${name}/`, location.href).href;
  const doc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="${base}"><link rel="stylesheet" href="tw.css?v=191"><script src="https://cdn.tailwindcss.com/3.4.1"><\/script><style>html,body{margin:0;padding:0;background:#0e0e0e;height:100%;overflow:hidden}#root{width:100vw;height:100vh}</style></head><body><div id="root"></div><script src="react.js?v=191"><\/script><script src="app.js?v=191"><\/script></body></html>`;
  const pv = document.createElement("div");
  pv.className = "pv"; pv.setAttribute("role", "dialog"); pv.setAttribute("aria-modal", "true"); pv.setAttribute("aria-label", "Cortexus prototype");
  pv.innerHTML = `<div class="pv-bar"><button type="button" class="pv-back">&larr; Back to portfolio</button><span class="label">Cortexus interactive prototype</span></div><div class="pv-tip gone" aria-live="polite"></div><div class="pv-intro"><div class="pv-intro-in"><div class="label">Before you start</div><h2>Cortexus is a desktop prototype</h2><p>It was designed and built for a laptop or desktop screen, where people use AI tools day to day. For the full experience, open it on a larger screen. On a phone, some screens may not display as intended.</p><button type="button" class="pv-start fill-btn">Start the prototype <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m0 0-6-6m6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div><iframe title="Cortexus interactive prototype"></iframe>`;
  pv.querySelector(".pv-start").addEventListener("click", () => { pv.querySelector(".pv-intro").remove(); pv.querySelector("iframe").srcdoc = doc; });
  const close = () => { document.querySelectorAll(".pv").forEach(n => n.remove()); document.body.classList.remove("pv-open"); document.removeEventListener("keydown", esc); };
  const esc = e => { if (e.key === "Escape") close(); };
  pv.querySelector(".pv-back").addEventListener("click", close);
  document.addEventListener("keydown", esc);
  document.body.append(pv); document.body.classList.add("pv-open");
  requestAnimationFrame(() => pv.classList.add("on"));
  pv.querySelector(".pv-start").focus();
  const tip = pv.querySelector(".pv-tip"), frame = pv.querySelector("iframe");
  let installed = false, lastAct = Date.now(), dashDone = 0, extDone = false, simDone = false, bound = null, arrowsAt = 0;
  const vis = el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; };
  const btn = (d, re) => [...d.querySelectorAll("button")].find(b => re.test(b.textContent.trim()) && vis(b));
  const stage = d => {
    const txt = d.body.innerText || "";
    let b;
    if ((b = btn(d, /^Install$/))) return { el: b, html: "Click <b>Install</b>" };
    if (btn(d, /^Installing/)) { installed = true; return null; }
    if ((b = btn(d, /^Open$/))) { installed = true; return { el: b, html: "Click <b>Open</b> to launch Cortexus", now: true }; }
    if (!installed) { const i = d.querySelector("input"); if (i && vis(i) && /Microsoft Store/.test(txt)) return i.value ? null : { el: i, html: "Type <b>Cortexus</b> in the search bar to start" }; return null; }
    const row = [...d.querySelectorAll(".intervention-row")].find(r => vis(r) && !/175,\s*207,\s*254/.test(r.getAttribute("style") || ""));
    if (row) return { el: row, html: "Turn this <b>on</b> for the full experience", now: true };
    if ((b = btn(d, /^GET STARTED$/i))) return { el: b, html: b.disabled ? "Tick <b>I accept the terms</b>, then <b>Get started</b>" : "Press <b>Get started</b>" };
    if ((b = btn(d, /^GO TO DASHBOARD$/i))) return { el: b, html: "Press <b>Go to dashboard</b>" };
    if ((b = btn(d, /^CONTINUE$/i))) {
      if (/Soft Skills/.test(txt)) return { el: b, html: "Pick at least one <b>skill</b>, then <b>Continue</b>" };
      if (d.querySelector('input[placeholder="Enter your name"]')) return { el: b, html: "Fill in your details, then <b>Continue</b>" };
      return { el: b, html: "Press <b>Continue</b>" };
    }
    if ((b = btn(d, /^TAKE THE TOUR$/i))) return { el: b, html: "Take the <b>tour</b> to see how the dashboard works", now: true };
    if (btn(d, /^(NEXT:|DONE$)/i)) return null;
    if (d.querySelector('[data-tour^="nav-"]')) {
      if (!dashDone && (b = btn(d, /^4$/))) return { el: b.parentElement, html: "This is a <b>simulation</b>. Click <b>1 to 4</b> to watch the mould grow", now: true };
      if (!dashDone) { const nd = d.querySelector('[data-tour="nav-dashboard"]'); if (nd && vis(nd)) return { el: nd, html: "Go back to the <b>Dashboard</b> to try the simulation", now: true }; }
      if (dashDone && Date.now() - dashDone > 6000) {
        const x = [...d.querySelectorAll("button")].filter(e => vis(e) && e.getBoundingClientRect().top < 50).sort((a, c) => c.getBoundingClientRect().right - a.getBoundingClientRect().right)[0];
        if (x) return { el: x, html: "Now close Cortexus with the <b>X</b> to set it up in Claude", now: true };
      }
      return null;
    }
    if (/Recycle Bin/.test(txt)) { const c = [...d.querySelectorAll("span")].find(e => e.textContent.trim() === "Claude" && vis(e)); if (c) return { el: c.parentElement, html: "Open <b>Claude</b> to set up Cortexus", now: true }; }
    if ((b = btn(d, /^Enable Extension$/))) return { el: b, html: "Click <b>Enable Extension</b> to connect Cortexus to Claude", now: true };
    if ((b = btn(d, /^Add to Chrome$/))) return { el: b, html: "Click <b>Add to Chrome</b>", now: true };
    if ((b = btn(d, /^Enable now$/))) return { el: b, html: "Click <b>Enable now</b> to finish setting up", now: true };
    if ((b = btn(d, /^Simulate Conversation$/))) {
      if (!extDone) {
        const W = d.documentElement.clientWidth, H = d.documentElement.clientHeight;
        const ct = [...d.querySelectorAll("button,div")].find(e => { const r = e.getBoundingClientRect(); return /^CT/.test(e.textContent.trim()) && r.width > 0 && r.width < 90 && r.right > W - 160 && r.bottom > H - 160; });
        if (ct) return { el: ct, html: "Click <b>CT</b> to set up Cortexus in Claude", now: true };
      } else if (!simDone) return { el: b, html: "Click <b>Simulate Conversation</b>, or type in your own prompt", now: true };
    }
    return null;
  };
  const place = el => {
    const fr = frame.getBoundingClientRect(), pr = pv.getBoundingClientRect(), r = el.getBoundingClientRect();
    tip.style.visibility = "hidden"; tip.classList.remove("gone");
    const w = tip.offsetWidth, h = tip.offsetHeight, cx = fr.left - pr.left + r.left + r.width / 2;
    let x = Math.max(12, Math.min(pr.width - w - 12, cx - w / 2));
    let y = fr.top - pr.top + r.bottom + 14, up = false;
    if (y + h > pr.height - 12) { y = fr.top - pr.top + r.top - h - 14; up = true; }
    tip.style.left = x + "px"; tip.style.top = y + "px"; tip.style.setProperty("--ax", (cx - x) + "px");
    tip.classList.toggle("up", up); tip.style.visibility = "";
  };
  const hide = () => tip.classList.add("gone");
  hide();
  const tick = setInterval(() => {
    if (!pv.isConnected) return clearInterval(tick);
    let d; try { d = frame.contentDocument; } catch (e) { return; }
    if (!d || !d.body) return;
    if (bound !== d) { bound = d; ["pointerdown", "keydown", "input"].forEach(t => d.addEventListener(t, ev => { if (ev.target.closest && ev.target.closest("button") && /^[1-4]$/.test(ev.target.closest("button").textContent.trim()) && !dashDone) dashDone = Date.now(); { const bt = ev.target.closest && ev.target.closest("button"); const t = bt ? bt.textContent.trim() : ""; if (t === "Enable now") extDone = true; if (t === "Simulate Conversation") simDone = true; } lastAct = Date.now(); if (arrowsAt > 0) arrowsAt = -1; if (installed) hide(); }, true)); }
    const s = stage(d);
    if (s && s.now) { tip.innerHTML = s.html; place(s.el); return; }
    if (installed && arrowsAt !== -1) {
      const dev = [...d.querySelectorAll("div,span")].find(e => e.childElementCount === 0 && /^DEV:/.test(e.textContent.trim()) && vis(e));
      if (dev && !/Splash/.test(dev.textContent)) {
        if (!arrowsAt) arrowsAt = Date.now();
        if (Date.now() - arrowsAt < 6000) { tip.innerHTML = "For a quick click through, use the <b>arrows</b>"; place(dev.parentElement); lastAct = Date.now(); return; }
        arrowsAt = -1; hide();
      }
    }
    if (!s) return hide();
    if (installed && !s.now && Date.now() - lastAct < 7000) return hide();
    tip.innerHTML = s.html; place(s.el);
  }, 400);
}

/* Pill follows the mouse inside each project image */
(function () {
  if (!matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let active = null; // { thumb, follow, x, y, tx, ty }
  let raf = 0;

  function tick() {
    if (!active) { raf = 0; return; }
    const k = still ? 1 : 0.18;
    active.x += (active.tx - active.x) * k;
    active.y += (active.ty - active.y) * k;
    active.follow.style.left = active.x + "px";
    active.follow.style.top = active.y + "px";
    raf = requestAnimationFrame(tick);
  }
  function start() { if (!raf) raf = requestAnimationFrame(tick); }

  app.addEventListener("mousemove", e => {
    const thumb = e.target.closest(".thumb");
    if (!thumb) return;
    const r = thumb.getBoundingClientRect();
    const follow = thumb.querySelector(".follow");
    // keep the pill fully inside the image
    const pw = follow.offsetWidth / 2, ph = follow.offsetHeight / 2;
    const tx = Math.min(Math.max(e.clientX - r.left, pw), r.width - pw);
    const ty = Math.min(Math.max(e.clientY - r.top, ph), r.height - ph);
    if (!active || active.thumb !== thumb) {
      // appear right at the cursor on entry
      active = { thumb, follow, x: tx, y: ty };
    }
    active.tx = tx; active.ty = ty;
    start();
  });
  app.addEventListener("mouseout", e => {
    const thumb = e.target.closest(".thumb");
    if (!thumb || !active || active.thumb !== thumb || thumb.contains(e.relatedTarget)) return;
    active = null; // pill fades out where it is
  });
  window.addEventListener("hashchange", () => { active = null; });
})();
