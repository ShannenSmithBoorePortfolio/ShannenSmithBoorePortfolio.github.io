<style>
/* Layout: single centred column, quiet nav bar, large image-led project cards; one orange accent. Single light look by choice. */
:root {
  --bg: #F9FAFC;

  text-transform: uppercase;

  font-weight: 400;
}

/* NAV */
.nav {

  z-index: 10;

.card-title { font-family: var(--serif); font-weight: 400; font-size: clamp(22px, 2.4vw, 26px); line-height: 1.2; margin: 0 0 6px; }

.card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.card-time { position: absolute; left: 14px; top: 14px; z-index: 2; display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px 7px 10px; border-radius: 999px; background: #FFFFFF; color: var(--accent-text); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; box-shadow: 0 6px 18px -10px rgba(20, 24, 32, .5); }

/* PROTOTYPE VIEWER: opens the full prototype on top of the portfolio, no new tab */
.pv { position: fixed; inset: 0; z-index: 100; background: #0E0E0E; display: flex; flex-direction: column; }

.pv-tip { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; background: var(--accent); color: var(--accent-ink); font-size: 14px; padding: 10px 18px; border-radius: 999px; white-space: nowrap; box-shadow: 0 10px 24px -12px rgba(0,0,0,.6); animation: pvTip 1.6s ease-in-out infinite; transition: opacity .3s ease; }

/* CORTEXUS COVER: light backdrop so the dark app window stands out */

.bnw { position: absolute; z-index: 1; left: 7%; top: 11%; width: 74%; height: 76%; display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; background: #FFF5DE; pointer-events: none; container-type: inline-size; box-shadow: 0 34px 60px -30px rgba(120, 52, 24, .45), 0 12px 24px -16px rgba(19, 63, 65, .25), 0 0 0 1px rgba(19, 63, 65, .08); transition: transform .7s cubic-bezier(.2,.7,.2,1), box-shadow .7s ease; }

/* stages: the background a mockup sits on */
.stage {
  position: relative; overflow: hidden; display: grid; place-items: center;
  max-width: 100%; border: 1px solid var(--panel-line);
}
.stage > img, .stage > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* ============ LOVE CHORES BOARDS , built from the app's own design system ============ */
.lcb {
  --l: #D4B3FF; --k: #121212; --y: #FFD84A; --m: #6E6A73; --w: #FFFFFF;
  background: var(--l); color: var(--k); border-radius: 28px;
  padding: clamp(14px, 3vw, 32px); display: grid; gap: 14px;
  font-family: "Figtree", "Helvetica Neue", Arial, sans-serif; font-size: 13px; line-height: 1.45;
}
.lcb-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.lcpill {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
  border: 1.5px solid var(--k); background: var(--w); color: var(--k);
}
.lcpill.k { background: var(--k); color: var(--w); }
.lcpill.y { background: var(--y); }
.lcc {
  background: var(--w); border: 1.5px solid var(--k); border-radius: 20px; box-shadow: 0 3px 0 var(--k);
  padding: 16px; min-width: 0;
}
.lcc.y { background: var(--y); }
.lcc h4 { margin: 0 0 8px; font-size: 15px; font-weight: 800; letter-spacing: -.01em; line-height: 1.25; }
.lcc h5 { margin: 12px 0 6px; font-size: 11px; font-weight: 700; color: var(--m); text-transform: uppercase; letter-spacing: .05em; }
.lcc h5:first-child { margin-top: 0; }
.lcc p { margin: 0; font-size: 13px; font-weight: 500; }
.lcc p + p { margin-top: 8px; }
.lct { font-size: clamp(22px, 2.4vw, 26px); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin: 0; }
.lcl { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.lcl li { position: relative; padding-left: 18px; font-weight: 500; }
.lcl li::before {
  content: ""; position: absolute; left: 0; top: .42em; width: 8px; height: 8px; border-radius: 50%;
  border: 1.5px solid var(--k); background: var(--w);
}
.lcc.y .lcl li::before { background: var(--y); }
ol.lcl { counter-reset: q; }
ol.lcl li { padding-left: 24px; counter-increment: q; }
ol.lcl li::before { content: counter(q); width: 16px; height: 16px; top: .05em; border-radius: 50%; font-size: 10px; font-weight: 800; display: grid; place-items: center; background: var(--k); color: var(--w); border: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* photo on a board */
.lcb-img { border: 1.5px solid var(--k); border-radius: 16px; overflow: hidden; background: var(--w); box-shadow: 0 3px 0 var(--k); }
.lcb-img img { width: 100%; display: block; }

/* shared grid: equal-height cards, always aligned */
.lcgrid { display: grid; grid-template-columns: repeat(var(--c, 3), minmax(0, 1fr)); gap: 14px; align-items: stretch; }
.lcgrid.narrow { max-width: 720px; margin-inline: auto; width: 100%; }
.lcgrid > .lcc { height: 100%; }

/* persona */
.lcp { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 14px; align-items: stretch; }
.lcp-id { display: grid; gap: 12px; align-content: start; }
.lcp-photo { aspect-ratio: 1 / 1; border-radius: 16px; overflow: hidden; border: 1.5px solid var(--k); }
.lcp-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lcp-main { display: grid; gap: 14px; grid-template-rows: auto 1fr; }
.lcp-quote { font-size: 15px; font-weight: 700; line-height: 1.45; letter-spacing: -.01em; }

/* journey: one card per stage */
.lcj { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 14px; align-items: stretch; }
.lcj { grid-template-rows: auto auto 1fr; row-gap: 14px; }
.lcj-col { display: grid; grid-row: span 3; grid-template-rows: subgrid; gap: 14px; }
.lcj-col .lcpill { justify-content: center; height: 32px; }
.lcj-moods { display: grid; gap: 10px; align-content: start; }
.lcj-m { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; font-weight: 600; line-height: 1.35; }
.dot { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--k); background: var(--w); margin-top: 1px; }
.dot.happy { background: var(--y); }
.dot.unhappy { background: var(--k); }
.lcj-col .lcl { font-size: 12.5px; gap: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }

/* summary card on top of a grid */
.lcsum { display: grid; grid-template-columns: repeat(var(--c, 2), minmax(0, 1fr)); gap: 24px; }
.lcsum .split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

/* rewards */
.bubble { background: var(--y); border: 1.5px solid var(--k); border-radius: 16px; padding: 12px 14px; display: grid; gap: 4px; }
.bubble small { font-size: 11px; font-weight: 700; opacity: .65; }
.bubble b { font-size: 14px; font-weight: 800; line-height: 1.3; }

/* user flow */
.lcf { display: grid; justify-items: center; }
.vl { width: 1.5px; height: 22px; background: var(--k); }
.lcf-split { width: min(560px, 100%); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; position: relative; padding-top: 22px; align-items: stretch; }
.lcf-split::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 22px; border: 1.5px solid var(--k); border-bottom: 0; border-radius: 12px 12px 0 0; }
.field { height: 32px; border: 1.5px solid var(--k); border-radius: 999px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; font-weight: 500; color: var(--m); background: var(--w); }
.lcf-auth { display: grid; gap: 8px; }
.tabbar { display: flex; gap: 4px; background: var(--w); border: 1.5px solid var(--k); border-radius: 999px; padding: 5px; box-shadow: 0 3px 0 var(--k); }

.tabbar span.on { background: var(--k); color: var(--w); }
.lcf .lcgrid { width: 100%; margin-top: 18px; }

/* testing */
.lcx .lcc { display: grid; gap: 12px; align-content: start; }

@media (max-width: 860px) {
  .lcp { grid-template-columns: minmax(0, 1fr); }
  .lcp-id { grid-template-columns: 120px minmax(0, 1fr); }
  .lcp-id .lcp-photo { grid-row: span 2; }
  .lcgrid { --c: 2 !important; }
  .lcsum { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .lcj { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; }
  .lcj-col { grid-row: auto; grid-template-rows: auto auto 1fr; }
}
@media (max-width: 560px) {
  .lcgrid, .lcsum .split, .lcj { grid-template-columns: minmax(0, 1fr) !important; }
  .lcp-id { grid-template-columns: minmax(0, 1fr); }
  .lcf-split { grid-template-columns: minmax(0, 1fr); padding-top: 0; }
  .lcf-split::before { display: none; }
  .tabbar { gap: 2px; }
  .tabbar span { padding: 0 10px; font-size: 11.5px; height: 30px; }
}

/* design system board */
.ds-sw { display: grid; gap: 10px; align-content: start; }
.ds-chip { aspect-ratio: 16 / 9; border-radius: 14px; border: 1.5px solid var(--k); }
.ds-sw b { font-size: 15px; font-weight: 800; }

.ds-parts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 14px; }
.ds-part { display: grid; gap: 8px; align-content: start; }

.ds-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn-lc { height: 44px; padding: 0 22px; border-radius: 999px; border: 1.5px solid var(--k); background: var(--w); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
.btn-lc.y { background: var(--y); }
.btn-lc.sm { height: 32px; padding: 0 14px; font-size: 12px; font-weight: 700; }
.btn-lc.k { background: var(--k); color: var(--w); }

.chk-lc { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--k); background: var(--w); display: inline-grid; place-items: center; font-size: 12px; font-weight: 800; }
.chk-lc.on { background: var(--k); color: var(--w); }
.bar-lc { height: 10px; border-radius: 999px; border: 1.5px solid var(--k); background: var(--w); overflow: hidden; }
.bar-lc i { display: block; height: 100%; width: 60%; background: var(--k); }
.tabs-lc { display: flex; gap: 16px; font-size: 13px; font-weight: 700; }
.tabs-lc b { border-bottom: 2px solid var(--k); padding-bottom: 4px; }
.tabs-lc span { color: var(--m); }

/* flows */
.flow { display: grid; gap: 14px; }
.flow-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.flow-head h4 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
.flow-head p { margin: 0; font-size: 13px; font-weight: 500; color: var(--k); opacity: .75; }
.flow-steps { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 28px; }
.flow-step { position: relative; display: grid; gap: 12px; justify-items: center; align-content: start; }
.flow-step .phone { width: min(100%, 210px); }
.flow-step:not(:last-child)::after {
  content: "→"; position: absolute; right: -22px; top: 45%; font-size: 16px; font-weight: 800; color: var(--k);
}

.flow-cap .n { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--k); color: var(--w); display: grid; place-items: center; font-size: 10.5px; font-weight: 800; }
.flow + .flow { padding-top: 18px; border-top: 1.5px solid rgba(18, 18, 18, .15); }
@media (max-width: 860px) {

  .flow-step::after { display: none; }

@media (max-width: 560px) {

}

/* persona avatar */
.lcp-who { display: flex; gap: 14px; align-items: center; }
.lcp-av { flex: none; width: 96px; height: 96px; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--k); background: var(--y); }

.lcp-meta { height: auto; min-height: 28px; padding-block: 5px; white-space: normal; line-height: 1.3; }

/* journey opportunity row */

/* carousel */
.car-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* stats */
.lcs { display: grid; gap: 10px; align-content: start; grid-template-rows: auto 1fr auto; }

.lcfm-step { background: var(--w); border: 1.5px solid var(--k); border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 12.5px; box-shadow: 0 2px 0 var(--k); }

@media (max-width: 860px) {

.lcb.plain .lcq::before { display: none; }
.lcb.plain .lcq p { font-family: var(--serif-text) !important; font-style: italic; font-weight: 400 !important; font-size: 19px !important; color: var(--ink) !important; line-height: 1.4; }
/* journey */

/* persona (plain) */
.pp { display: grid; grid-template-columns: minmax(0, 240px) minmax(0, 1fr); gap: clamp(24px, 4vw, 48px); align-items: start; padding-top: 8px; }

.pp-bio { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.7; }
.pp-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 48px; padding-top: 28px; margin-top: 28px; border-top: 1px solid var(--panel-line); }
.pp-cols h5, .pp-scen h5 { margin: 0 0 12px; font-family: var(--mono); font-weight: 400; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.pp-cols .lcl li { color: var(--ink) !important; }
.pp-scen { padding-top: 24px; margin-top: 24px; border-top: 1px solid var(--panel-line); max-width: 46em; }
.pp-scen p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.7; }

@media (max-width: 760px) {

}
@media (max-width: 480px) { .pp { grid-template-columns: minmax(0, 1fr); } .pp-photo { width: 160px; } }

/* identity & design system (plain) */
.lcb.plain .ds-chip { aspect-ratio: 4 / 3; border-radius: 0; border: 1px solid var(--panel-line); }
.lcb.plain .ds-sw { gap: 6px; }
.lcb.plain .ds-sw b { font-family: var(--serif-text); font-weight: 400; font-size: 20px; color: var(--ink); }

.lcb.plain .ds-type small, .lcb.plain .ds-part small, .lcb.plain .idt-fonts small { font-family: var(--mono); font-weight: 400; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

/* bigger screens in design decisions */
.cs-pairs .stage.square .phone { width: 46%; }

/* SIMPLE PAGES */
.page-head { padding-block: clamp(56px, 10vw, 104px) 32px; }
.page-head h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 5vw, 48px); margin: 8px 0 0; }
.fun-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 28px; padding-bottom: 96px; }
.fun-grid .slot { aspect-ratio: 4 / 3; background: var(--placeholder); }
.fun-grid figure { margin: 0; display: grid; gap: 12px; }


/* BUTTON FILL: outlined at rest, orange sweeps in left to right on hover */
.fill-btn { position: relative; overflow: hidden; isolation: isolate; background: transparent !important; color: var(--ink) !important; border: 1px solid var(--ink) !important; box-shadow: none !important; transition: color .25s ease .2s, border-color .3s ease .15s; }
.fill-btn::before { content: ""; position: absolute; inset: -1px; background: var(--accent); transform: scaleX(0); transform-origin: left center; transition: transform .45s cubic-bezier(.65,0,.35,1); z-index: -1; }
.fill-btn:hover, .fill-btn:focus-visible { color: var(--accent-ink) !important; border-color: var(--accent-text) !important; }
.fill-btn:hover::before, .fill-btn:focus-visible::before { transform: scaleX(1); }
.fill-btn svg { transition: transform .35s ease; }
.fill-btn:hover svg { transform: translateY(2px); }
.reel-cue.fill-btn.follow { background: var(--accent) !important; color: var(--accent-ink) !important; border-color: var(--accent-text) !important; }
@media (hover: none) { .reel-cue.fill-btn { background: var(--accent) !important; color: var(--accent-ink) !important; border-color: var(--accent-text) !important; } }
@media (prefers-reduced-motion: reduce) { .fill-btn::before { transition: none; } }

/* FOOTER */
footer { border-top: 1px solid var(--line); }
.foot {
  max-width: calc(var(--wrap) + 2 * var(--gutter));
  margin: 0 auto;
  padding: 28px clamp(16px, 4vw, 48px);
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
}
.foot .brand { font-size: 12px; }
.credit { font-weight: 400; letter-spacing: 0.1em; color: var(--muted); display: inline-flex; align-items: center; gap: .45em; }
.credit .heart { width: 1.15em; height: 1.15em; fill: var(--accent); flex: none; }
.foot nav { margin-left: auto; display: flex; gap: 24px; flex-wrap: wrap; }
.foot nav a, .foot nav button {
  font: inherit; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted);
  background: none; border: 0; padding: 0; cursor: pointer;
}
.foot nav a:hover, .foot nav button:hover { color: var(--accent-text); }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); font-size: 13px; padding: 10px 16px; border-radius: 999px;
}

/* STORY: the project in four lines, under the hero image */
.story { list-style: none; margin: 0 0 8px; padding: 28px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 32px; position: relative; border-top: 1px solid var(--line); }
.story::before { content: ""; position: absolute; left: 0; top: -1px; height: 1.5px; width: 0; background: var(--accent); transition: width 1.6s cubic-bezier(.2, .7, .2, 1) .2s; }
.story.in::before { width: 100%; }
.story li { display: grid; gap: 10px; align-content: start; }
.story p { margin: 0; font-family: var(--serif-text); font-size: clamp(17px, 1.5vw, 19px); line-height: 1.5; color: var(--ink); }

/* KEY DECISIONS */
.dec { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 40px; }
.dec-item { display: grid; gap: 10px; align-content: start; padding-top: 22px; border-top: 1px solid var(--ink); }
.dec-item .cs-h4 { margin: 0; }
.dec-item p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.7; }
.dec-item .dec-over { font-size: 15px; color: var(--muted); }
.dec-item .dec-over span { color: var(--accent-text); margin-right: 4px; }

/* RESUME */
.rv { padding-bottom: clamp(64px, 9vw, 112px); }
.rv .page-head { padding-bottom: 24px; }
.rv-sub { margin: 12px 0 0; color: var(--muted); font-size: 17px; }
.rv-links { margin: 14px 0 0; display: flex; gap: 24px; flex-wrap: wrap; font-size: 15px; }
.rv-links a { border-bottom: 1px solid var(--accent); padding-bottom: 2px; transition: color .2s; }
.rv-links a:hover { color: var(--accent-text); }
.rv-profile { font-family: var(--serif-text); font-size: clamp(20px, 2vw, 25px); line-height: 1.55; margin: 8px 0 0; max-width: 40em; color: var(--ink); }
.rv-sec { padding-top: clamp(48px, 7vw, 80px); }
.rv-sec > h2 { margin: 0 0 8px; }
.rv-row { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 8px 40px; padding: 28px 0; border-top: 1px solid var(--line); }
.rv-row .label { padding-top: 6px; }
.rv-row .cs-h4 { margin: 0; }
.rv-row .cs-h4 a { transition: color .2s; }
.rv-row .cs-h4 a:hover { color: var(--accent-text); }
.rv-arrow { color: var(--accent-text); font-family: var(--sans); font-size: .8em; }
.rv-where { color: var(--accent-text); font-size: 14px; margin: 6px 0 12px; }
.rv-row p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.7; max-width: 44em; }
.rv-row ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; max-width: 46em; }
.rv-row li { position: relative; padding-left: 20px; color: var(--muted); font-size: 16px; line-height: 1.65; }
.rv-row li::before { content: ""; position: absolute; left: 0; top: .8em; width: 9px; height: 1.5px; background: var(--accent); }
.rv-two { display: grid; grid-template-columns: 1fr 1fr; gap: 32px clamp(40px, 6vw, 80px); }
.rv-skills { display: grid; gap: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.rv-skills .cs-h4 { margin: 0 0 6px; font-size: 20px; }
.rv-skills p { margin: 0; color: var(--muted); font-size: 15.5px; line-height: 1.65; }
.rv-awards { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.rv-awards li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; line-height: 1.5; }
.rv-awards li .label { padding-top: 2px; }
.rv-ref { margin-top: 48px; }

/* MOTION: calm reveals that follow the reading order */
.reveal { opacity: 0; transform: translateY(26px); transition: opacity .9s ease, transform 1s cubic-bezier(.2, .7, .2, 1); transition-delay: var(--d, 0s); }
.reveal.in { opacity: 1; transform: none; }
.reveal-img { overflow: hidden; }
.reveal-img img, .reveal-img video { transform: scale(1.06); transition: transform 1.6s cubic-bezier(.2, .7, .2, 1); }
.reveal-img.in img, .reveal-img.in video { transform: none; }
.card:hover .thumb.in > img, .card:hover .thumb.in > .cxa { transform: scale(1.03); transition: transform .9s cubic-bezier(.2,.7,.2,1); }
.hero h1 .w { display: inline-block; opacity: 0; transform: translateY(.45em); transition: opacity .8s ease, transform .9s cubic-bezier(.2, .7, .2, 1); transition-delay: calc(var(--i) * 45ms + .1s); }
.hero h1.in .w { opacity: 1; transform: none; }

@media (max-width: 860px) {
  .story { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dec { grid-template-columns: minmax(0, 1fr); }
  .rv-two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .story { grid-template-columns: minmax(0, 1fr); }
  .rv-row { grid-template-columns: minmax(0, 1fr); padding: 22px 0; }

}

/* USER FLOW: lanes with steps on a line */
.fl { display: grid; }
.fl-lane { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 24px; padding: 24px 0; border-top: 1px solid var(--line); align-items: start; }
.fl-name { display: grid; gap: 6px; }
.fl-name h4 { margin: 0; font-family: var(--serif-text); font-weight: 400; font-size: 21px; line-height: 1.25; color: var(--ink); }
.fl-track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0 12px; }
.fl-track li { position: relative; padding-top: 28px; }
.fl-dot { position: absolute; top: 0; left: 0; width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--accent); background: var(--bg); z-index: 1; transition: transform .5s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i) * 70ms + .2s); }
.fl-track li:last-child .fl-dot { background: var(--accent); }
.fl-track li:not(:last-child)::after { content: ""; position: absolute; top: 6px; left: 13px; right: -12px; height: 1px; background: var(--muted); opacity: .45; transform-origin: left; transition: transform .7s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i) * 70ms + .25s); }
.fl-txt { display: block; font-size: 15.5px; line-height: 1.4; color: var(--ink); padding-right: 8px; }

.fl-ia { display: grid; gap: 18px; padding-top: 28px; border-top: 1px solid var(--line); }
.fl-tabs { display: grid; grid-template-columns: repeat(var(--c), minmax(0, 1fr)); gap: 24px; }
.fl-tabs h4 { margin: 0 0 8px; font-family: var(--serif-text); font-weight: 400; font-size: 21px; color: var(--ink); }
.fl-tabs ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.fl-tabs li { color: var(--muted); font-size: 15.5px; line-height: 1.5; }
@media (max-width: 760px) {
  .fl-lane { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .fl-track { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .fl-track li { padding: 0 0 16px 28px; }
  .fl-track li:not(:last-child)::after { top: 13px; bottom: 0; left: 6px; right: auto; width: 1px; height: auto; transform-origin: top; }
  .lcb.reveal:not(.in) .fl-track li::after { transform: scaleY(0); }
  .fl-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* resume: references and skills */
.rv-quotes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 40px; padding-top: 24px; border-top: 1px solid var(--line); }

.rv-quotes blockquote { margin: 0; font-family: var(--serif-text); font-size: clamp(18px, 1.6vw, 21px); line-height: 1.5; color: var(--ink); }
.rv-quotes figcaption { display: grid; gap: 4px; font-size: 15px; color: var(--ink); }
.rv-traits { list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
.rv-traits li { border: 1px solid var(--line); background: #FFFFFF; padding: 7px 14px; border-radius: 999px; font-size: 14px; color: var(--ink); }
.rv-note { margin: 16px 0 0; color: var(--muted); font-size: 14px; }
.rv-skillgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px 40px; padding-top: 8px; }
.rv-skill { display: grid; gap: 10px; align-content: start; padding-top: 20px; border-top: 1px solid var(--ink); }
.rv-skill .cs-h4 { margin: 0; }
.rv-skill p { margin: 0; color: var(--muted); font-size: 15.5px; line-height: 1.65; }
.rv-skill ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.rv-skill li { position: relative; padding-left: 18px; color: var(--muted); font-size: 15.5px; line-height: 1.5; }
.rv-skill li::before { content: ""; position: absolute; left: 0; top: .72em; width: 8px; height: 1.5px; background: var(--accent); }
.rv-used { margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; }
.rv-used a { color: var(--accent-text); transition: opacity .2s; }
.rv-used a:hover { opacity: .7; }
.rv-tools { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 12px 40px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line); }
.rv-tools > div { display: flex; flex-wrap: wrap; gap: 10px; }
.rv-tools > div span { border: 1px solid var(--line); background: #FFFFFF; padding: 7px 14px; border-radius: 999px; font-size: 14px; }
.rv-awards { display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; }
@media (max-width: 960px) { .rv-quotes, .rv-skillgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .rv-quotes, .rv-skillgrid, .rv-awards, .rv-tools { grid-template-columns: minmax(0, 1fr); } }

/* FUN: a loose, gallery-style column layout */
.fun { padding-bottom: clamp(64px, 9vw, 112px); }
.fun-cols { columns: 3 300px; column-gap: 28px; }
.fun-item { break-inside: avoid; margin: 0 0 28px; display: grid; gap: 12px; }
.fun-frame { background: var(--panel); border: 1px solid var(--panel-line); overflow: hidden; }
.fun-frame img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease; }
.fun-item:hover .fun-frame img { transform: scale(1.03); }
.fun-item figcaption .cs-h4 { margin: 0 0 4px; }
.fun-item figcaption p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }

/* LIVE APP PROTOTYPE: the real screens in a phone, scaled to fit */
.app-demo { margin: 0; background: var(--panel); border: 1px solid var(--panel-line); padding: clamp(28px, 5vw, 56px) 16px 22px; display: grid; justify-items: center; gap: 20px; }
.app-phone { width: min(340px, 80vw); aspect-ratio: 410 / 864; border: 10px solid var(--phone); border-radius: 48px; overflow: hidden; background: var(--phone); position: relative; box-shadow: 0 30px 60px -30px rgba(20, 24, 32, .45); }
.app-phone iframe { position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; transform-origin: 0 0; transform: scale(var(--s, .82)); }
.app-demo figcaption { display: flex; gap: 28px; }
.app-demo figcaption .label { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); transition: color .2s; }
.app-demo figcaption .label:hover { color: var(--accent-text); }

/* AGRILITE DESIGN SYSTEM board, in the portfolio's panel style */
.agds { display: grid; gap: 20px; }
.agds-panel { background: var(--panel); border: 1px solid var(--panel-line); padding: clamp(16px, 2.4vw, 24px); display: grid; gap: 18px; align-content: start; }
.agds-two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.agds-sw { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.agds-sw > div { background: #FFFFFF; padding: 14px; display: grid; gap: 6px; align-content: start; }
.agds-sw span { height: 64px; border-radius: 10px; }
.agds-sw b { font-weight: 500; font-size: 15px; margin-top: 6px; }
.agds-sw code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.agds-sw p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
.agds-type, .agds-comp { display: grid; gap: 0; background: #FFFFFF; }
.agds-type > div, .agds-comp > div { display: grid; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--panel-line); }
.agds-type > div:last-child, .agds-comp > div:last-child { border-bottom: 0; }
.agds small { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.agds .t1, .agds .t2, .agds .t3, .agds .t4, .agds-comp span { font-family: "Poppins", var(--sans); color: #111111; }
.agds .t1 { font-weight: 600; font-size: 21px; letter-spacing: .32em; }
.agds .t2 { font-weight: 600; font-size: 15px; letter-spacing: .38em; }
.agds .t3 { font-size: 38px; line-height: 1; }
.agds .t4 { font-size: 12.5px; }
.ag-btn { justify-self: start; background: #275317; color: #FFFFFF !important; border-radius: 12px; height: 40px; padding: 0 26px; display: grid; place-items: center; font-size: 14px; font-weight: 500; }
.ag-in { border: 1.5px solid #3C3C3C; border-radius: 999px; height: 44px; padding: 0 20px; display: flex; align-items: center; font-size: 13px; max-width: 280px; }
.ag-chips { display: flex; gap: 8px; }
.ag-chips i, .ag-pill { font-style: normal; border: 1.5px solid #3C3C3C; border-radius: 999px; padding: 4px 14px; font-size: 12px; }
.ag-chips i.on { background: #275317; border-color: #275317; color: #FFFFFF; }
.ag-row { display: flex; gap: 12px; align-items: center; }
.ag-pill { border-width: 2px; }
.ag-tog { width: 46px; height: 26px; border-radius: 13px; border: 2px solid #111111; position: relative; }
.ag-tog::after { content: ""; position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: #111111; }
.ag-bar { height: 7px; border-radius: 4px; max-width: 280px; position: relative; background: linear-gradient(90deg, #E31212 0%, #E31212 12%, #EDC15A 50%, #91C480 82%, #91C480 100%); margin: 6px 0; }
.ag-bar i { position: absolute; left: 23%; top: -5px; width: 2px; height: 17px; background: #111111; }
@media (max-width: 860px) { .agds-two { grid-template-columns: minmax(0, 1fr); } .agds-sw { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 400px) { .agds .t1 { font-size: 17px; letter-spacing: .24em; } }

/* LOVE CHORES: research artefacts, in the portfolio's own style */
.lc2-panel { margin: 0; background: var(--panel); border: 1px solid var(--panel-line); padding: clamp(16px, 2.4vw, 24px); display: grid; gap: 18px; align-content: start; }
.lc2-card { background: #FFFFFF; border: 1px solid var(--panel-line); padding: 18px 20px; display: grid; gap: 8px; align-content: start; }
.lc2-card h4 { margin: 0; font-family: var(--serif-text); font-weight: 400; font-size: 19px; line-height: 1.3; color: var(--ink); }
.lc2-card p, .lc2-card li { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
.lc2-card ul, .lc2-persona ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.lc2-card li, .lc2-persona li { position: relative; padding-left: 16px; }
.lc2-card li::before, .lc2-persona li::before { content: ""; position: absolute; left: 0; top: .72em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.lc2-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.lc2-two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
.lc2-n { font-family: var(--mono); font-size: 12px; color: var(--accent-text); }

/* personas: both partners side by side */
.lc2-personas { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.lc2-persona { background: #FFFFFF; border: 1px solid var(--panel-line); padding: clamp(20px, 2.6vw, 30px); display: grid; gap: 18px; align-content: start; }
.lc2-persona header { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 20px; align-items: center; }
.lc2-ph { width: 112px; aspect-ratio: 1; overflow: hidden; background: var(--panel); }
.lc2-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lc2-persona .cs-h3 { margin: 4px 0 2px; }
.lc2-meta { margin: 0; color: var(--muted); font-size: 14px; }
.lc2-persona blockquote { margin: 0; padding-left: 18px; border-left: 2px solid var(--accent); font-family: var(--serif-text); font-style: italic; font-size: clamp(18px, 1.6vw, 21px); line-height: 1.45; color: var(--ink); }
.lc2-bio { margin: 0; color: var(--muted); font-size: 15.5px; line-height: 1.65; }
.lc2-cols { display: grid; gap: 16px; padding-top: 18px; border-top: 1px solid var(--line); }
.lc2-cols .cs-label { font-size: 12px; margin-bottom: 8px; }
.lc2-persona li { color: var(--ink); opacity: .8; font-size: 15px; line-height: 1.55; }

/* journey: both partners' emotions on one line chart */
.bnj { margin: 0; background: #FFFFFF; border: 1px solid var(--panel-line); padding: clamp(18px, 2.6vw, 30px); display: grid; gap: 14px; }
.bnj-scroll { container-type: inline-size; }
.bnj-in { width: 100%; }
.bnj-chart { position: relative; height: 16cqw; margin: .6cqw 0 3.2cqw; }
.bnj-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.bnj-line { fill: none; stroke: var(--accent); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
.bnj-pt { position: absolute; width: 0; height: 0; }
.bnj-pt i { position: absolute; left: -.6cqw; top: -.6cqw; width: 1.2cqw; height: 1.2cqw; border-radius: 50%; background: var(--accent-text); box-shadow: 0 0 0 .35cqw #FFFFFF; }
.bnj-pt b { position: absolute; top: 1.2cqw; left: 0; transform: translateX(-50%); font: 500 .95cqw/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.bnj-stages { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 1.2cqw; }
.bnj-stages li { border-top: 1px solid var(--line); padding-top: 1cqw; display: grid; gap: .5cqw; align-content: start; }
.bnj-n { font: 1cqw/1 var(--mono); color: var(--muted); }
.bnj-stages h4 { margin: 0; font-family: var(--serif-text); font-weight: 400; font-size: 1.55cqw; line-height: 1.25; color: var(--ink); }
.bnj-stages p { margin: 0; font-size: 1.12cqw; line-height: 1.5; color: var(--muted); }
.bnj-stages .bnj-feel { margin-top: .3cqw; padding: .8cqw .9cqw; background: #FDEEE7; border-radius: .7cqw; color: var(--ink); }
.bnj-feel span { display: block; font: 600 .9cqw/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-text); margin-bottom: .3cqw; }
.lc2-journey { margin: 0; background: #FFFFFF; border: 1px solid var(--panel-line); padding: clamp(18px, 2.6vw, 30px); display: grid; gap: 14px; }
.lc2-jkey { display: flex; gap: 20px; font-size: 14px; color: var(--ink); }
.lc2-jkey span { display: inline-flex; align-items: center; gap: 8px; }
.lc2-jkey i { width: 22px; height: 3px; border-radius: 2px; }
.lc2-jkey i.a { background: var(--accent); } .lc2-jkey i.b { background: var(--ink); }
.lc2-chart { position: relative; height: clamp(130px, 16vw, 190px); margin: 4px 0 0; }
.lc2-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lc2-chart .g { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-dasharray: 4 5; }
.lc2-chart .la, .lc2-chart .lb { fill: none; stroke-width: 3; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.lc2-chart .la { stroke: var(--accent); } .lc2-chart .lb { stroke: var(--ink); }
.lc2-chart .da { fill: var(--accent); } .lc2-chart .db { fill: var(--ink); }
.lc2-chart circle { vector-effect: non-scaling-stroke; }
.lc2-y { position: absolute; left: 0; transform: translateY(-50%); font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: #FFFFFF; padding-right: 6px; z-index: 1; }
.lc2-stages { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); border-top: 1px solid var(--line); }
.lc2-stage { padding: 16px 14px 4px; display: grid; gap: 10px; align-content: start; }
.lc2-stage + .lc2-stage { border-left: 1px solid var(--line); }
.lc2-stage h4 { margin: 0; font-family: var(--serif-text); font-weight: 400; font-size: 18px; color: var(--ink); }
.lc2-stage p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink); opacity: .82; }
.lc2-stage .ma, .lc2-stage .mb { position: relative; padding-left: 16px; }
.lc2-stage .ma i, .lc2-stage .mb i { position: absolute; left: 0; top: .5em; width: 8px; height: 8px; border-radius: 50%; }
.lc2-stage .ma i { background: var(--accent); } .lc2-stage .mb i { background: var(--ink); }
.lc2-opp { margin-top: 4px; padding-top: 10px; border-top: 1px dashed var(--line); display: grid; gap: 4px; }
.lc2-opp p { color: var(--muted); opacity: 1; }
.lc2-opp .cs-label { font-size: 11px; }

/* empathy map: centre card with the five lenses around it */
.lc2-emp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "q0 c q1" "q3 c q2" "q4 q4 q4"; gap: 14px; }
.lc2-emp .q0 { grid-area: q0; } .lc2-emp .q1 { grid-area: q1; } .lc2-emp .q2 { grid-area: q2; } .lc2-emp .q3 { grid-area: q3; } .lc2-emp .q4 { grid-area: q4; }
.lc2-centre { grid-area: c; border: 1.5px solid var(--accent); }
.lc2-pg { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.lc2-pg .cs-label, .lc2-centre .cs-label { font-size: 11px; margin-bottom: 6px; }

/* mind map */
.lc2-mind { display: grid; gap: 14px; justify-items: center; }
.lc2-hub { background: var(--ink); color: #FFFFFF; border-radius: 999px; padding: 8px 22px; font-size: 15px; }
.lc2-mind .lc2-grid3 { width: 100%; }
.lc2-chal { display: grid; gap: 14px; }
.lc2-q { font-family: var(--serif-text); font-style: italic; font-size: 18px !important; line-height: 1.45 !important; color: var(--ink) !important; }
.lc2-grid3.tight { gap: 12px; }

/* design principles */
.lc2-princ { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px 28px; }
.lc2-princ > div { display: grid; gap: 6px; align-content: start; padding-top: 16px; border-top: 1px solid var(--ink); }
.lc2-princ .cs-h4 { margin: 0; }
.lc2-princ p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }

/* future scenario told with the real screens */
.lc2-story { list-style: none; margin: 0; padding: clamp(24px, 3vw, 40px) clamp(16px, 2.4vw, 28px); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px 18px; background: linear-gradient(180deg, #D7B9FF 0%, #C9A4FA 100%); }
.lc2-story li { display: grid; gap: 16px; align-content: start; }
.lc2-sp .phone { width: 100%; max-width: 200px; margin: 0 auto; }
.lc2-st { background: #FFFFFF; padding: 14px 16px; display: grid; gap: 4px; }
.lc2-st .cs-h4 { margin: 0; font-size: 19px; }
.lc2-st p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }

@media (max-width: 960px) {
  .lc2-princ { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .lc2-story { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .lc2-two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .lc2-personas, .lc2-grid3 { grid-template-columns: minmax(0, 1fr); }
  .lc2-stages { grid-template-columns: minmax(0, 1fr); }
  .lc2-chart svg { left: 64px; width: calc(100% - 64px); }
  .lc2-stage + .lc2-stage { border-left: 0; border-top: 1px solid var(--line); }
  .lc2-emp { grid-template-columns: minmax(0, 1fr); grid-template-areas: "c" "q0" "q1" "q2" "q3" "q4"; }
  .lc2-princ { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .lc2-story { grid-template-columns: minmax(0, 1fr); }
  .lc2-story li { grid-template-columns: 120px minmax(0, 1fr); align-items: center; }
  .lc2-persona header { grid-template-columns: 88px minmax(0, 1fr); gap: 16px; }
  .lc2-ph { width: 88px; }
}

/* fun: volunteering and sprints */
.side { padding-bottom: clamp(48px, 7vw, 80px); display: grid; gap: 22px; }
.side-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px clamp(24px, 4vw, 48px); }
.side-card .thumb { aspect-ratio: 16 / 10; }
.side-q { margin: 10px 0 0; color: var(--muted); font-size: 15.5px; line-height: 1.6; max-width: 34em; }
@media (max-width: 700px) { .side-grid { grid-template-columns: minmax(0, 1fr); } }

/* RESUME: the CV itself, with a download */
.cv { padding-bottom: clamp(64px, 9vw, 112px); }
.cv-cue { flex-basis: 100%; width: max-content; margin-top: 0; }
.cv-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.cv-dl { border: 0; cursor: pointer; font: inherit; background: var(--accent); color: var(--accent-ink); padding: 12px 20px; border-radius: 999px; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; transition: opacity .2s; }

.cv-page { margin: 0 auto; max-width: 900px; background: #FFFFFF; border: 1px solid var(--panel-line); box-shadow: 0 30px 60px -40px rgba(20, 24, 32, .35); }
.cv-page img { width: 100%; display: block; }
.cv-page + .cv-page { margin-top: 28px; }
[data-wait] { opacity: 0; transform: translateY(12px); transition: opacity .6s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
[data-wait].ready { opacity: 1; transform: none; }
.cv-refs { max-width: 900px; margin: clamp(56px, 8vw, 96px) auto 0; }
.cv-refs > h2 { margin: 0 0 8px; font-weight: 400; }
.cv-ref { margin: 32px 0 0; }
.cv-ref figcaption { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 14px; }
.cv-ref figcaption strong { font-family: var(--serif); font-weight: 400; font-size: 22px; }
.cv-ref figcaption span { color: var(--muted); font-size: 14px; }
.about-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(28px, 5vw, 72px); align-items: start; }
.about-portrait { margin: 0; aspect-ratio: 3 / 4; overflow: hidden; background: var(--panel-line); }
.about-portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.about-team img { width: 100%; height: auto; display: block; }
.about-lead { font-family: var(--serif); font-size: clamp(21px, 2.2vw, 26px); line-height: 1.45; margin: 0 0 36px; }
.about-facts { margin: 0; }
.about-facts > div { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 16px; padding: 18px 0; border-top: 1px solid var(--panel-line); }
.about-facts dt { padding-top: 3px; }
.about-facts dd { margin: 0; line-height: 1.7; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ah { text-align: center; padding-block: clamp(32px, 5vw, 64px); min-height: min(calc(100vh - 86px), 920px); min-height: min(calc(100svh - 86px), 920px); display: grid; align-content: center; }
.projects .card.reveal { transform: translateY(80px) scale(.94); transition: opacity 1s ease, transform 1.15s cubic-bezier(.16, 1, .3, 1); }
.projects .card.reveal.in { transform: none; }
.ah-stage { display: grid; justify-items: center; gap: clamp(18px, 2.6vw, 28px); }
.ah-dots { display: block; width: min(100%, 900px); height: clamp(96px, 15vw, 170px); cursor: default; }
.ah-lines { display: grid; width: min(100%, 860px); }
.ah-line { grid-area: 1 / 1; margin: 0; font-family: var(--sans); font-weight: 400; font-size: clamp(24px, 3.4vw, 40px); line-height: 1.3; letter-spacing: -0.01em; color: var(--ink); text-wrap: balance; opacity: 0; transform: translateY(18px); filter: blur(6px); transition: opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1), filter .5s ease; pointer-events: none; }
.ah-line.out { transform: translateY(-14px); }
.ah-line.on { transition-delay: .35s; }
.ah-line.on { opacity: 1; transform: none; filter: none; pointer-events: auto; }
.ah-line em { font-family: var(--serif-italic); font-style: italic; font-size: 1.1em; letter-spacing: 0; }
.ah-bars { display: flex; gap: 12px; margin-top: 6px; }
.ah-bars button { width: clamp(56px, 7vw, 96px); height: 18px; padding: 8px 0; border: 0; background: none; cursor: pointer; }
.ah-bars i { display: block; height: 2px; background: var(--line); position: relative; overflow: hidden; border-radius: 2px; }
.ah-bars i::after { content: ""; position: absolute; inset: 0; background: var(--accent); transform: scaleX(0); transform-origin: left; }
.ah-bars button.done i::after { transform: scaleX(1); }
.ah-bars button.run i::after { animation: ah-fill var(--ah-t, 6s) linear forwards; }
.ah.paused .ah-bars button.run i::after { animation-play-state: paused; }
@keyframes ah-fill { to { transform: scaleX(1); } }
.ah-cta { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px 12px 18px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-family: var(--sans); font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; box-shadow: 0 14px 30px -16px rgba(184,151,228,.9); transition: transform .2s ease, filter .2s ease; }
.ah-cta svg { width: 18px; height: 18px; animation: cue-bob 1.4s ease-in-out infinite; }

.ah .reel-cue { margin-top: 18px; }
.ah-stage:hover ~ .reel-cue.follow { opacity: 0; }
.ah-dots { cursor: crosshair; }
@media (prefers-reduced-motion: reduce) { .ah-line { transition: none; } }
.about-text { max-width: 40em; }
.about-text p { font-size: clamp(17px, 1.6vw, 20px); line-height: 1.75; margin: 0 0 24px; }
.about-text strong { font-weight: 600; color: var(--ink); }

/* image slides in a carousel */

/* FEATURE: screens changing on the left, what and why on the right */

}
.bnj-st .cs-h4 { margin: 8px 0 8px; }

    { type: "section", label: "Key insights", heading: "Retirement isn't feared because of money. It's feared because it feels like the end.",

      ["Reads the pack", "The brochure celebrates retirement as a new chapter, not an ending.", "Curious", 1.1, "They want to make the most of it, like the idea of capturing these moments in the frame, and head to the website."],

    { type: "board", kind: "gallery", caption: "Exploring names, colours and type", c: 1, ratio: "16 / 9", images: [[p("branding-wall"), ""]] },
    { type: "subsection", heading: "Branding and campaigning", lead: "The campaign should make people stop and think: \"What is that? I want to be part of it!\" Bright colours and playful visuals show people having fun, and clear signs make every hub easy to recognise." },
    { type: "bullets", label: "Campaign pillars", items: ["Excitement: make people curious, intrigued and eager to join.", "Belonging: create a sense of community and connection.", "Joy: highlight fun, laughter and enjoyable experiences.", "Pride: make people proud to be part of something meaningful."] },

    { type: "bullets", label: "What we changed", items: ["Events higher up: testers wanted local events first, so they moved above the fold.", "Bigger type: the brochure's text sizes increased, keeping the bold style.", "Clear commitments for cafés: hubs now set their own time slots and capacity."] },

    { type: "section", label: "Impact", heading: "What Beo Nua changes." },
    { type: "points", items: [

      { title: "Easy to join in", text: "Every local event in one place. \"I wouldn't have known where to look for events like that.\" (Café tester)" },

    { type: "bullets", label: "What I learned", items: ["Guerrilla testing works: watching people interact with the probes we built on the street told us more than any survey could.", "The right idea takes time: several ideas didn't land before Beo Nua did, and it went in a different direction to where we started.", "Not everything needs an app: people already use WhatsApp and their local places. Meeting them there is often better than building something new.", "Being seen in person matters: for older adults, posters, hubs and printed packs build trust in a way a website can't.", "Services can change lives: an end to end service can take something as impersonal as retirement admin and turn it into a real new beginning."] },

/* CORTEXUS case study */
function cortexusBlocks() {
  const p = n => `cx/${n}.webp`;
  const W = { shape: "wide", stage: "grey" };
  return [
    { type: "section", label: "Overview", heading: "How might we help designers use AI without losing the soft skills that define them?",
      lead: "Created in collaboration with Accenture, Cortexus is a speculative desktop companion that shows designers which soft skills they're giving away to AI. Some of these skills include decision making, critical thinking, empathy and ideation. Each skill has its own type of mould, which grows in the corners of the brain as designers offload that skill to AI. When they make a conscious effort to do it themselves, for example journaling their own ideas first or using AI to refine a decision they've already made, Cortexus tracks it and the mould begins to regress." },
    { type: "points", items: [
      { title: "20 interviews", text: "With junior to senior designers and researchers, inside and outside Accenture." },
      { title: "2 workshops", text: "A co-design workshop and a critique workshop, with 14 designers in total from inside and outside Accenture." },
      { title: "2 rounds of user testing", text: "With 13 designers in total, testing medium and high fidelity digital prototypes." },
    ]},

    { type: "section", label: "Problem shown in secondary research", heading: "The more designers rely on AI, the less they think for themselves.",
      lead: "AI is now built into every stage of design, from synthesis to prototyping. Skills AI puts at risk are skills that define designers: judgement, critical thinking and empathy. As it is a gradual loss, most designers don't notice it until one day they realise the skills they once relied on, are gone." },
    { type: "board", kind: "stats", caption: "", stats: [
      ["Effort drops", "The more designers trust AI, the less critical thinking they apply. Their role shifts from creating the work to editing AI's ideas.", "Lee et al., 2025", ""],
      ["Practice stops", "Every task offloaded to AI is a missed opportunity to refine a designers skills. Frequent AI use is linked to weaker critical thinking through cognitive offloading.", "Gerlich, 2025", ""],
      ["Skills erode", "Over-reliance on AI raises the risk of cognitive decline and of losing task-specific skills altogether.", "Noorbehbahani & Oyibo, 2026", ""],
    ]},

    { type: "section", label: "Talking to designers", count: "20 designers", heading: "I talked to the designers living through it.",
      lead: "From graphic designers to UX/UI, product, service and interaction designers, I reached people through Accenture and LinkedIn. I wanted to hear how AI actually feels to use, so I chose conversations over surveys." },
    { type: "points", label: "Who I spoke to", items: [
      { title: "AI workflow integrators", text: "Designers with AI embedded in their daily practice." },
      { title: "Non-avid AI users", text: "Designers who don't identify as AI users, or don't use it meaningfully in their process." },
      { title: "Researchers", text: "People working on human and AI interaction projects and PhD level study." },
    ]},
    { type: "cxfaces", caption: "A few of the 20 interviews. Faces pixelated for privacy.", faces: [p("face1"), p("face2"), p("face3"), p("face4"), p("face5")] },
    { type: "cxquotes", label: "What designers told me", quotes: ["I've gotten so used to doing it now, I'm just like, I don't want to turn my brain on.", "Repetition of tasks is how you learn. We're outsourcing the V1 draft to AI and losing that initial friction where learning usually happens.", "It used to be if I had a question, I'd go to someone on my team. Now I'll just ask AI.", "If I've used AI quite a bit and then asked to do something on my own, I'm like, oh God, I don't know. But I do. I went to college."] },

    { type: "section", label: "Affinity mapping", count: "20 interviews", heading: "Turning 20 conversations into evidence.",
      lead: "One interview is a personal story. A pattern that shows up across twenty is evidence. I affinity mapped every interview so the insights would be from what designers said again and again, not from the quotes I personally found most striking." },
    { type: "board", kind: "gallery", caption: "Affinity mapping the interview notes", c: 1, ratio: "16 / 9", contain: true, images: [[p("affinity"), ""]] },

    { type: "section", label: "Key insights", heading: "The risk isn't that AI replaces designers. It's that designers lose the core skills that define who they are.",
      lead: "Four clusters came up again and again. Each one became a design requirement." },
    { type: "points", items: [
      { title: "1. Offloading has already begun." },
      { title: "2. Juniors lose the struggle where learning happens." },
      { title: "3. Confidence erodes before ability does." },
      { title: "4. Every designer values different skills." },
    ]},

    { type: "section", label: "Archetypes", heading: "Two archetypes, formed from the research.",
      lead: "Janice and Ben were defined from the 20 interviews and the affinity map, and each represents a different relationship with AI. I built archetypes rather than traditional personas because how designers used AI depended on their attitude to it, more than their age or role. Each one is grounded in real interview quotes, referenced by participant number." },
    { type: "board", kind: "carousel", caption: "Archetypes", slides: [
      { label: "Unaware Offloader", kind: "archetype", name: "Janice", age: "22-26", nodot: true, job: "Junior Product Designer", photo: p("a-janice"),
        quote: "Now I'm just using Claude for everything.", qref: "P8",
        patterns: ["Uses AI across everyday tasks without noticing.", "Can't clearly define which parts were AI assisted and which were her own work.", "Treats AI like any other tool and doesn't reflect on how it affects her as a designer."],
        relationship: ["No guilt, because she can't define what AI takes away.", "Somewhat positive, as she feels it optimises her current workload.", "Just sees AI as another tool."],
        triggers: ["Moments of friction built into the design process, for reflection.", "A visual understanding of her cognitive losses.", "More visibility of AI usage versus her own input into the design process."],

    { type: "bullets", label: "What I learned", items: ["Prototyping with AI: Cortexus was my first prototype built with Claude. It taught me how to get the best out of AI tools: decide first, then use them to build.", "Speculative design: coming from an engineering background, designing for a future that doesn't exist yet was a completely new way of thinking.", "Designing without references: there was nothing like Cortexus to build a mood board from, so I had to create the direction from research alone.", "Prioritising for different users: I learned to separate what each designer wanted from what they all needed, and to prioritise features within a tight timeframe.", "Handling feedback: managing very different perspectives, and turning them into clear decisions."] },

/* AGRILITE case study: product design, manufacture and app */
function agriliteBlocks() {
  const p = n => `ag/${n}.webp`, g = n => `ag/pb/${n}.webp`, r = n => `ag/rp/${n}.webp`, a = n => `ag/app/${n}.webp`;

  return [
    { type: "section", label: "Overview", heading: "A Soil Sensor And App That Tells Farmers When To Spread Fertiliser.",
      lead: "Agrilite was my final year project at TU Dublin in 2024. I designed the sensor from first sketch to a working prototype, ready for injection moulding, and designed the app that goes with it." },
    { type: "points", items: [
      { title: "Product design", text: "Research, sketching and a final form that's easy to push into the soil." },
      { title: "Design for manufacture", text: "A CAD model built for injection moulding, sealed against water and dirt." },
      { title: "App design", text: "An app that turns soil readings into the right time to spread." },
    ]},

    { type: "section", label: "Problem", heading: "Too Much Fertiliser, At The Wrong Time, Ends Up In Our Lakes, Rivers And Streams.",
      lead: "Farmers were spreading too much fertiliser, or spreading it when the soil was too wet. The rain washed it into streams, rivers and lakes, where the extra nutrients feed toxic algae. As the climate warms, it's getting worse. Algae suffocates the water and kills the wildlife in it. It's toxic to people and pets, so the water can't be used, and it has destroyed people's livelihoods." },

    { type: "section", label: "Lough Neagh", heading: "A Crisis In The News.",
      lead: "In 2023, Lough Neagh, the largest freshwater lake in the UK, turned bright green. It made the problem impossible to ignore." },
    { type: "board", kind: "gallery", caption: "", c: 3, ratio: "4 / 3", contain: true, images: [[r("lough-neagh"), "Algae on the shore of Lough Neagh"], [r("algae-hand"), "Blue-green algae"], [r("eutrophication"), "How extra nutrients suffocate a lake"]] },
    { type: "board", kind: "stats", caption: "", stats: [
      ["40%+", "of Northern Ireland's drinking water comes from Lough Neagh.", "CIWEM", "https://www.ciwem.org/news/lough-neagh-freshwater-emergency"],
      ["56%", "of the phosphorus entering the lough comes from farming, the largest single source.", "AFBI, via CIWEM", "https://www.ciwem.org/news/lough-neagh-freshwater-emergency"],
      ["2023", "The bloom was so big it could be seen from space, and stopped fishing and recreation.", "CIWEM", "https://www.ciwem.org/news/lough-neagh-freshwater-emergency"],
      ["2025", "Commercial eel fishing was halted, as young eels died in thick algae.", "CIWEM", "https://www.ciwem.org/news/lough-neagh-freshwater-emergency"],
    ]},

    { type: "section", label: "Root cause", heading: "The Real Cause Starts On The Farm.",
      lead: "A root cause analysis traced the blooms back to the farm: fertiliser spread at the wrong time, or too much of it, runs off into the water." },
    { type: "board", kind: "gallery", caption: "Root cause analysis", c: 1, ratio: "1891 / 791", contain: true, images: [[r("root-cause"), ""]] },

    { type: "section", label: "Research", heading: "Learning From Farmers And Experts.",
      lead: "I started with a Kano questionnaire to find out what farmers needed and how the product could work. Through UCD, I reached the next generation of farmers, and I also asked about farm size, location and livestock." },
    { type: "points", items: [
      { title: "20 Kano questionnaires", text: "To define what farmers expected, what they wanted, and what would delight them." },
      { title: "3 farm observations", text: "Watching how farmers work, and mapping the current process." },
      { title: "Teagasc", text: "A walkthrough of how soil is tested now, and talks with three experts about what they analyse." },
    ]},
    { type: "board", kind: "gallery", caption: "Stakeholder map", c: 1, ratio: "1840 / 1349", contain: true, images: [[r("stakeholders"), ""]] },
    { type: "points", items: [
      { title: "\"It needs to be easy\"", text: "Both groups were open to new technology, as long as it was simple to use." },
      { title: "Fertiliser is the biggest cost", text: "Prices rose by over 50% after the war in Ukraine, so every bag counts." },
      { title: "Soil testing is outdated", text: "It's a long process, done once every one or two years. There are no real time results, so farmers never know what's in their soil right now." },
    ]},

    { type: "section", label: "Observation", heading: "Three Farms, Three Ways of Working.",
      lead: "I visited a beef suckler farm in Meath, a sheep and beef farm with animals housed in winter, and a free roaming sheep and beef farm. Watching, rather than asking, let me map how the fertilising process really works." },
    { type: "board", kind: "gallery", caption: "", c: 3, ratio: "1038 / 888", contain: true, images: [[r("farm-1"), "Beef suckler farm"], [r("farm-2"), "Housed in winter"], [r("farm-3"), "Free roaming"]] },

    { type: "section", label: "Personas", heading: "The Research Formed Two Personas.",
      lead: "The Kano questionnaires, interviews, farm visits and Teagasc experts pointed to two kinds of farmer, both willing to change how they farm." },
    { type: "board", kind: "carousel", caption: "", slides: [
      { label: "Next generation", kind: "archetype", name: "The next generation", age: "20 to 30", job: "Beef and sheep farmer · Likely to inherit the family farm", photo: r("persona-young"),
        quote: "I'm tech savvy, but you need to make it usable for my father.", qref: "young farmer interview",
        bio: "Tech savvy and open minded. Keen to try new tools that make the farm more profitable and sustainable.",
        cols: [["Goals", ["Make the farm more profitable.", "Spend less on fertiliser.", "Farm more sustainably.", "Grow more grass to cut feed costs."]], ["Pain points", ["Fertiliser is the biggest cost, and prices keep changing.", "Still learning every part of the farm.", "Hard to know the right time to spread without experience."]], ["Opportunities", ["Easy to teach and keen to adopt new technology.", "Could link to sustainability schemes."]]] },
      { label: "Experienced farmer", kind: "archetype", name: "The experienced farmer", age: "40 and over", job: "Beef and sheep farmer · Adapting to new technology", photo: r("persona-exp"),
        quote: "I would be interested, but it needs to be easy.", qref: "farmer interview",
        bio: "Sees how new tools could help, but goes carefully. Willing to try them, but may need help to set them up.",
        cols: [["Goals", ["Make the farm more profitable.", "Grow more grass for winter feed.", "Keep the herd healthy.", "Use less fertiliser, and fit with government schemes."]], ["Pain points", ["Soil is only tested every one or two years.", "Fertiliser prices rose sharply after the war in Ukraine.", "Unpredictable weather makes timing hard."]], ["Needs", ["Something simple that works first time.", "Clear advice, not numbers to interpret."]]] },
    ]},

    { type: "section", label: "Current soil testing", heading: "Soil tests come once a year, and nobody tells you when to spread.",
      lead: "At Teagasc, I walked through how soil is tested today. A farmer takes samples, sends them to a lab and waits for the results. It's a long process, and most farms only do it every one or two years." },
    { type: "points", items: [
      { title: "No real time data", text: "A test shows the soil on one day. It doesn't tell farmers the nutrients in their soil now, after rain, weather and fertiliser have changed it." },
      { title: "Hard to read", text: "Results are full of numbers, so Teagasc sends a consultant to explain them, especially to older farmers." },
      { title: "No timing", text: "Tests say what the soil needs, but not when it's safe to spread." },
    ]},

    { type: "section", label: "The brief", heading: "How might we create a device that helps farmers make decisions on their land in real time, to prevent fertiliser running off into lakes and rivers?" },

    { type: "section", label: "Concept development", heading: "From Five Directions To One Sensor.",
      lead: "I explored drones, robots, handheld devices, devices cattle could use and low tech ideas. I broke each direction down the same way: a How Might We question, reference images, a key insight, then sketches." },
    { type: "board", kind: "gallery", caption: "All five directions", c: 1, ratio: "1064 / 600", contain: true, images: [[r("sk-overview"), ""]] },

    { type: "section", label: "Technology", heading: "Four Probes, A Radio And A Proven Circuit.",

    { type: "subsection", heading: "Presenting Beyond The Village", lead: "We also presented Nutricure at a local recycling centre and a college." },
    { type: "board", kind: "gallery", caption: "", c: 2, ratio: "4 / 3", images: [[p("school"), "Presenting at a local college"], [p("group"), "With staff and students after a presentation"]] },

    { type: "board", kind: "gallery", caption: "", c: 2, ratio: "4 / 3", images: [[p("farmer-spinach"), "A farmer tending site 10, growing spinach"], [p("system-ground"), "A Nutricure bed set up in the ground"]] },

    { type: "quote", intro: "The biggest result wasn't the crop data.", text: "Families started meeting regularly to talk about growing conditions, materials and each other. Nutricure rebuilt a small piece of community infrastructure that people chose to keep." },
    { type: "board", kind: "gallery", caption: "", c: 3, ratio: "4 / 3", images: [[p("dinner"), "Sharing a meal with our hosts"], [p("food"), "Local food"], [p("night"), "An evening together"]] },

    { type: "section", label: "Impact", heading: "Still Growing After We Left.",

    { type: "links", label: "Read more", items: [

function stage(it, shape) {
  const kind = it.stage || "grey";
  const bg = it.bg ? ` style="--bg-img:url('${esc(it.bg)}')"` : "";
  let inner;
  if (it.groups) {
    return `<div class="stage stage-grey groups">${it.groups.map(g => `<div class="grp">${txt(g.label, "div", "cs-label xs")}
      <div class="grp-imgs">${g.images.map(src => `<div>${img(src, "")}</div>`).join("")}</div></div>`).join("")}</div>`;
  }
  if (it.inset) {
    return `<div class="stage stage-grey square inset">${it.image ? img(it.image, it.title || "") : `<div class="ph-doc"></div>`}</div>`;
  }
  if (it.zoom) shape += " zoom";
  if (it.video) inner = `<video poster="${esc(it.video)}.webp" autoplay muted loop playsinline><source src="${esc(it.video)}.webm" type="video/webm"><source src="${esc(it.video)}.mp4" type="video/mp4"></video>
      <div class="vid-ctrl"><button type="button" data-vid="toggle" aria-label="Pause video">${ICON_PAUSE}</button><button type="button" data-vid="replay" aria-label="Replay video">${ICON_REPLAY}</button></div>`;
  else if (it.image) inner = img(it.image, it.title || "") + (it.hot ? `<span class="hot${it.hot[0] > 70 ? " r" : ""}" aria-hidden="true" style="--x:${it.hot[0]}%;--y:${it.hot[1]}%"><span class="hot-ring"></span><span class="hot-tip">${esc(it.hot[2])}</span><svg class="hot-cur" viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1.2L16 21l-3 1.3-3.4-6.8L4 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></span>` : "");
  else inner = phone(it.screen);
  if (it.fit === "phone") return `<div class="stage stage-grey phonefit">${img(it.image, it.title || "")}</div>`;
  return `<div class="stage stage-${kind} ${shape}"${bg}>${inner}</div>`;
}

      <span class="cs-embed-img">${img(b.image, b.title)}</span></a>`,
  feat: b => `<div class="feat${b.booklet ? " feat-full" : ""}">
      <div class="feat-media">${b.booklet ? booklet() : b.video ? `<div class="live on"><video autoplay muted loop playsinline poster="${esc(b.video)}.webp" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"><source src="${esc(b.video)}.webm" type="video/webm"><source src="${esc(b.video)}.mp4" type="video/mp4"></video></div>` : b.live ? `<div class="live" data-live="${b.live}"><img class="live-poster" src="${esc(b.screens[0])}" alt="${esc(b.title)}" loading="lazy"><span class="live-cur" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1.2L16 21l-3 1.3-3.4-6.8L4 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></span></div>` : fader(b.screens.map(image => ({ image })), () => "16 / 9", true)}</div>

        <div><div class="cs-label">Why</div><p>${esc(b.why)}</p></div></div></div>`,
  thesis: () => `<div class="thesis"><p>There's a lot more to the journey than fits here.</p><a class="fill-btn thesis-btn" href="mailto:${SITE.email}?subject=${encodeURIComponent("Request: Cortexus thesis")}">Request my thesis <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>`,
  bnjourney: b => {
    const n = b.stages.length, X = i => (i + .5) / n * 1000, Y = v => 180 - v * 42;
    const d = b.stages.map((st, i) => [X(i), Y(st[3])]).reduce((s, [x, y], i, a) => {
      if (!i) return `M${x} ${y}`;
      const [px, py] = a[i - 1], cx = (px + x) / 2;
      return s + ` C${cx} ${py} ${cx} ${y} ${x} ${y}`;
    }, "");
    return `<figure class="bnj"><figcaption class="cs-label">${esc(b.label)}</figcaption>
      <div class="bnj-scroll"><div class="bnj-in" style="--n:${n}">
        <div class="bnj-chart"><svg viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" class="bnj-line"/></svg>
          ${b.stages.map((st, i) => `<span class="bnj-pt" style="left:${X(i) / 10}%;top:${Y(st[3]) / 2}%"><i></i><b>${esc(st[2])}</b></span>`).join("")}</div>
        <ol class="bnj-stages">${b.stages.map((st, i) => `<li><div class="bnj-n">Stage ${i + 1}</div><h4>${esc(st[0])}</h4><p>${esc(st[1])}</p><p class="bnj-feel"><span>Feels ${esc(st[2].toLowerCase())}</span>${esc(st[4])}</p></li>`).join("")}</ol>
      </div></div></figure>`;
  },

  mxhead: b => `<div class="mxd mxh"><span class="mxe">${esc(b.eyebrow)}</span><h2 class="mxt">${esc(b.title)}</h2>${b.lead ? `<p class="mxl">${b.lead}</p>` : ""}</div>`,

  mxfuture: b => `<div class="mxd mxf">${b.items.map((t, i) => `<div><span class="mxf-n"><i>${i + 1}</i></span><span class="mxf-l">${esc(t)}</span></div>`).join("")}</div>`,
  mxbriefs: b => `<div class="mxd mxb" data-brf><div class="mxb-pick">${b.tabs.map((t, i) => `<button type="button" class="mxb-btn${i ? "" : " on"}" style="--mc:${t.c}" aria-pressed="${i === 0}" onclick="var r=this.closest('[data-brf]');r.querySelectorAll('.mxb-btn').forEach(function(x,j){x.classList.toggle('on',j===${i});x.setAttribute('aria-pressed',j===${i})});r.querySelectorAll('.mxb-panel').forEach(function(x,j){x.hidden=j!==${i}})"><span class="mxe">${esc(t.eyebrow)}</span><span class="mxb-pill">Brief ${i + 1}</span><span class="mxb-d">${t.desc}</span></button>`).join("")}</div>

  briefs: b => `<div class="brf" data-brf><div class="brf-pills">${b.tabs.map((t, i) => `<button type="button" class="lcpill fill-btn${i ? "" : " k"}" aria-pressed="${i === 0}" onclick="var r=this.closest('[data-brf]');r.querySelectorAll('.brf-pills button').forEach(function(x,j){x.classList.toggle('k',j===${i});x.setAttribute('aria-pressed',j===${i})});r.querySelectorAll('.brf-panel').forEach(function(x,j){x.hidden=j!==${i}})">${esc(t.title)}</button>`).join("")}</div>

  rings: b => {
    const R = [272, 182, 92], cx = 300, cy = 300;
    const lab = (t, x, y, cls) => { const ls = t.split("\n"); return `<text x="${x}" y="${y - (ls.length - 1) * 8}" class="${cls}">${ls.map((l, i) => `<tspan x="${x}" dy="${i ? 17 : 0}">${esc(l)}</tspan>`).join("")}</text>`; };
    const around = (items, r, start) => items.map((t, i) => { const a = (start + i * 360 / items.length) * Math.PI / 180; return lab(t, cx + r * Math.cos(a), cy + r * Math.sin(a) + 5, "rg-t"); }).join("");
    const [core, direct, indirect] = b.rings;
    return `<figure class="rg"><figcaption class="cs-label">${esc(b.caption)}</figcaption><div class="rg-grid">
      <svg viewBox="0 0 600 600" role="img" aria-label="${esc(b.caption)}">
        <circle cx="${cx}" cy="${cy}" r="${R[0]}" class="rg-c0"/><circle cx="${cx}" cy="${cy}" r="${R[1]}" class="rg-c1"/><circle cx="${cx}" cy="${cy}" r="${R[2]}" class="rg-c2"/>
        <text x="${cx}" y="${cy - R[0] + 30}" class="rg-h">INDIRECT</text><text x="${cx}" y="${cy - R[1] + 28}" class="rg-h">DIRECT</text>
        ${lab("CORE\n" + core[1].join("\n"), cx, cy + 6, "rg-core")}
        ${around(direct[1], 137, 270 + 180 / direct[1].length)}${around(indirect[1], 228, 270 + 180 / indirect[1].length)}
      </svg>
      <div class="rg-list" hidden>${b.rings.map(([n, items, why], i) => `<div class="rg-item"><div class="rg-k"><i class="rg-d${i}"></i>${esc(n)}</div><p class="rg-who">${esc(items.join(", ").replace(/\n/g, " "))}</p><p>${esc(why)}</p></div>`).join("")}</div>
    </div></figure>`;
  },
  dsys: b => `<figure class="dsy${b.dark ? " dark" : ""}" style="${b.bg ? `--dsy-bg:${b.bg};--dsy-ink:${b.ink}` : ""}">

    ${b.colours.map(([g, cs]) => `<div class="dsy-g"><small>${esc(g)}</small><div class="dsy-sw">${cs.map(c => `<div><i style="background:${c[1]}"></i><b>${esc(c[0])}</b><code>${c[1]}</code>${c[2] ? `<p>${esc(c[2])}</p>` : ""}</div>`).join("")}</div></div>`).join("")}

    </div>
    ${b.note ? `<p class="dsy-note">${esc(b.note)}</p>` : ""}
  </figure>`,
  bnid: () => {
    const flower = c => `<svg viewBox="0 0 40 40" fill="${c}" aria-hidden="true"><ellipse cx="20" cy="9" rx="4" ry="8"/><ellipse cx="20" cy="31" rx="4" ry="8"/><ellipse cx="9" cy="20" rx="8" ry="4"/><ellipse cx="31" cy="20" rx="8" ry="4"/><ellipse cx="12.2" cy="12.2" rx="3.5" ry="7.5" transform="rotate(-45 12.2 12.2)"/><ellipse cx="27.8" cy="27.8" rx="3.5" ry="7.5" transform="rotate(-45 27.8 27.8)"/><ellipse cx="27.8" cy="12.2" rx="3.5" ry="7.5" transform="rotate(45 27.8 12.2)"/><ellipse cx="12.2" cy="27.8" rx="3.5" ry="7.5" transform="rotate(45 12.2 27.8)"/></svg>`;
    const rows = [["#133F41", "#BEC2E5"], ["#BEC2E5", "#D8552C"], ["#E5DECC", "#133F41"], ["#D8552C", "#E5DECC"]];
    return `<div class="bnid">
      <div class="bnid-text">
        <div><div class="cs-label">Colour</div><p>Burnt orange is the main colour: it feels energetic and welcoming, like community and social activity. A soft cream keeps it easy on the eyes for older users, and darker teal and lavender add contrast and trust.</p></div>
        <div><div class="cs-label">Fonts</div><p><b>Bright</b> for headings: a serif that adds personality and feels familiar rather than overly modern. <b>Satoshi</b> for body text: a clean sans-serif that's easy to read in longer sections.</p></div>
        <div><div class="cs-label">Name</div><p>Beo Nua is Irish for "new life", and easy to say for those who don't speak Irish. The tagline, Connect, Explore, Thrive, sums up what it offers.</p></div>
      </div>
      <div class="bnid-sw">${rows.map(([bg, fg]) => `<div class="bnid-row"><span class="bnid-hex">${bg}</span><i style="background:${bg}"></i><div class="bnid-mark" style="background:${bg};color:${fg}"><b>BEO NUA</b>${flower(fg)}</div></div>`).join("")}</div>
    </div>`;
  },
  bncover: () => `<div class="hero-img cs-cover">${img("bn/web-hero.webp", "Beo Nua website on desktop and phone")}${bnAnim()}</div>`,

/* put the key decisions just before the design decisions (or the reflection) */
function withDecisions(p, blocks) {
  if (!p.decisions) return blocks;
  const at = ["Design decisions", "Solution", "Reflection"].map(l => blocks.findIndex(b => b.type === "section" && b.label === l)).find(i => i > -1);
  const block = { type: "decisions", items: p.decisions };
  const sec = { type: "section", id: "sdec", label: "Key decisions", heading: "The calls that shaped it.", lead: "What I chose, what I ruled out, and why." };
  const out = blocks.slice();
  out.splice(at > -1 ? at : out.length, 0, sec, block);
  return out;
}

function withLens(p, blocks) {
  if (!LENS[p.id]) return blocks;
  const i = blocks.findIndex(b => b.type === "points");
  const out = blocks.slice(); out.splice(i > -1 ? i + 1 : 1, 0, { type: "lens", rows: LENS[p.id] }); return out;
}

/* reading progress: the line under Back grows to the full width as you scroll */
function updateProgress() {
  const line = app.querySelector(".progress");
  if (!line) return;
  const bar = line.parentElement;
  const left = line.offsetLeft;
  const start = app.querySelector(".back").offsetWidth + 24;   // resting length
  const full = bar.clientWidth - left * 2;                       // full width
  const max = document.documentElement.scrollHeight - innerHeight;
  const p = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
  line.style.width = (start + (full - start) * p) + "px";
}
let progTick = false;
const onScroll = () => { if (!progTick) { progTick = true; requestAnimationFrame(() => { progTick = false; updateProgress(); }); } };
addEventListener("scroll", onScroll, { passive: true });
addEventListener("resize", onScroll);

/* app videos: play while visible, never for reduced motion */
let vidObserver;
function setupVideos() {
  if (vidObserver) vidObserver.disconnect();
  const vids = [...app.querySelectorAll(".phone video, video[data-auto]")];
  if (!vids.length) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  vids.forEach(v => { v.preload = "metadata"; });
  if (still) return;
  vidObserver = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target;
    if (e.isIntersecting) { const p = v.play(); if (p) p.catch(() => {}); } else v.pause();
  }), { rootMargin: "200px 0px" });
  vids.forEach(v => vidObserver.observe(v));
}

/* carousels */
app.addEventListener("click", e => {
  const btn = e.target.closest("[data-car]");
  if (!btn) return;
  const track = document.getElementById(btn.dataset.car);
  const n = track.children.length;
  const cur = Math.round(track.scrollLeft / track.clientWidth);
  const i = btn.dataset.i != null ? +btn.dataset.i : Math.max(0, Math.min(n - 1, cur + +btn.dataset.step));
  track.scrollTo({ left: i * (track.clientWidth + 24) });
  markCar(track, i);
});
function markCar(track, i) {
  document.querySelectorAll(`.car-tab[data-car="${track.id}"]`).forEach(t => {
    const on = +t.dataset.i === i; t.classList.toggle("k", on); t.setAttribute("aria-pressed", on);
  });
}
app.addEventListener("scroll", e => {
  const t = e.target;
  if (!t.classList || !t.classList.contains("car-track")) return;
  clearTimeout(t._s); t._s = setTimeout(() => markCar(t, Math.round(t.scrollLeft / (t.clientWidth + 24))), 80);
}, true);

/* side menu: scroll to section + highlight the one in view */
let tocObserver;
function setupToc() {
  if (tocObserver) tocObserver.disconnect();
  const buttons = [...app.querySelectorAll("[data-goto]")];
  if (!buttons.length) return;
  const mark = id => buttons.forEach(b => b.setAttribute("aria-current", b.dataset.goto === id ? "true" : "false"));
  tocObserver = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) mark(e.target.id); });
  }, { rootMargin: "-30% 0px -60% 0px" });
  buttons.forEach(b => { const s = document.getElementById(b.dataset.goto); if (s) tocObserver.observe(s); });
}
app.addEventListener("click", e => {
  const go = e.target.closest("[data-goto]");
  if (go) { document.getElementById(go.dataset.goto)?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const v = e.target.closest("[data-vid]");
  if (v) {
    const video = v.closest(".stage").querySelector("video");
    const toggle = v.closest(".vid-ctrl").querySelector('[data-vid="toggle"]');
    if (v.dataset.vid === "replay") { video.currentTime = 0; video.play(); }
    else if (video.paused) video.play(); else video.pause();
    const paused = video.paused;
    toggle.innerHTML = paused ? ICON_PLAY : ICON_PAUSE;
    toggle.setAttribute("aria-label", paused ? "Play video" : "Pause video");
  }
});

}
function edToggle() { edOn = !edOn; document.body.classList.toggle("ed-mode", edOn); edBtn.textContent = edOn ? "Done editing" : "Edit text"; edPrep(); }
app.addEventListener("focusout", e => { const el = e.target.closest && e.target.closest("[data-ed-key]"); if (edOn && el) edSave(el); });
app.addEventListener("click", e => { if (edOn && e.target.closest(".ed-el")) { e.preventDefault(); e.stopPropagation(); } }, true);
app.addEventListener("keydown", e => { if (edOn && e.key === "Enter" && !e.shiftKey && e.target.closest(".ed-el")) { e.preventDefault(); e.target.closest(".ed-el").blur(); } });
app.addEventListener("paste", e => { if (!edOn || !e.target.closest(".ed-el")) return; e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text/plain")); });
(async () => {
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db) return;
    edDb = db;
    db.collection("edits").onSnapshot(snap => { edMap = {}; snap.docs.forEach(d => { if (d.exists) edMap[d.id] = d.data(); }); edPrep(); }, () => {});
    const ok = user ? (await user.isOwner()) || (await user.canEdit()) : false;
    if (!ok) return;
    edBtn = document.createElement("button"); edBtn.type = "button"; edBtn.className = "ed-btn lcpill fill-btn"; edBtn.textContent = "Edit text";
    edBtn.addEventListener("click", edToggle); document.body.appendChild(edBtn);
  } catch (e) {}
})();

/* Pill follows the mouse inside each project image */
(function () {
  if (!matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let active = null; // { thumb, follow, x, y, tx, ty }
  let raf = 0;

  function tick() {
    if (!active) { raf = 0; return; }
    const k = still ? 1 : 0.18;
    active.x += (active.tx - active.x) * k;
    active.y += (active.ty - active.y) * k;
    active.follow.style.left = active.x + "px";
    active.follow.style.top = active.y + "px";
    raf = requestAnimationFrame(tick);
  }
  function start() { if (!raf) raf = requestAnimationFrame(tick); }

  app.addEventListener("mousemove", e => {
    const thumb = e.target.closest(".thumb");
    if (!thumb) return;
    const r = thumb.getBoundingClientRect();
    const follow = thumb.querySelector(".follow");
    // keep the pill fully inside the image
    const pw = follow.offsetWidth / 2, ph = follow.offsetHeight / 2;
    const tx = Math.min(Math.max(e.clientX - r.left, pw), r.width - pw);
    const ty = Math.min(Math.max(e.clientY - r.top, ph), r.height - ph);
    if (!active || active.thumb !== thumb) {
      // appear right at the cursor on entry
      active = { thumb, follow, x: tx, y: ty };
    }
    active.tx = tx; active.ty = ty;
    start();
  });
  app.addEventListener("mouseout", e => {
    const thumb = e.target.closest(".thumb");
    if (!thumb || !active || active.thumb !== thumb || thumb.contains(e.relatedTarget)) return;
    active = null; // pill fades out where it is
  });
  window.addEventListener("hashchange", () => { active = null; });
})();
