<style>
/* Layout: single centred column, quiet nav bar, large image-led project cards; one orange accent. Single light look by choice. */
:root {
  --bg: #F9FAFC;
  --ink: #2E3A48;
  --muted: #8A929C;
  --line: #E7EAF0;
  --accent: #B897E4;
  --accent-ink: #1A1424;
  --accent-text: #7349B8;
  --placeholder: #D9D9D9;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --serif: "DM Serif Display", Georgia, "Times New Roman", serif;
  --serif-italic: "Instrument Serif", Georgia, "Times New Roman", serif;
  --serif-text: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --panel: #F0F2F5;
  --panel-line: #E2E6EC;
  --phone: #141414;
  --warm-1: #FFE7A3;
  --warm-2: #FFB25C;
  --photo-1: #8C6A4F;
  --photo-2: #3E2E24;
  --wrap: 1120px;
  --gutter: clamp(16px, 5vw, 68px);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
a:focus, button:focus, a:focus-visible, button:focus-visible, [tabindex]:focus { outline: none; }
* { -webkit-tap-highlight-color: transparent; }
.label {
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 400;
}

/* NAV */
.nav {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  max-width: calc(var(--wrap) + 2 * var(--gutter));
  margin: 0 auto;
  padding: 22px clamp(16px, 4vw, 48px);
  display: flex;
  align-items: center;
  gap: 48px;
}
.brand { font-weight: 600; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.role { font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.nav-links { margin-left: auto; display: flex; gap: 24px; }
.nav-links a {
  font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
  transition: color .2s;
}
.nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--accent-text); }

.is-project .nav { display: none; }
.readbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bg);
}
.readbar-inner { padding: 22px clamp(16px, 4vw, 56px) 18px; }
.readbar .back { padding: 0; border: 0; }
.progress {
  position: absolute; bottom: 0; left: clamp(16px, 4vw, 56px);
  height: 1.5px; width: 94px; background: var(--accent);
  will-change: width;
}
@media (min-width: 1300px) { .is-project .toc ol { top: calc(100px + env(safe-area-inset-top, 0px)); } }

/* PAGE */
main { min-height: 70vh; }
.wrap {
  max-width: calc(var(--wrap) + 2 * var(--gutter));
  margin: 0 auto;
  padding-inline: var(--gutter);
}
.view { display: block; }

/* HERO */
.hero { padding-block: clamp(56px, 10vw, 104px) clamp(48px, 8vw, 100px); }
.hero h1 {
  font-family: var(--sans);
  font-weight: 400;
  font-size: clamp(30px, 4.4vw, 42px);
  line-height: 1.32;
  letter-spacing: -0.01em;
  max-width: 21em;
  margin: 0;
  text-wrap: balance;
}
.hero h1 em {
  font-family: var(--serif-italic);
  font-style: italic;
  font-size: 1.1em;
  letter-spacing: 0;
}

.hero-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(200px, 300px); gap: clamp(32px, 6vw, 96px); align-items: start; }
.hero-split h1 { font-size: clamp(32px, 4.6vw, 54px); line-height: 1.2; max-width: 17em; }
.hero-split .cursor { display: inline-block; width: .55em; height: 2px; margin-left: .25em; background: var(--accent); vertical-align: baseline; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.hero-sub { font-size: clamp(16px, 1.4vw, 18px); line-height: 1.7; color: #5F6873; max-width: 36em; margin: 32px 0 0; }
.hero-sub + .hero-sub { margin-top: 14px; }
.hero-portrait { margin: 0; aspect-ratio: 3 / 4; overflow: hidden; background: var(--panel-line); }
.hero-portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (max-width: 760px) { .hero-split { grid-template-columns: minmax(0, 1fr); } .hero-portrait { max-width: 200px; order: -1; } }
@media (prefers-reduced-motion: reduce) { .hero-split .cursor { animation: none; } }
/* PROJECT LIST */
.projects { display: grid; gap: clamp(40px, 6vw, 56px); padding-bottom: clamp(56px, 8vw, 96px); }
.card { display: grid; gap: 22px; }
.thumb {
  position: relative;
  aspect-ratio: 16 / 8.2;
  max-width: 100%;
  background: var(--placeholder);
  overflow: hidden;
  display: grid;
  place-items: center;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease; }
.card:hover .thumb img { transform: scale(1.02); }
.thumb { cursor: none; }
.follow {
  position: absolute; left: 50%; top: 50%;
  width: max-content;
  white-space: nowrap;
  pointer-events: none;
  transform: translate(-50%, -50%);
}
.pill { pointer-events: none; }
@media (hover: none) { .thumb { cursor: auto; } }
.pill {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--accent); color: var(--accent-ink);
  font-family: var(--sans); font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase;
  padding: 10px 18px 10px 14px; border-radius: 999px; border: 0; cursor: pointer;
  white-space: nowrap; flex-shrink: 0;
  opacity: 0; transform: translateY(6px);
  transition: opacity .25s ease, transform .25s ease;
}
.pill svg { width: 18px; height: 18px; fill: currentColor; }
.thumb:hover .pill, .card:focus-visible .pill { opacity: 1; transform: none; }
@media (hover: none) { .pill { opacity: 1; transform: none; } }
/* TOUCH SCREENS: no hover, so the pill becomes a small tag in the image's corner instead of covering the middle */
@media (hover: none), (pointer: coarse) {
  .thumb .follow { left: auto; top: auto; right: 12px; bottom: 12px; transform: none; }
  .thumb .pill { opacity: 1; transform: none; filter: none; gap: 6px; font-size: 11px; letter-spacing: .06em; padding: 7px 12px 7px 10px; box-shadow: 0 6px 16px -8px rgba(20, 24, 32, .55); }
  .thumb .pill svg { width: 14px; height: 14px; }
  .thumb .pill .pill-long { display: none; }
  .card:hover .thumb::after { background: rgba(20, 24, 32, 0); }
}
.pill-short { display: none; }
@media (hover: none), (pointer: coarse) { .thumb .pill .pill-short { display: inline; } }
.card-title { font-family: var(--serif); font-weight: 400; font-size: clamp(22px, 2.4vw, 26px); line-height: 1.2; margin: 0 0 6px; }
.card:hover .card-title { color: var(--accent-text); }
.card-title { transition: color .2s; }

.card-body { display: grid; gap: 10px; }
.card-body .card-title { margin: 0; }
.card-intro { margin: 0; max-width: 38em; font-size: clamp(16px, 1.5vw, 18px); line-height: 1.6; color: #5F6873; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px 22px; padding-top: 4px; }
.card-meta .label + .label { position: relative; }
.card-meta .label + .label::before { content: ""; position: absolute; left: -12px; top: 50%; width: 3px; height: 3px; border-radius: 50%; background: var(--muted); transform: translateY(-50%); }
.card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.card-time { position: absolute; left: 14px; top: 14px; z-index: 2; display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px 7px 10px; border-radius: 999px; background: #FFFFFF; color: var(--accent-text); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; box-shadow: 0 6px 18px -10px rgba(20, 24, 32, .5); }
.card-time svg { width: 14px; height: 14px; color: var(--accent-text); }
.proto-link { display: flex; align-items: center; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap; margin-top: 18px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.proto-go { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
.proto-go svg { width: 14px; height: 14px; }
.proto-link:hover .proto-go { color: var(--accent-ink) !important; border-color: var(--accent-text) !important; }
.proto-link:hover .proto-go::before { transform: scaleX(1); }
.proto-link:hover .proto-go svg { transform: translate(2px, -2px); }
/* PROTOTYPE VIEWER: opens the full prototype on top of the portfolio, no new tab */
.pv { position: fixed; inset: 0; z-index: 100; background: #0E0E0E; display: flex; flex-direction: column; }
.pv-bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px clamp(16px, 4vw, 56px); background: var(--bg); border-bottom: 1px solid var(--line); }
.pv-bar .label { margin: 0; }
.pv-back { display: inline-flex; align-items: center; gap: 8px; border: 0; border-bottom: 1px solid var(--accent); background: none; color: var(--muted); font: inherit; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; padding: 6px 20px 8px 0; border-radius: 0; cursor: pointer; transition: color .2s ease; }
.pv-back:hover, .pv-back:focus-visible { color: var(--accent-text); }
.pv iframe { flex: 1; width: 100%; border: 0; background: #0E0E0E; }
body.pv-open { overflow: hidden; }
.pv-intro { position: absolute; left: 0; right: 0; bottom: 0; top: var(--pvbar, 58px); z-index: 3; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px 16px; border-top: 1px solid var(--line); }
.pv-intro-in { max-width: 520px; text-align: center; }
@media (max-width: 600px) { .pv-bar > .label { display: none; } }
.pv-intro h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 4vw, 42px); line-height: 1.15; margin: 10px 0 16px; color: var(--ink); text-wrap: balance; }
.pv-intro p { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 0 0 28px; text-wrap: pretty; }
.pv-start { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 999px; font: inherit; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
.pv-start svg { width: 14px; height: 14px; }
.pv-start:hover svg { transform: translateX(3px) !important; }

.pv-tip { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; background: var(--accent); color: var(--accent-ink); font-size: 14px; padding: 10px 18px; border-radius: 999px; white-space: nowrap; box-shadow: 0 10px 24px -12px rgba(0,0,0,.6); animation: pvTip 1.6s ease-in-out infinite; transition: opacity .3s ease; }
.pv-tip::before { content: ""; position: absolute; left: var(--ax, 50%); top: -6px; width: 12px; height: 12px; background: var(--accent); transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
.pv-tip b { font-weight: 600; }
.pv-tip.gone { opacity: 0; }
.pv-tip.up::before { top: auto; bottom: -6px; }
@keyframes pvTip { 0%,100% { margin-top: 0; } 50% { margin-top: 6px; } }
/* CORTEXUS COVER: light backdrop so the dark app window stands out */
.thumb.cx-on, .hero-img.cx-on { background: linear-gradient(135deg, #F6E3D8 0%, #EEE7E6 45%, #E3E7EE 100%); }
.thumb.cx-on > img, .hero-img.cx-on > img { opacity: 0; transition: opacity .8s ease; }
.thumb .cx-live { box-shadow: 0 30px 60px -28px rgba(20, 24, 32, .55), 0 0 0 1px rgba(20, 24, 32, .12); transition: opacity .8s ease, transform .7s cubic-bezier(.2,.7,.2,1), box-shadow .7s ease; }
.card:hover .thumb .cx-live { transform: translateY(-6px) scale(1.015); box-shadow: 0 44px 80px -30px rgba(20, 24, 32, .6), 0 0 0 1px rgba(20, 24, 32, .12); }
/* HOVER: card image dims slightly and the pill springs in */
.thumb::after { content: ""; position: absolute; inset: 0; background: rgba(20, 24, 32, 0); transition: background .5s ease; pointer-events: none; z-index: 1; }
.card:hover .thumb::after { background: rgba(20, 24, 32, .12); }
.thumb .follow { z-index: 2; }
@media (hover: hover) {
  .pill { transform: scale(.6); filter: blur(4px); transition: opacity .3s ease, transform .5s cubic-bezier(.34, 1.56, .64, 1), filter .3s ease; }
  .thumb:hover .pill, .card:focus-visible .pill { transform: scale(1); filter: none; }
}
/* CORTEXUS COVER: the real prototype dashboard, auto-playing, sits in the window */
.cx-live { position: absolute; left: 11.25%; top: 14%; width: 77.5%; height: 74.4%; overflow: hidden; border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity .8s ease; background: #1F1F1F; }
.cx-live.ready { opacity: 1; }
.cx-live iframe { position: absolute; left: 0; top: 0; width: 1440px; height: 752px; border: 0; transform-origin: 0 0; }
.hero-img { position: relative; }
.cxa .tst { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--bf) * .8); background: rgba(30, 30, 30, .97); border: 1px solid var(--pc); text-align: center; opacity: 0; transform: translateY(6px) scale(.97); transition: opacity .35s ease, transform .45s cubic-bezier(.2,.8,.3,1); padding: 0 calc(var(--bf) * 2); }
.cxa .tst.on { opacity: 1; transform: none; }
.cxa .tst svg { width: calc(var(--bf) * 2.6); height: calc(var(--bf) * 2.6); stroke: var(--pc); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.cxa .tst b { font-family: 'Orbitron', 'Space Grotesk', var(--sans); font-weight: 700; letter-spacing: .06em; font-size: calc(var(--bf) * 1.45); color: var(--pc); text-transform: uppercase; }
.cxa .tst em { font-style: normal; font-family: 'Space Grotesk', var(--sans); font-size: calc(var(--bf) * .95); color: var(--pc); border: 1px solid var(--pc); padding: calc(var(--bf) * .45) calc(var(--bf) * 1.2); }
.cxa .tst small { font-family: 'Space Grotesk', var(--sans); font-size: calc(var(--bf) * .9); color: rgba(176,176,176,.6); line-height: 1.4; }
/* CORTEXUS COVER: the prototype's own phase images layered on the screenshot (no embedded page) */
.cxa { position: absolute; inset: 0; pointer-events: none; z-index: 1; --bf: 8px; transform-origin: 50% 50%; }
/* the layer moves exactly with the screenshot underneath, never on its own */
.cxa img { transform: none !important; transition: opacity 1.1s ease !important; }
.reveal-img .cxa { transform: scale(1.06); transition: transform 1.6s cubic-bezier(.2, .7, .2, 1); }
.reveal-img.in .cxa { transform: none; }

.cxa > * { position: absolute; }
.cxa .br img, .cxa .th img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1.1s ease; }
.cxa .br img { object-fit: contain; }
.cxa .th { overflow: hidden; background: #2A2A2A; }
.cxa .th img { object-fit: contain; }
.cxa img.on { opacity: 1; }
.cxa .bd { display: grid; place-items: center; font-family: 'Space Grotesk', var(--sans); font-size: calc(var(--bf) * .92); line-height: 1; white-space: nowrap; border: 1px solid; border-radius: 1px; box-shadow: 0 0 0 2px #2A2A2A; transform: translateY(-50%); transition: color .6s, border-color .6s, background .6s; }
.cxa .bar { height: 2px; background: rgba(176,176,176,.12); overflow: hidden; }
.cxa .bar i { display: block; height: 100%; width: 0; background: var(--pc); }
.cxa .vn { background: #2A2A2A; color: #C9C9C9; font-family: var(--sans); font-weight: 700; font-size: calc(var(--bf) * 2.2); line-height: 1; display: flex; align-items: center; letter-spacing: -.02em; }
.cxa .ek { background: #2A2A2A; }
.cxa .ek path { stroke: var(--pc); transition: stroke .6s; filter: drop-shadow(0 0 2px var(--pc)); }
.cxa .vb { background: #2A2A2A; display: flex; align-items: center; }
.cxa .vb::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; transform: translateY(-50%); background: rgba(176,176,176,.12); }
.cxa .vb i { display: block; position: relative; height: 2px; background: var(--pc); transition: width 1.6s ease-out, background .6s; }
.hero-img { position: relative; }
/* hover zoom: the screenshot and the animated layer on top always move together */
.card:hover .thumb > img, .card:hover .thumb > .cxa { transform: scale(1.03); transition: transform .9s cubic-bezier(.2,.7,.2,1); }
/* PROJECT DETAIL */
.back {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted);
  padding-block: 28px 10px;
  border-bottom: 1px solid var(--accent);
  padding-right: 20px;
}
.back:hover { color: var(--accent-text); }
.detail-head { padding-block: clamp(40px, 6vw, 64px) 28px; }
.detail-head h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 5vw, 48px); line-height: 1.1; margin: 8px 0 0; text-wrap: balance; }
.hero-img { aspect-ratio: 16 / 8.2; background: var(--placeholder); max-width: 100%; overflow: hidden; }
.hero-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.meta {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 28px;
  padding-block: 40px;
}
.meta dt { margin-bottom: 8px; }
.meta dd { margin: 0; font-size: 15px; color: var(--ink); opacity: .78; line-height: 1.7; }
.section { padding-block: 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.section h2 { margin: 0; }
.section p { margin: 0; max-width: 66ch; font-size: 17px; line-height: 1.75; }
.section .img-slot { aspect-ratio: 16 / 9; background: var(--placeholder); max-width: 100%; margin-top: 12px; }
.section .img-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.todo { color: var(--muted); font-style: italic; }
.next {
  margin-block: 56px 80px; padding-top: 32px; border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap;
}
.next a { font-family: var(--serif); font-size: clamp(22px, 3vw, 30px); }
.next a:hover { color: var(--accent-text); }

/* CASE STUDY LAYOUT */
.wrap.wide { max-width: calc(var(--wrap) + 2 * var(--gutter)); }
.cs-layout { display: block; }
.toc { display: none; }
@media (min-width: 1300px) {
  .wrap.wide { max-width: calc(var(--wrap) + 210px + 2 * var(--gutter)); }
  .cs-layout { display: grid; grid-template-columns: 154px minmax(0, 1fr); gap: 56px; }
  .toc { display: block; }
  .toc ol {
    position: sticky; top: calc(110px + env(safe-area-inset-top, 0px));
    list-style: none; margin: 0; padding: 0; display: grid; gap: 10px;
    margin-top: 300px;
  }
  .toc button {
    font: inherit; font-size: 14px; line-height: 1.35; color: var(--muted);
    background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
    transition: color .2s;
  }
  .toc button:hover { color: var(--accent-text); }
  .toc button[aria-current="true"] { color: var(--ink); }
}
.cs-main { min-width: 0; }
.cs-body { display: grid; gap: 40px; padding-bottom: 24px; }

.cs-label {
  font-family: var(--mono); font-size: 15px; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--muted); margin: 0;
}
.cs-label.sm { font-size: 11.5px; text-align: center; }
.cs-section { padding-top: clamp(40px, 7vw, 80px); display: grid; gap: 20px; scroll-margin-top: 90px; }
.cs-h {
  font-family: var(--serif-text); font-weight: 400;
  font-size: clamp(30px, 4.3vw, 46px); line-height: 1.16; letter-spacing: -0.01em;
  margin: 4px 0 0; text-wrap: balance; max-width: 24em;
}
.cs-h3 {
  font-family: var(--serif-text); font-weight: 400;
  font-size: clamp(26px, 3.2vw, 36px); line-height: 1.2; margin: 0; text-wrap: balance;
}
.cs-h4 {
  font-family: var(--serif-text); font-weight: 400;
  font-size: clamp(22px, 2.4vw, 27px); line-height: 1.25; margin: 0 0 10px; text-wrap: balance;
}
.cs-lead, .cs-text p, .cs-points p, .cs-feature-text p, .cs-pairs p {
  color: var(--muted); font-size: clamp(16px, 1.6vw, 18px); line-height: 1.75; margin: 0;
}
.cs-lead { max-width: 64em; }
.cs-text { display: grid; gap: 18px; }
.cs-sub { display: grid; gap: 10px; padding-top: 24px; }

.cs-points-wrap { display: grid; gap: 22px; padding-top: 8px; }
.cs-points { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 24px 48px; }
.cs-points p { max-width: 30ch; }

.cs-panel {
  margin: 0; background: var(--panel); border: 1px solid var(--panel-line);
  padding: clamp(16px, 2.4vw, 24px); display: grid; gap: 16px;
}
.cs-panel-body img { width: 100%; display: block; }
.ph { background: var(--placeholder); width: 100%; }

/* stages: the background a mockup sits on */
.stage {
  position: relative; overflow: hidden; display: grid; place-items: center;
  max-width: 100%; border: 1px solid var(--panel-line);
}
.stage > img, .stage > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.stage.square { aspect-ratio: 1 / 1; }
.stage.wide { aspect-ratio: 16 / 9; }
.stage.phonefit { aspect-ratio: 16 / 11; padding: 6% 0 0; place-items: start center; }
.stage.phonefit > img { position: relative; inset: auto; width: 46%; height: auto; object-fit: initial; border-radius: 22px 22px 0 0; box-shadow: 0 0 0 1px var(--panel-line), 0 20px 40px -20px rgba(20,24,32,.35); }
.stage-grey { background: var(--panel); }
.stage-warm { background: radial-gradient(120% 90% at 85% 90%, var(--warm-2) 0%, transparent 60%), linear-gradient(135deg, var(--warm-1), #FFF6DA 55%, var(--warm-2)); }
.stage-lilac { background: radial-gradient(90% 80% at 80% 85%, #C29BFF 0%, transparent 65%), #D4B3FF; }
.stage-photo { background: linear-gradient(135deg, var(--photo-1), var(--photo-2)); }
.stage-photo::before {
  content: ""; position: absolute; inset: -20px;
  background: var(--bg-img, none) center / cover; filter: blur(14px); transform: scale(1.05);
}
.stage .phone { position: relative; width: 36%; }
.stage.wide .phone { width: 20%; }

/* phone mockup — drop a screenshot in as `screen` */
.phone {
  aspect-ratio: 9 / 19.5;
  background: #FFFFFF;
  border: clamp(4px, 0.8vw, 7px) solid var(--phone);
  border-radius: 17% / 8%;
  overflow: hidden;
  position: relative;
  box-shadow: 0 1px 0 rgba(255,255,255,.3) inset, 0 18px 40px -18px rgba(20, 24, 32, .35);
}
.phone::before {
  content: ""; position: absolute; top: 2.4%; left: 50%; transform: translateX(-50%);
  width: 32%; height: 3.6%; background: var(--phone); border-radius: 999px; z-index: 2;
}
.phone img, .phone video { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; background: #D4B3FF; }

.cs-media .stage { width: 100%; }
.vid-ctrl { position: absolute; top: 16px; right: 16px; display: flex; gap: 10px; z-index: 3; }
.vid-ctrl button {
  width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgba(40, 40, 40, .55); color: #FFFFFF; display: grid; place-items: center;
  backdrop-filter: blur(6px);
}
.vid-ctrl svg { width: 18px; height: 18px; fill: currentColor; }

/* zoomed phone: only the bottom of the phone shows */
.stage.zoom .phone { position: absolute; width: 78%; bottom: 7%; left: 50%; transform: translateX(-50%); }
/* inset image: a document/screenshot sitting inside a grey card */
.stage.inset > img { inset: 4% 9% 0; width: 82%; height: 96%; object-position: top; box-shadow: 0 0 0 1px var(--panel-line); }
.stage.inset .ph-doc { position: absolute; inset: 4% 9% 0; background: #FFFFFF; border: 1px solid var(--panel-line); }
/* grouped photos inside a grey card */
.stage.groups { aspect-ratio: auto; display: grid; place-items: stretch; align-content: center; gap: 22px; padding: clamp(18px, 3vw, 30px); min-height: 100%; }
.stage.groups .grp { display: grid; gap: 12px; }
.stage.groups .grp-imgs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 2vw, 24px); }
.stage.groups .grp-imgs > div { background: var(--placeholder); overflow: hidden; aspect-ratio: 1 / 1; }
.stage.groups .grp-imgs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cs-label.xs { font-size: 13px; }

/* circular thumbnails row */
.circles { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(14px, 3vw, 32px); padding-block: clamp(16px, 4vw, 44px); }
.circles > div { width: clamp(64px, 10vw, 108px); aspect-ratio: 1 / 1; border-radius: 50%; overflow: hidden; background: var(--placeholder); }
.circles img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* pull quote */
.cs-quote { display: grid; gap: 28px; }
.cs-quote blockquote {
  margin: 0; padding: 4px 0 4px 24px; border-left: 2px solid var(--muted);
  font-family: var(--serif-text); font-style: italic; font-weight: 400;
  font-size: clamp(22px, 2.6vw, 30px); line-height: 1.3; text-wrap: balance;
}

.cs-feature { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 48px); align-items: end; }
.cs-feature-text { padding-bottom: 8px; max-width: 26em; }

.cs-gallery { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: var(--gap); }
.cs-gallery .cell { background: var(--placeholder); overflow: hidden; max-width: 100%; }
.cs-gallery .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }

.cs-screens { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(24px, 3vw, 36px); align-items: center; }
.cs-screens .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 260px)); gap: 28px; }
.screen-card {
  margin: 0; background: var(--panel); border: 1px solid var(--panel-line);
  padding: 40px 20px 18px; display: grid; gap: 30px; justify-items: center;
}
.screen-card .phone { width: 56%; }

.cs-pairs-wrap { display: grid; gap: 14px; padding-top: 32px; }
.cs-pairs-wrap .cs-pairs { margin-top: 12px; }
.cs-pairs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 48px; }
.cs-pairs figure { margin: 0; display: grid; gap: 24px; align-content: start; }
.cs-pairs .stage .phone { width: 38%; }

@media (max-width: 760px) {
  .cs-points, .cs-feature, .cs-screens, .cs-pairs { grid-template-columns: minmax(0, 1fr); }
  .cs-points { gap: 28px; }
  .cs-points p { max-width: none; }
  .cs-screens .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .screen-card { padding: 28px 12px 14px; gap: 20px; }
  .screen-card .phone { width: 70%; }
  .cs-gallery[data-n="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .stage .phone { width: 42%; }
  .stage.wide .phone { width: 26%; }
}

/* ============ LOVE CHORES BOARDS — built from the app's own design system ============ */
.lcb {
  --l: #D4B3FF; --k: #121212; --y: #FFD84A; --m: #6E6A73; --w: #FFFFFF;
  background: var(--l); color: var(--k); border-radius: 28px;
  padding: clamp(14px, 3vw, 32px); display: grid; gap: 14px;
  font-family: "Figtree", "Helvetica Neue", Arial, sans-serif; font-size: 13px; line-height: 1.45;
}
.lcb-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.lcpill {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
  border: 1.5px solid var(--k); background: var(--w); color: var(--k);
}
.lcpill.k { background: var(--k); color: var(--w); }
.lcpill.y { background: var(--y); }
.lcc {
  background: var(--w); border: 1.5px solid var(--k); border-radius: 20px; box-shadow: 0 3px 0 var(--k);
  padding: 16px; min-width: 0;
}
.lcc.y { background: var(--y); }
.lcc h4 { margin: 0 0 8px; font-size: 15px; font-weight: 800; letter-spacing: -.01em; line-height: 1.25; }
.lcc h5 { margin: 12px 0 6px; font-size: 11px; font-weight: 700; color: var(--m); text-transform: uppercase; letter-spacing: .05em; }
.lcc h5:first-child { margin-top: 0; }
.lcc p { margin: 0; font-size: 13px; font-weight: 500; }
.lcc p + p { margin-top: 8px; }
.lct { font-size: clamp(22px, 2.4vw, 26px); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin: 0; }
.lcl { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.lcl li { position: relative; padding-left: 18px; font-weight: 500; }
.lcl li::before {
  content: ""; position: absolute; left: 0; top: .42em; width: 8px; height: 8px; border-radius: 50%;
  border: 1.5px solid var(--k); background: var(--w);
}
.lcc.y .lcl li::before { background: var(--y); }
ol.lcl { counter-reset: q; }
ol.lcl li { padding-left: 24px; counter-increment: q; }
ol.lcl li::before { content: counter(q); width: 16px; height: 16px; top: .05em; border-radius: 50%; font-size: 10px; font-weight: 800; display: grid; place-items: center; background: var(--k); color: var(--w); border: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* photo on a board */
.lcb-img { border: 1.5px solid var(--k); border-radius: 16px; overflow: hidden; background: var(--w); box-shadow: 0 3px 0 var(--k); }
.lcb-img img { width: 100%; display: block; }

/* shared grid: equal-height cards, always aligned */
.lcgrid { display: grid; grid-template-columns: repeat(var(--c, 3), minmax(0, 1fr)); gap: 14px; align-items: stretch; }
.lcgrid > .lcc { height: 100%; }

/* persona */
.lcp { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 14px; align-items: stretch; }
.lcp-id { display: grid; gap: 12px; align-content: start; }
.lcp-photo { aspect-ratio: 1 / 1; border-radius: 16px; overflow: hidden; border: 1.5px solid var(--k); }
.lcp-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lcp-main { display: grid; gap: 14px; grid-template-rows: auto 1fr; }
.lcp-quote { font-size: 15px; font-weight: 700; line-height: 1.45; letter-spacing: -.01em; }

/* journey: one card per stage */
.lcj { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 14px; align-items: stretch; }
.lcj { grid-template-rows: auto auto 1fr; row-gap: 14px; }
.lcj-col { display: grid; grid-row: span 3; grid-template-rows: subgrid; gap: 14px; }
.lcj-col .lcpill { justify-content: center; height: 32px; }
.lcj-moods { display: grid; gap: 10px; align-content: start; }
.lcj-m { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; font-weight: 600; line-height: 1.35; }
.dot { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--k); background: var(--w); margin-top: 1px; }
.dot.happy { background: var(--y); }
.dot.unhappy { background: var(--k); }
.lcj-col .lcl { font-size: 12.5px; gap: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }

/* summary card on top of a grid */
.lcsum { display: grid; grid-template-columns: repeat(var(--c, 2), minmax(0, 1fr)); gap: 24px; }
.lcsum .split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

/* rewards */
.bubble { background: var(--y); border: 1.5px solid var(--k); border-radius: 16px; padding: 12px 14px; display: grid; gap: 4px; }
.bubble small { font-size: 11px; font-weight: 700; opacity: .65; }
.bubble b { font-size: 14px; font-weight: 800; line-height: 1.3; }

/* user flow */
.lcf { display: grid; justify-items: center; }
.vl { width: 1.5px; height: 22px; background: var(--k); }
.lcf-split { width: min(560px, 100%); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; position: relative; padding-top: 22px; align-items: stretch; }
.lcf-split::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 22px; border: 1.5px solid var(--k); border-bottom: 0; border-radius: 12px 12px 0 0; }
.field { height: 32px; border: 1.5px solid var(--k); border-radius: 999px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; font-weight: 500; color: var(--m); background: var(--w); }
.lcf-auth { display: grid; gap: 8px; }
.tabbar { display: flex; gap: 4px; background: var(--w); border: 1.5px solid var(--k); border-radius: 999px; padding: 5px; box-shadow: 0 3px 0 var(--k); }
.tabbar span { height: 34px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; font-weight: 700; font-size: 12.5px; }
.tabbar span.on { background: var(--k); color: var(--w); }
.lcf .lcgrid { width: 100%; margin-top: 18px; }

/* testing */
.lcx .lcc { display: grid; gap: 12px; align-content: start; }

@media (max-width: 860px) {
  .lcp { grid-template-columns: minmax(0, 1fr); }
  .lcp-id { grid-template-columns: 120px minmax(0, 1fr); }
  .lcp-id .lcp-photo { grid-row: span 2; }
  .lcgrid { --c: 2 !important; }
  .lcsum { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .lcj { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; }
  .lcj-col { grid-row: auto; grid-template-rows: auto auto 1fr; }
}
@media (max-width: 560px) {
  .lcgrid, .lcsum .split, .lcj { grid-template-columns: minmax(0, 1fr) !important; }
  .lcp-id { grid-template-columns: minmax(0, 1fr); }
  .lcf-split { grid-template-columns: minmax(0, 1fr); padding-top: 0; }
  .lcf-split::before { display: none; }
  .tabbar { gap: 2px; }
  .tabbar span { padding: 0 10px; font-size: 11.5px; height: 30px; }
}

/* design system board */
.ds-sw { display: grid; gap: 10px; align-content: start; }
.ds-chip { aspect-ratio: 16 / 9; border-radius: 14px; border: 1.5px solid var(--k); }
.ds-sw b { font-size: 15px; font-weight: 800; }
.ds-sw code { font-family: var(--mono); font-size: 11.5px; color: var(--m); }
.ds-type { display: grid; gap: 12px; }
.ds-type > div { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.ds-type small { font-size: 11px; font-weight: 700; color: var(--m); }
.ds-type span { font-weight: 800; letter-spacing: -.02em; line-height: 1.15; overflow-wrap: anywhere; }
.ds-parts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 14px; }
.ds-part { display: grid; gap: 8px; align-content: start; }
.ds-part small { font-size: 11px; font-weight: 700; color: var(--m); }
.ds-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn-lc { height: 44px; padding: 0 22px; border-radius: 999px; border: 1.5px solid var(--k); background: var(--w); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
.btn-lc.y { background: var(--y); }
.btn-lc.sm { height: 32px; padding: 0 14px; font-size: 12px; font-weight: 700; }
.btn-lc.k { background: var(--k); color: var(--w); }
.btn-lc.ic { width: 36px; height: 36px; padding: 0; font-size: 15px; }
.chk-lc { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--k); background: var(--w); display: inline-grid; place-items: center; font-size: 12px; font-weight: 800; }
.chk-lc.on { background: var(--k); color: var(--w); }
.bar-lc { height: 10px; border-radius: 999px; border: 1.5px solid var(--k); background: var(--w); overflow: hidden; }
.bar-lc i { display: block; height: 100%; width: 60%; background: var(--k); }
.tabs-lc { display: flex; gap: 16px; font-size: 13px; font-weight: 700; }
.tabs-lc b { border-bottom: 2px solid var(--k); padding-bottom: 4px; }
.tabs-lc span { color: var(--m); }

/* flows */
.flow { display: grid; gap: 14px; }
.flow-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.flow-head h4 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
.flow-head p { margin: 0; font-size: 13px; font-weight: 500; color: var(--k); opacity: .75; }
.flow-steps { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 28px; }
.flow-step { position: relative; display: grid; gap: 12px; justify-items: center; align-content: start; }
.flow-step .phone { width: min(100%, 210px); }
.flow-step:not(:last-child)::after {
  content: "→"; position: absolute; right: -22px; top: 45%; font-size: 16px; font-weight: 800; color: var(--k);
}
.flow-cap { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; font-weight: 700; line-height: 1.35; width: min(100%, 210px); }
.flow-cap .n { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--k); color: var(--w); display: grid; place-items: center; font-size: 10.5px; font-weight: 800; }
.flow + .flow { padding-top: 18px; border-top: 1.5px solid rgba(18, 18, 18, .15); }
@media (max-width: 860px) {
  .flow-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 14px; }
  .flow-step::after { display: none; }
  .ds-parts { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .lcgrid.sw { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .ds-sw p { font-size: 12px; }
  .ds-type > div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}

/* persona avatar */
.lcp-who { display: flex; gap: 14px; align-items: center; }
.lcp-av { flex: none; width: 96px; height: 96px; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--k); background: var(--y); }
.lcp-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lcp-meta { height: auto; min-height: 28px; padding-block: 5px; white-space: normal; line-height: 1.3; }

/* journey opportunity row */
.lcj.opp { grid-template-rows: auto auto 1fr auto; }
.lcj.opp .lcj-col { grid-row: span 4; }
.lcj-opp p { font-weight: 700; }
.lcj-legend { display: flex; justify-content: flex-end; }

/* carousel */
.car-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.car-tab { cursor: pointer; font-family: inherit; height: 32px; padding: 0 16px; font-size: 12.5px; }
.car-arrow { cursor: pointer; font-family: inherit; color: var(--k); }
.car-track { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; gap: 24px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; padding-bottom: 4px; }
.car-track::-webkit-scrollbar { display: none; }
.car-slide { scroll-snap-align: start; min-width: 0; display: grid; gap: 14px; align-content: start; }
@media (prefers-reduced-motion: reduce) { .car-track { scroll-behavior: auto; } }

/* stats */
.lcs { display: grid; gap: 10px; align-content: start; grid-template-rows: auto 1fr auto; }
.lcs-n { font-size: clamp(36px, 4vw, 48px); font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.lcs-src, .lcb-src a { color: var(--k); font-size: 11.5px; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
.lcb-src { margin: 0; font-size: 11.5px; font-weight: 600; }

/* insights */
.lci { display: grid; gap: 10px; align-content: start; grid-template-rows: auto auto auto 1fr; }
.lci-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.lci-src { font-size: 11px; font-weight: 700; color: var(--m); }
.lci-h { font-size: 19px !important; margin: 0 !important; }
.lci-so { display: grid; gap: 8px; align-content: end; padding-top: 12px; border-top: 1.5px dashed rgba(18,18,18,.25); }
.lci-so .lcpill { justify-self: start; }
.lci-so p { font-weight: 700; }

/* flow map */
.lcfm { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 14px; align-items: center; }
.lcfm-t { justify-self: start; height: 32px; }
.lcfm-steps { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lcfm-step { background: var(--w); border: 1.5px solid var(--k); border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 12.5px; box-shadow: 0 2px 0 var(--k); }
.lcfm-arrow { font-weight: 800; }
.lcfm-tabs { display: grid; gap: 14px; justify-items: center; padding-top: 10px; border-top: 1.5px solid rgba(18,18,18,.15); }
.lcfm-tabs .lcgrid { width: 100%; }
@media (max-width: 860px) {
  .lcj.opp .lcj-col { grid-row: auto; grid-template-rows: auto auto 1fr auto; }
  .lcfm { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .lcj-legend { justify-content: flex-start; }
}

/* ============ BEO NUA brand boards ============ */
.bn .lcb.app { --l: #E5DECC; --k: #133F41; --y: #BEC2E5; --w: #FFFDF8; --m: #5E6C6A; --o: #D8552C;
  font-family: "Outfit", "Helvetica Neue", Arial, sans-serif; }
.bn .app .lct, .bn .app .lcc h4, .bn .app .lcs-n, .bn .app .lci-h { font-family: "Young Serif", Georgia, serif; font-weight: 400 !important; letter-spacing: -.01em; }
.bn .app .lcpill.y { background: var(--o); color: #FFFFFF; border-color: var(--o); }
.bn .app .lcc { box-shadow: none; border-radius: 18px; }
.bn .app .lcb-img { box-shadow: none; }
.bn .app .dot.happy { background: var(--o); }

/* gallery */
.gal-cell { margin: 0; display: grid; gap: 8px; align-content: start; }
.gal-cell .lcb-img { aspect-ratio: var(--r, 4 / 3); }
.gal-cell .lcb-img img { width: 100%; height: 100%; object-fit: cover; }
.gal-cell.contain .lcb-img { background: transparent; border: 0; }
.gal-cell.contain .lcb-img img { object-fit: contain; }
.gal-cell figcaption { font-size: 12px; font-weight: 600; color: var(--m); }

/* quotes */
.lcq { display: grid; gap: 10px; align-content: start; }
.lcq::before { content: "\201C"; font-family: "Young Serif", Georgia, serif; font-size: 44px; line-height: .5; color: var(--o, var(--k)); padding-top: 10px; }
.lcq p { font-size: 15px !important; font-weight: 600 !important; line-height: 1.4; }

/* themes */
.lct-theme { display: grid; gap: 8px; align-content: start; }
.lct-theme .tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--o, var(--k)); }

/* steps */
.lcst { display: grid; gap: 8px; align-content: start; grid-template-rows: auto auto 1fr auto; }
.lcst .n { width: 26px; height: 26px; border-radius: 50%; background: var(--k); color: var(--w); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.lcst .lcpill { justify-self: start; align-self: end; }

/* table */
.lctb { overflow-x: auto; }
.lctb table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 520px; }
.lctb th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--m); padding: 8px 10px; border-bottom: 1.5px solid var(--k); }
.lctb td { padding: 10px; border-bottom: 1px solid rgba(19, 63, 65, .15); font-weight: 500; }
.lctb tr:last-child td { border-bottom: 0; }
.lctb td.num, .lctb th.num { text-align: right; }

/* browser frame */
.shot { margin: 0; display: grid; gap: 8px; align-content: start; }
.shot .win { border: 1.5px solid var(--k); border-radius: 14px; overflow: hidden; background: var(--w); }
.shot .bar { height: 22px; display: flex; gap: 5px; align-items: center; padding: 0 10px; border-bottom: 1.5px solid var(--k); }
.shot .bar i { width: 7px; height: 7px; border-radius: 50%; border: 1.2px solid var(--k); }
.shot img, .shot video { width: 100%; display: block; background: var(--l); }
.shot figcaption { font-size: 12px; font-weight: 600; color: var(--m); }
.shot.phone-shot .win { border-radius: 26px; max-width: 220px; justify-self: center; padding: 6px; }
.shot.phone-shot .win img, .shot.phone-shot .win video { border-radius: 20px; }
.vids { align-items: start; }
.shot.phone-shot .bar { display: none; }
.shot.phone-shot figcaption { justify-self: center; }

/* identity */
.idt-logo { display: grid; place-items: center; padding: 18px; }
.idt-logo img { width: min(100%, 220px); }
.idt-fonts { display: grid; gap: 14px; }
.idt-fonts div { display: grid; gap: 2px; }
.idt-fonts small { font-size: 11px; font-weight: 700; color: var(--m); text-transform: uppercase; letter-spacing: .05em; }

/* ============ PLAIN BOARDS: the portfolio's own style ============ */
.lcb.plain {
  --k: var(--ink); --w: #FFFFFF; --y: var(--panel); --m: var(--muted); --l: var(--panel);
  background: transparent; padding: 0; border-radius: 0; gap: 16px;
  font-family: var(--sans); color: var(--ink); font-size: 15px;
}
.lcb.plain .lcb-head > .lcpill:first-child {
  background: none; border: 0; padding: 0; height: auto; color: var(--muted);
  font-family: var(--mono); font-weight: 400; font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
}
.lcb.plain .lcpill {
  background: none; border: 0; padding: 0; height: auto; min-height: 0; border-radius: 0;
  color: var(--muted); font-family: var(--mono); font-weight: 400; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; white-space: normal;
}
.lcb.plain .lcpill.k { color: var(--ink); }
.lcb.plain .chips .lcpill {
  border: 1px solid var(--panel-line); background: #FFFFFF; padding: 5px 12px; border-radius: 999px;
  font-family: var(--sans); font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--ink);
}
.lcb.plain .chips .lcpill.k { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
.lcb.plain .lcc, .lcb.plain .lcc.y {
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 0; box-shadow: none; padding: 22px;
}
.lcb.plain .lcc h4, .lcb.plain .lci-h, .lcb.plain .lct {
  font-family: var(--serif-text); font-weight: 400 !important; font-size: 21px !important; letter-spacing: 0; line-height: 1.25; color: var(--ink);
}
.lcb.plain .lct { font-size: 30px !important; }
.lcb.plain .lcc h5, .lcb.plain .lct-theme .tag, .lcb.plain .lci-src {
  font-family: var(--mono); font-weight: 400; font-size: 11.5px; letter-spacing: .04em; color: var(--muted); text-transform: uppercase;
}
.lcb.plain .lcc p, .lcb.plain .lcl li, .lcb.plain .lcj-m {
  font-size: 15px; font-weight: 400; line-height: 1.65; color: var(--muted);
}
.lcb.plain .lcl li { padding-left: 16px; }
.lcb.plain .lcl li::before { width: 5px; height: 5px; top: .7em; border: 0; background: var(--muted); }
.lcb.plain ol.lcl li { padding-left: 26px; }
.lcb.plain ol.lcl li::before { width: auto; height: auto; top: .1em; background: none; color: var(--ink); font-family: var(--mono); font-size: 12px; font-weight: 400; }
.lcb.plain .lcs-n { font-family: var(--serif-text); font-weight: 400; font-size: clamp(38px, 4vw, 50px); letter-spacing: -.02em; color: var(--ink); }
.lcb.plain .lcs-src, .lcb.plain .lcb-src, .lcb.plain .lcb-src a { font-family: var(--mono); font-weight: 400; font-size: 11.5px; color: var(--muted); }
.lcb.plain .lcb-img { border: 1px solid var(--panel-line); border-radius: 0; box-shadow: none; }
/* persona */
.lcb.plain .lcp-av { border: 0; background: var(--panel-line); width: 88px; height: 88px; }
.lcb.plain .lcp-main > .lcc.y { background: none; border: 0; border-left: 2px solid var(--muted); padding: 4px 0 4px 22px; }
.lcb.plain .lcp-quote { font-family: var(--serif-text); font-style: italic; font-weight: 400; font-size: clamp(19px, 2vw, 23px); line-height: 1.4; color: var(--ink); }
.lcb.plain .lcq::before { display: none; }
.lcb.plain .lcq p { font-family: var(--serif-text) !important; font-style: italic; font-weight: 400 !important; font-size: 19px !important; color: var(--ink) !important; line-height: 1.4; }
/* journey */
.lcb.plain .dot { border: 1px solid var(--muted); width: 11px; height: 11px; margin-top: 6px; }
.lcb.plain .dot.happy { background: var(--accent); border-color: var(--accent-text); }
.lcb.plain .dot.unhappy { background: var(--ink); border-color: var(--ink); }
.lcb.plain .legend .lcpill { gap: 6px; display: inline-flex; align-items: center; margin-left: 12px; }
.lcb.plain .lcj-col > .lcpill { justify-content: flex-start; height: auto; color: var(--ink); }
.lcb.plain .lcj-opp p { color: var(--ink); }
/* insights, steps, misc */
.lcb.plain .lci-so { border-top: 1px solid var(--panel-line); }
.lcb.plain .lci-so p { color: var(--ink); font-weight: 400; }
.lcb.plain .lcst .n { background: none; color: var(--muted); font-family: var(--mono); font-weight: 400; width: auto; height: auto; place-items: start; }
.lcb.plain .bubble { background: #FFFFFF; border: 1px solid var(--panel-line); border-radius: 0; }
.lcb.plain .bubble b { font-family: var(--serif-text); font-weight: 400; font-style: italic; font-size: 17px; }
.lcb.plain .bubble small { font-family: var(--mono); font-weight: 400; opacity: 1; color: var(--muted); }
.lcb.plain .lcfm-step { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 0; box-shadow: none; font-weight: 400; font-size: 14px; }
.lcb.plain .lcfm-arrow { color: var(--muted); font-weight: 400; }
.lcb.plain .lcfm-tabs { border-top: 1px solid var(--panel-line); }
.lcb.plain .tabbar { border: 1px solid var(--panel-line); box-shadow: none; }
.lcb.plain .tabbar span { font-weight: 500; }
.lcb.plain .lctb th { font-family: var(--mono); font-weight: 400; border-bottom-color: var(--panel-line); }
.lcb.plain .lctb td { border-bottom-color: var(--panel-line); color: var(--ink); font-weight: 400; }
.lcb.plain .btn-lc.ic { border: 1px solid var(--panel-line); background: #FFFFFF; box-shadow: none; color: var(--ink); }
.lcb.plain .gal-cell figcaption { font-family: var(--sans); font-weight: 400; font-size: 13px; color: var(--muted); }

/* plain = sample template: text columns, images in grey panels */
.lcb.plain .lcc, .lcb.plain .lcc.y { background: none; border: 0; padding: 0; }
.lcb.plain .lcgrid { gap: 32px 48px; }
.lcb.plain .lcp { gap: 32px; }
.lcb.plain:has(.lcb-img) { background: var(--panel); border: 1px solid var(--panel-line); padding: clamp(16px, 2.4vw, 24px); }
.lcb.plain .lcb-img { border: 0; }
.lcb.plain .lcj { gap: 24px; }
.lcb.plain .lcj-col { gap: 10px; }
.lcb.plain .lcj-opp { border-top: 1px solid var(--panel-line) !important; padding-top: 10px !important; }
.lcb.plain .lcfm-step { background: none; }
.lcb.plain .lcfm-tabs .lcgrid { gap: 24px; }
.lcb.plain .lcs { gap: 6px; }
.lcb.plain .lcp-id { gap: 14px; }
.lcb.plain .car-nav { border-bottom: 1px solid var(--panel-line); padding-bottom: 14px; }
.lcb.plain .lcp-main > .lcc.y { border-left: 2px solid var(--muted); padding-left: 22px; }

/* persona (plain) */
.pp { display: grid; grid-template-columns: minmax(0, 240px) minmax(0, 1fr); gap: clamp(24px, 4vw, 48px); align-items: start; padding-top: 8px; }
.pp.sm { grid-template-columns: minmax(0, 170px) minmax(0, 1fr); }
.pp-photo { aspect-ratio: 4 / 5; overflow: hidden; background: var(--panel); }
.pp-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pp-intro { display: grid; gap: 14px; align-content: start; max-width: 40em; }
.pp-name { font-family: var(--serif-text); font-weight: 400; font-size: clamp(30px, 3.4vw, 40px); line-height: 1.1; margin: 0; color: var(--ink); }
.pp-meta { margin: -6px 0 0; font-family: var(--mono); font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.pp-quote { margin: 6px 0; padding: 2px 0 2px 20px; border-left: 2px solid var(--accent); font-family: var(--serif-text); font-style: italic; font-size: clamp(19px, 2vw, 23px); line-height: 1.4; color: var(--ink); text-wrap: balance; }
.pp-bio { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.7; }
.pp-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 48px; padding-top: 28px; margin-top: 28px; border-top: 1px solid var(--panel-line); }
.pp-cols h5, .pp-scen h5 { margin: 0 0 12px; font-family: var(--mono); font-weight: 400; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.pp-cols .lcl li { color: var(--ink) !important; }
.pp-scen { padding-top: 24px; margin-top: 24px; border-top: 1px solid var(--panel-line); max-width: 46em; }
.pp-scen p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.7; }
.pp-scen p + p { margin-top: 10px; }
@media (max-width: 760px) {
  .pp { grid-template-columns: 120px minmax(0, 1fr); gap: 18px; }
  .pp-cols { grid-template-columns: minmax(0, 1fr); gap: 20px; }
}
@media (max-width: 480px) { .pp { grid-template-columns: minmax(0, 1fr); } .pp-photo { width: 160px; } }

/* identity & design system (plain) */
.lcb.plain .ds-chip { aspect-ratio: 4 / 3; border-radius: 0; border: 1px solid var(--panel-line); }
.lcb.plain .ds-sw { gap: 6px; }
.lcb.plain .ds-sw b { font-family: var(--serif-text); font-weight: 400; font-size: 20px; color: var(--ink); }
.lcb.plain .ds-sw code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.lcb.plain .ds-type small, .lcb.plain .ds-part small, .lcb.plain .idt-fonts small { font-family: var(--mono); font-weight: 400; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.lcb.plain .ds-type span { font-family: "Figtree", "Helvetica Neue", Arial, sans-serif; color: #121212; }
.lcb.plain .ds-parts { --y: #FFD84A; --k: #121212; --w: #FFFFFF; --m: #6E6A73; font-family: "Figtree", "Helvetica Neue", Arial, sans-serif; }
.lcb.plain .ds-parts .lcpill { background: var(--k); color: #fff; border-radius: 999px; padding: 0 10px; height: 24px; display: inline-flex; align-items: center; font-family: "Figtree", sans-serif; font-weight: 700; text-transform: none; font-size: 11px; letter-spacing: 0; }
.lcb.plain .ds-parts .tabbar { border: 1.5px solid #121212; box-shadow: 0 3px 0 #121212; }
.lcb.plain .ds-parts .tabbar span { font-weight: 700; }
.lcb.plain .ds-parts .bar-lc { border-color: #121212; }
.lcb.plain .idt-logo { background: var(--panel); padding: 28px; aspect-ratio: 1; }
.lcb.plain .idt-fonts span { color: #133F41; }

/* bigger screens in design decisions */
.cs-pairs .stage.square .phone { width: 46%; }

/* SIMPLE PAGES */
.page-head { padding-block: clamp(56px, 10vw, 104px) 32px; }
.page-head h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 5vw, 48px); margin: 8px 0 0; }
.fun-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 28px; padding-bottom: 96px; }
.fun-grid .slot { aspect-ratio: 4 / 3; background: var(--placeholder); }
.fun-grid figure { margin: 0; display: grid; gap: 12px; }


/* BUTTON FILL: outlined at rest, orange sweeps in left to right on hover */
.fill-btn { position: relative; overflow: hidden; isolation: isolate; background: transparent !important; color: var(--ink) !important; border: 1px solid var(--ink) !important; box-shadow: none !important; transition: color .25s ease .2s, border-color .3s ease .15s; }
.fill-btn::before { content: ""; position: absolute; inset: -1px; background: var(--accent); transform: scaleX(0); transform-origin: left center; transition: transform .45s cubic-bezier(.65,0,.35,1); z-index: -1; }
.fill-btn:hover, .fill-btn:focus-visible { color: var(--accent-ink) !important; border-color: var(--accent-text) !important; }
.fill-btn:hover::before, .fill-btn:focus-visible::before { transform: scaleX(1); }
.fill-btn svg { transition: transform .35s ease; }
.fill-btn:hover svg { transform: translateY(2px); }
.reel-cue.fill-btn.follow { background: var(--accent) !important; color: var(--accent-ink) !important; border-color: var(--accent-text) !important; }
@media (hover: none) { .reel-cue.fill-btn { background: var(--accent) !important; color: var(--accent-ink) !important; border-color: var(--accent-text) !important; } }
@media (prefers-reduced-motion: reduce) { .fill-btn::before { transition: none; } }

/* FOOTER */
footer { border-top: 1px solid var(--line); }
.foot {
  max-width: calc(var(--wrap) + 2 * var(--gutter));
  margin: 0 auto;
  padding: 28px clamp(16px, 4vw, 48px);
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
}
.foot .brand { font-size: 12px; }
.credit { font-weight: 400; letter-spacing: 0.1em; color: var(--muted); display: inline-flex; align-items: center; gap: .45em; }
.credit .heart { width: 1.15em; height: 1.15em; fill: var(--accent); flex: none; }
.foot nav { margin-left: auto; display: flex; gap: 24px; flex-wrap: wrap; }
.foot nav a, .foot nav button {
  font: inherit; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted);
  background: none; border: 0; padding: 0; cursor: pointer;
}
.foot nav a:hover, .foot nav button:hover { color: var(--accent-text); }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); font-size: 13px; padding: 10px 16px; border-radius: 999px;
}

/* STORY: the project in four lines, under the hero image */
.story { list-style: none; margin: 0 0 8px; padding: 28px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px 32px; position: relative; border-top: 1px solid var(--line); }
.story::before { content: ""; position: absolute; left: 0; top: -1px; height: 1.5px; width: 0; background: var(--accent); transition: width 1.6s cubic-bezier(.2, .7, .2, 1) .2s; }
.story.in::before { width: 100%; }
.story li { display: grid; gap: 10px; align-content: start; }
.story p { margin: 0; font-family: var(--serif-text); font-size: clamp(17px, 1.5vw, 19px); line-height: 1.5; color: var(--ink); }

/* KEY DECISIONS */
.dec { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 40px; }
.dec-item { display: grid; gap: 10px; align-content: start; padding-top: 22px; border-top: 1px solid var(--ink); }
.dec-item .cs-h4 { margin: 0; }
.dec-item p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.7; }
.dec-item .dec-over { font-size: 15px; color: var(--muted); }
.dec-item .dec-over span { color: var(--accent-text); margin-right: 4px; }

/* RESUME */
.rv { padding-bottom: clamp(64px, 9vw, 112px); }
.rv .page-head { padding-bottom: 24px; }
.rv-sub { margin: 12px 0 0; color: var(--muted); font-size: 17px; }
.rv-links { margin: 14px 0 0; display: flex; gap: 24px; flex-wrap: wrap; font-size: 15px; }
.rv-links a { border-bottom: 1px solid var(--accent); padding-bottom: 2px; transition: color .2s; }
.rv-links a:hover { color: var(--accent-text); }
.rv-profile { font-family: var(--serif-text); font-size: clamp(20px, 2vw, 25px); line-height: 1.55; margin: 8px 0 0; max-width: 40em; color: var(--ink); }
.rv-sec { padding-top: clamp(48px, 7vw, 80px); }
.rv-sec > h2 { margin: 0 0 8px; }
.rv-row { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 8px 40px; padding: 28px 0; border-top: 1px solid var(--line); }
.rv-row .label { padding-top: 6px; }
.rv-row .cs-h4 { margin: 0; }
.rv-row .cs-h4 a { transition: color .2s; }
.rv-row .cs-h4 a:hover { color: var(--accent-text); }
.rv-arrow { color: var(--accent-text); font-family: var(--sans); font-size: .8em; }
.rv-where { color: var(--accent-text); font-size: 14px; margin: 6px 0 12px; }
.rv-row p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.7; max-width: 44em; }
.rv-row ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; max-width: 46em; }
.rv-row li { position: relative; padding-left: 20px; color: var(--muted); font-size: 16px; line-height: 1.65; }
.rv-row li::before { content: ""; position: absolute; left: 0; top: .8em; width: 9px; height: 1.5px; background: var(--accent); }
.rv-two { display: grid; grid-template-columns: 1fr 1fr; gap: 32px clamp(40px, 6vw, 80px); }
.rv-skills { display: grid; gap: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.rv-skills .cs-h4 { margin: 0 0 6px; font-size: 20px; }
.rv-skills p { margin: 0; color: var(--muted); font-size: 15.5px; line-height: 1.65; }
.rv-awards { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.rv-awards li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 15.5px; line-height: 1.5; }
.rv-awards li .label { padding-top: 2px; }
.rv-ref { margin-top: 48px; }

/* MOTION: calm reveals that follow the reading order */
.reveal { opacity: 0; transform: translateY(26px); transition: opacity .9s ease, transform 1s cubic-bezier(.2, .7, .2, 1); transition-delay: var(--d, 0s); }
.reveal.in { opacity: 1; transform: none; }
.reveal-img { overflow: hidden; }
.reveal-img img, .reveal-img video { transform: scale(1.06); transition: transform 1.6s cubic-bezier(.2, .7, .2, 1); }
.reveal-img.in img, .reveal-img.in video { transform: none; }
.card:hover .thumb.in > img, .card:hover .thumb.in > .cxa { transform: scale(1.03); transition: transform .9s cubic-bezier(.2,.7,.2,1); }
.hero h1 .w { display: inline-block; opacity: 0; transform: translateY(.45em); transition: opacity .8s ease, transform .9s cubic-bezier(.2, .7, .2, 1); transition-delay: calc(var(--i) * 45ms + .1s); }
.hero h1.in .w { opacity: 1; transform: none; }

@media (max-width: 860px) {
  .story { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dec { grid-template-columns: minmax(0, 1fr); }
  .rv-two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .story { grid-template-columns: minmax(0, 1fr); }
  .rv-row { grid-template-columns: minmax(0, 1fr); padding: 22px 0; }
  .rv-row .label { padding-top: 0; }
}

/* USER FLOW: lanes with steps on a line */
.fl { display: grid; }
.fl-lane { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 24px; padding: 24px 0; border-top: 1px solid var(--line); align-items: start; }
.fl-name { display: grid; gap: 6px; }
.fl-name h4 { margin: 0; font-family: var(--serif-text); font-weight: 400; font-size: 21px; line-height: 1.25; color: var(--ink); }
.fl-track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0 12px; }
.fl-track li { position: relative; padding-top: 28px; }
.fl-dot { position: absolute; top: 0; left: 0; width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--accent); background: var(--bg); z-index: 1; transition: transform .5s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i) * 70ms + .2s); }
.fl-track li:last-child .fl-dot { background: var(--accent); }
.fl-track li:not(:last-child)::after { content: ""; position: absolute; top: 6px; left: 13px; right: -12px; height: 1px; background: var(--muted); opacity: .45; transform-origin: left; transition: transform .7s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i) * 70ms + .25s); }
.fl-txt { display: block; font-size: 15.5px; line-height: 1.4; color: var(--ink); padding-right: 8px; }
.lcb.reveal:not(.in) .fl-dot { transform: scale(0); }
.lcb.reveal:not(.in) .fl-track li::after { transform: scaleX(0); }
.fl-ia { display: grid; gap: 18px; padding-top: 28px; border-top: 1px solid var(--line); }
.fl-tabs { display: grid; grid-template-columns: repeat(var(--c), minmax(0, 1fr)); gap: 24px; }
.fl-tabs h4 { margin: 0 0 8px; font-family: var(--serif-text); font-weight: 400; font-size: 21px; color: var(--ink); }
.fl-tabs ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.fl-tabs li { color: var(--muted); font-size: 15.5px; line-height: 1.5; }
@media (max-width: 760px) {
  .fl-lane { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .fl-track { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .fl-track li { padding: 0 0 16px 28px; }
  .fl-track li:not(:last-child)::after { top: 13px; bottom: 0; left: 6px; right: auto; width: 1px; height: auto; transform-origin: top; }
  .lcb.reveal:not(.in) .fl-track li::after { transform: scaleY(0); }
  .fl-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* resume: references and skills */
.rv-quotes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 40px; padding-top: 24px; border-top: 1px solid var(--line); }
.rv-quotes figure { margin: 0; display: grid; gap: 16px; align-content: start; padding-left: 20px; border-left: 2px solid var(--accent); }
.rv-quotes blockquote { margin: 0; font-family: var(--serif-text); font-size: clamp(18px, 1.6vw, 21px); line-height: 1.5; color: var(--ink); }
.rv-quotes figcaption { display: grid; gap: 4px; font-size: 15px; color: var(--ink); }
.rv-traits { list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
.rv-traits li { border: 1px solid var(--line); background: #FFFFFF; padding: 7px 14px; border-radius: 999px; font-size: 14px; color: var(--ink); }
.rv-note { margin: 16px 0 0; color: var(--muted); font-size: 14px; }
.rv-skillgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px 40px; padding-top: 8px; }
.rv-skill { display: grid; gap: 10px; align-content: start; padding-top: 20px; border-top: 1px solid var(--ink); }
.rv-skill .cs-h4 { margin: 0; }
.rv-skill p { margin: 0; color: var(--muted); font-size: 15.5px; line-height: 1.65; }
.rv-skill ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.rv-skill li { position: relative; padding-left: 18px; color: var(--muted); font-size: 15.5px; line-height: 1.5; }
.rv-skill li::before { content: ""; position: absolute; left: 0; top: .72em; width: 8px; height: 1.5px; background: var(--accent); }
.rv-used { margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; }
.rv-used a { color: var(--accent-text); transition: opacity .2s; }
.rv-used a:hover { opacity: .7; }
.rv-tools { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 12px 40px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line); }
.rv-tools > div { display: flex; flex-wrap: wrap; gap: 10px; }
.rv-tools > div span { border: 1px solid var(--line); background: #FFFFFF; padding: 7px 14px; border-radius: 999px; font-size: 14px; }
.rv-awards { display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; }
@media (max-width: 960px) { .rv-quotes, .rv-skillgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .rv-quotes, .rv-skillgrid, .rv-awards, .rv-tools { grid-template-columns: minmax(0, 1fr); } }

/* FUN: a loose, gallery-style column layout */
.fun { padding-bottom: clamp(64px, 9vw, 112px); }
.fun-cols { columns: 3 300px; column-gap: 28px; }
.fun-item { break-inside: avoid; margin: 0 0 28px; display: grid; gap: 12px; }
.fun-frame { background: var(--panel); border: 1px solid var(--panel-line); overflow: hidden; }
.fun-frame img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease; }
.fun-item:hover .fun-frame img { transform: scale(1.03); }
.fun-item figcaption .cs-h4 { margin: 0 0 4px; }
.fun-item figcaption p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }

/* LIVE APP PROTOTYPE: the real screens in a phone, scaled to fit */
.app-demo { margin: 0; background: var(--panel); border: 1px solid var(--panel-line); padding: clamp(28px, 5vw, 56px) 16px 22px; display: grid; justify-items: center; gap: 20px; }
.app-phone { width: min(340px, 80vw); aspect-ratio: 410 / 864; border: 10px solid var(--phone); border-radius: 48px; overflow: hidden; background: var(--phone); position: relative; box-shadow: 0 30px 60px -30px rgba(20, 24, 32, .45); }
.app-phone iframe { position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; transform-origin: 0 0; transform: scale(var(--s, .82)); }
.app-demo figcaption { display: flex; gap: 28px; }
.app-demo figcaption .label { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); transition: color .2s; }
.app-demo figcaption .label:hover { color: var(--accent-text); }

/* AGRILITE DESIGN SYSTEM board, in the portfolio's panel style */
.agds { display: grid; gap: 20px; }
.agds-panel { background: var(--panel); border: 1px solid var(--panel-line); padding: clamp(16px, 2.4vw, 24px); display: grid; gap: 18px; align-content: start; }
.agds-two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.agds-sw { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.agds-sw > div { background: #FFFFFF; padding: 14px; display: grid; gap: 6px; align-content: start; }
.agds-sw span { height: 64px; border-radius: 10px; }
.agds-sw b { font-weight: 500; font-size: 15px; margin-top: 6px; }
.agds-sw code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.agds-sw p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
.agds-type, .agds-comp { display: grid; gap: 0; background: #FFFFFF; }
.agds-type > div, .agds-comp > div { display: grid; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--panel-line); }
.agds-type > div:last-child, .agds-comp > div:last-child { border-bottom: 0; }
.agds small { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.agds .t1, .agds .t2, .agds .t3, .agds .t4, .agds-comp span { font-family: "Poppins", var(--sans); color: #111111; }
.agds .t1 { font-weight: 600; font-size: 21px; letter-spacing: .32em; }
.agds .t2 { font-weight: 600; font-size: 15px; letter-spacing: .38em; }
.agds .t3 { font-size: 38px; line-height: 1; }
.agds .t4 { font-size: 12.5px; }
.ag-btn { justify-self: start; background: #275317; color: #FFFFFF !important; border-radius: 12px; height: 40px; padding: 0 26px; display: grid; place-items: center; font-size: 14px; font-weight: 500; }
.ag-in { border: 1.5px solid #3C3C3C; border-radius: 999px; height: 44px; padding: 0 20px; display: flex; align-items: center; font-size: 13px; max-width: 280px; }
.ag-chips { display: flex; gap: 8px; }
.ag-chips i, .ag-pill { font-style: normal; border: 1.5px solid #3C3C3C; border-radius: 999px; padding: 4px 14px; font-size: 12px; }
.ag-chips i.on { background: #275317; border-color: #275317; color: #FFFFFF; }
.ag-row { display: flex; gap: 12px; align-items: center; }
.ag-pill { border-width: 2px; }
.ag-tog { width: 46px; height: 26px; border-radius: 13px; border: 2px solid #111111; position: relative; }
.ag-tog::after { content: ""; position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: #111111; }
.ag-bar { height: 7px; border-radius: 4px; max-width: 280px; position: relative; background: linear-gradient(90deg, #E31212 0%, #E31212 12%, #EDC15A 50%, #91C480 82%, #91C480 100%); margin: 6px 0; }
.ag-bar i { position: absolute; left: 23%; top: -5px; width: 2px; height: 17px; background: #111111; }
@media (max-width: 860px) { .agds-two { grid-template-columns: minmax(0, 1fr); } .agds-sw { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 400px) { .agds .t1 { font-size: 17px; letter-spacing: .24em; } }

/* LOVE CHORES: research artefacts, in the portfolio's own style */
.lc2-panel { margin: 0; background: var(--panel); border: 1px solid var(--panel-line); padding: clamp(16px, 2.4vw, 24px); display: grid; gap: 18px; align-content: start; }
.lc2-card { background: #FFFFFF; border: 1px solid var(--panel-line); padding: 18px 20px; display: grid; gap: 8px; align-content: start; }
.lc2-card h4 { margin: 0; font-family: var(--serif-text); font-weight: 400; font-size: 19px; line-height: 1.3; color: var(--ink); }
.lc2-card p, .lc2-card li { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }
.lc2-card ul, .lc2-persona ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.lc2-card li, .lc2-persona li { position: relative; padding-left: 16px; }
.lc2-card li::before, .lc2-persona li::before { content: ""; position: absolute; left: 0; top: .72em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.lc2-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.lc2-two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
.lc2-n { font-family: var(--mono); font-size: 12px; color: var(--accent-text); }

/* personas: both partners side by side */
.lc2-personas { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.lc2-persona { background: #FFFFFF; border: 1px solid var(--panel-line); padding: clamp(20px, 2.6vw, 30px); display: grid; gap: 18px; align-content: start; }
.lc2-persona header { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 20px; align-items: center; }
.lc2-ph { width: 112px; aspect-ratio: 1; overflow: hidden; background: var(--panel); }
.lc2-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lc2-persona .cs-h3 { margin: 4px 0 2px; }
.lc2-meta { margin: 0; color: var(--muted); font-size: 14px; }
.lc2-persona blockquote { margin: 0; padding-left: 18px; border-left: 2px solid var(--accent); font-family: var(--serif-text); font-style: italic; font-size: clamp(18px, 1.6vw, 21px); line-height: 1.45; color: var(--ink); }
.lc2-bio { margin: 0; color: var(--muted); font-size: 15.5px; line-height: 1.65; }
.lc2-cols { display: grid; gap: 16px; padding-top: 18px; border-top: 1px solid var(--line); }
.lc2-cols .cs-label { font-size: 12px; margin-bottom: 8px; }
.lc2-persona li { color: var(--ink); opacity: .8; font-size: 15px; line-height: 1.55; }

/* journey: both partners' emotions on one line chart */
.lc2-journey { margin: 0; background: #FFFFFF; border: 1px solid var(--panel-line); padding: clamp(18px, 2.6vw, 30px); display: grid; gap: 14px; }
.lc2-jkey { display: flex; gap: 20px; font-size: 14px; color: var(--ink); }
.lc2-jkey span { display: inline-flex; align-items: center; gap: 8px; }
.lc2-jkey i { width: 22px; height: 3px; border-radius: 2px; }
.lc2-jkey i.a { background: var(--accent); } .lc2-jkey i.b { background: var(--ink); }
.lc2-chart { position: relative; height: clamp(130px, 16vw, 190px); margin: 4px 0 0; }
.lc2-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lc2-chart .g { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; stroke-dasharray: 4 5; }
.lc2-chart .la, .lc2-chart .lb { fill: none; stroke-width: 3; vector-effect: non-scaling-stroke; stroke-linecap: round; }
.lc2-chart .la { stroke: var(--accent); } .lc2-chart .lb { stroke: var(--ink); }
.lc2-chart .da { fill: var(--accent); } .lc2-chart .db { fill: var(--ink); }
.lc2-chart circle { vector-effect: non-scaling-stroke; }
.lc2-y { position: absolute; left: 0; transform: translateY(-50%); font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: #FFFFFF; padding-right: 6px; z-index: 1; }
.lc2-stages { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); border-top: 1px solid var(--line); }
.lc2-stage { padding: 16px 14px 4px; display: grid; gap: 10px; align-content: start; }
.lc2-stage + .lc2-stage { border-left: 1px solid var(--line); }
.lc2-stage h4 { margin: 0; font-family: var(--serif-text); font-weight: 400; font-size: 18px; color: var(--ink); }
.lc2-stage p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink); opacity: .82; }
.lc2-stage .ma, .lc2-stage .mb { position: relative; padding-left: 16px; }
.lc2-stage .ma i, .lc2-stage .mb i { position: absolute; left: 0; top: .5em; width: 8px; height: 8px; border-radius: 50%; }
.lc2-stage .ma i { background: var(--accent); } .lc2-stage .mb i { background: var(--ink); }
.lc2-opp { margin-top: 4px; padding-top: 10px; border-top: 1px dashed var(--line); display: grid; gap: 4px; }
.lc2-opp p { color: var(--muted); opacity: 1; }
.lc2-opp .cs-label { font-size: 11px; }

/* empathy map: centre card with the five lenses around it */
.lc2-emp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "q0 c q1" "q3 c q2" "q4 q4 q4"; gap: 14px; }
.lc2-emp .q0 { grid-area: q0; } .lc2-emp .q1 { grid-area: q1; } .lc2-emp .q2 { grid-area: q2; } .lc2-emp .q3 { grid-area: q3; } .lc2-emp .q4 { grid-area: q4; }
.lc2-centre { grid-area: c; border: 1.5px solid var(--accent); }
.lc2-pg { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.lc2-pg .cs-label, .lc2-centre .cs-label { font-size: 11px; margin-bottom: 6px; }

/* mind map */
.lc2-mind { display: grid; gap: 14px; justify-items: center; }
.lc2-hub { background: var(--ink); color: #FFFFFF; border-radius: 999px; padding: 8px 22px; font-size: 15px; }
.lc2-mind .lc2-grid3 { width: 100%; }
.lc2-chal { display: grid; gap: 14px; }
.lc2-q { font-family: var(--serif-text); font-style: italic; font-size: 18px !important; line-height: 1.45 !important; color: var(--ink) !important; }
.lc2-grid3.tight { gap: 12px; }

/* design principles */
.lc2-princ { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px 28px; }
.lc2-princ > div { display: grid; gap: 6px; align-content: start; padding-top: 16px; border-top: 1px solid var(--ink); }
.lc2-princ .cs-h4 { margin: 0; }
.lc2-princ p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }

/* future scenario told with the real screens */
.lc2-story { list-style: none; margin: 0; padding: clamp(24px, 3vw, 40px) clamp(16px, 2.4vw, 28px); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px 18px; background: linear-gradient(180deg, #D7B9FF 0%, #C9A4FA 100%); }
.lc2-story li { display: grid; gap: 16px; align-content: start; }
.lc2-sp .phone { width: 100%; max-width: 200px; margin: 0 auto; }
.lc2-st { background: #FFFFFF; padding: 14px 16px; display: grid; gap: 4px; }
.lc2-st .cs-h4 { margin: 0; font-size: 19px; }
.lc2-st p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }

@media (max-width: 960px) {
  .lc2-princ { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .lc2-story { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .lc2-two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .lc2-personas, .lc2-grid3 { grid-template-columns: minmax(0, 1fr); }
  .lc2-stages { grid-template-columns: minmax(0, 1fr); }
  .lc2-chart svg { left: 64px; width: calc(100% - 64px); }
  .lc2-stage + .lc2-stage { border-left: 0; border-top: 1px solid var(--line); }
  .lc2-emp { grid-template-columns: minmax(0, 1fr); grid-template-areas: "c" "q0" "q1" "q2" "q3" "q4"; }
  .lc2-princ { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .lc2-story { grid-template-columns: minmax(0, 1fr); }
  .lc2-story li { grid-template-columns: 120px minmax(0, 1fr); align-items: center; }
  .lc2-persona header { grid-template-columns: 88px minmax(0, 1fr); gap: 16px; }
  .lc2-ph { width: 88px; }
}

/* fun: volunteering and sprints */
.side { padding-bottom: clamp(48px, 7vw, 80px); display: grid; gap: 22px; }
.side-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px clamp(24px, 4vw, 48px); }
.side-card .thumb { aspect-ratio: 16 / 10; }
.side-q { margin: 10px 0 0; color: var(--muted); font-size: 15.5px; line-height: 1.6; max-width: 34em; }
@media (max-width: 700px) { .side-grid { grid-template-columns: minmax(0, 1fr); } }

/* RESUME: the CV itself, with a download */
.cv { padding-bottom: clamp(64px, 9vw, 112px); }
.cv-cue { flex-basis: 100%; width: max-content; margin-top: 0; }
.cv-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.cv-dl { border: 0; cursor: pointer; font: inherit; background: var(--accent); color: var(--accent-ink); padding: 12px 20px; border-radius: 999px; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; transition: opacity .2s; }

.cv-page { margin: 0 auto; max-width: 900px; background: #FFFFFF; border: 1px solid var(--panel-line); box-shadow: 0 30px 60px -40px rgba(20, 24, 32, .35); }
.cv-page img { width: 100%; display: block; }
.cv-page + .cv-page { margin-top: 28px; }
[data-wait] { opacity: 0; transform: translateY(12px); transition: opacity .6s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
[data-wait].ready { opacity: 1; transform: none; }
.cv-refs { max-width: 900px; margin: clamp(56px, 8vw, 96px) auto 0; }
.cv-refs > h2 { margin: 0 0 8px; font-weight: 400; }
.cv-ref { margin: 32px 0 0; }
.cv-ref figcaption { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 14px; }
.cv-ref figcaption strong { font-family: var(--serif); font-weight: 400; font-size: 22px; }
.cv-ref figcaption span { color: var(--muted); font-size: 14px; }
.about-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(28px, 5vw, 72px); align-items: start; }
.about-portrait { margin: 0; aspect-ratio: 3 / 4; overflow: hidden; background: var(--panel-line); }
.about-portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.about-team img { width: 100%; height: auto; display: block; }
