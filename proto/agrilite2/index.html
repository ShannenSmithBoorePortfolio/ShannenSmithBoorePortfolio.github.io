<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agrilite: know when to spread</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   AGRILITE 2.0 DESIGN SYSTEM
   Visual language: soft sage backdrop, white rounded cards, dark pill
   actions, aerial map with floating labels (from the reference board).
   Accessibility: AA+ text contrast, 56px targets, 18px body, status shown
   by icon + word, never colour alone.
   ===================================================================== */
:root {
  --backdrop: linear-gradient(135deg, #7FB46F 0%, #A8CF98 45%, #DCEBD2 100%);
  --paper: #F3F6F1; --surface: #FFFFFF; --ink: #17211A; --ink-2: #4D5A50; --line: #E1E7DD; --line-strong: #8A968C;
  --brand: #1C2B1D; --brand-tint: #EAF3E4; --green: #2F6B2A; --green-2: #4E8C43; --sage: #A9CB9C; --focus: #1C2B1D;
  --go: #22632B; --go-bg: #E3F1DE; --okay: #7A4D00; --okay-bg: #FFF1CC; --stop: #A11F1A; --stop-bg: #FDE4E1;
  --closed: #3E434A; --closed-bg: #EDEDEA; --none: #4D5A50; --none-bg: #F0F3EE;
  --font: "Inter", "Segoe UI", system-ui, sans-serif;
  --tap: 3.5rem; --r: 20px; --bw: 1px; --shadow: 0 1px 2px rgba(23,33,26,.06), 0 8px 24px -12px rgba(23,33,26,.18);
}
html { font-size: 100%; } html[data-size="large"] { font-size: 112.5%; } html[data-size="largest"] { font-size: 125%; }
body.sun { --backdrop: #FFFFFF; --paper: #FFFFFF; --ink: #000; --ink-2: #1A1A1A; --line: #000; --line-strong: #000; --brand: #000; --brand-tint: #FFF; --green: #000; --focus: #000; --bw: 2px; --shadow: none;
  --go: #0B3D16; --okay: #4A2E00; --stop: #6E100C; --closed: #000; --none: #000; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); font-size: 1.125rem; line-height: 1.45; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
body.calm * { transition: none !important; animation: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 10px; }
h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.01em; }
h1 { font-size: 1.75rem; font-weight: 700; } h2 { font-size: 1.3125rem; font-weight: 700; } h3 { font-size: 1.0625rem; font-weight: 700; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; background: var(--brand); color: #fff; padding: 12px 16px; border-radius: 999px; z-index: 50; }
.skip:focus { top: 12px; }
.muted { color: var(--ink-2); }
svg.i { width: 1.5rem; height: 1.5rem; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell: phone first ---------- */
.app { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; grid-template-areas: "top" "net" "main" "nav"; background: var(--paper); }
.app > * { min-width: 0; }
.top { grid-area: top; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface); border-bottom: var(--bw) solid var(--line); position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.375rem; color: var(--ink); text-decoration: none; letter-spacing: -.01em; }
.mark { width: 34px; height: 34px; border-radius: 50%; background: var(--green-2); display: grid; place-items: center; }
.mark svg { width: 20px; height: 20px; fill: #fff; stroke: none; }
body.sun .mark { background: #000; }
.farm { display: none; align-items: center; gap: 6px; min-height: 2.5rem; padding: 0 14px; border-radius: 999px; background: var(--brand-tint); font-size: 1rem; font-weight: 600; color: var(--ink); border: 0; }
.top .spacer { flex: 1; }
.iconbtn { min-height: var(--tap); min-width: var(--tap); display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; border-radius: 999px; border: var(--bw) solid var(--line); background: var(--surface); font-weight: 600; color: var(--ink); }
.iconbtn[aria-pressed="true"] { background: var(--brand-tint); border-color: var(--green); }
.avatar { width: 2.75rem; height: 2.75rem; border-radius: 50%; background: #C9DCC0 url(farmer.webp) center/cover; flex: none; display: none; }
.net { grid-area: net; }
.netbar { display: flex; gap: 10px; align-items: center; padding: 12px 16px; background: var(--okay-bg); color: var(--okay); font-weight: 600; }
body.sun .netbar { background: #fff; border-bottom: 2px solid #000; }
main { grid-area: main; padding: 18px 16px 28px; width: 100%; max-width: 1360px; margin: 0 auto; min-width: 0; }
.nav { grid-area: nav; position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: var(--bw) solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); gap: 4px; }
.nav button { border: 0; background: none; min-height: 4rem; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: .875rem; font-weight: 600; color: var(--ink-2); border-radius: 16px; }
.nav button[aria-current="page"] { color: #fff; background: var(--brand); }
.nav .brandrow, .nav .navfoot { display: none; }
@media (max-width: 759px) { .top .iconbtn .lbl { display: none; } .top [data-sync] { padding: 4px 10px; font-size: .9375rem; } }
@media (max-width: 380px) { .top [data-sync] .t { display: none; } }

/* tablet + desktop: the app sits on the sage backdrop like a product shot */
@media (min-width: 760px) {
  body { background: var(--backdrop); }
  .app { background: linear-gradient(90deg, var(--surface) 96px, var(--paper) 96px); grid-template-columns: 96px minmax(0, 1fr); grid-template-rows: auto auto 1fr; grid-template-areas: "nav top" "nav net" "nav main"; margin: 14px; min-height: calc(100% - 28px); border-radius: 26px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(23,40,20,.45); }
  .nav { grid-template-columns: 1fr; grid-auto-rows: min-content; align-content: start; position: sticky; top: 0; height: calc(100vh - 28px); border-top: 0; border-right: var(--bw) solid var(--line); padding: 16px 12px; gap: 8px; }
  .nav button { min-height: 4.5rem; font-size: .8125rem; }
  .nav .brandrow { display: flex; justify-content: center; padding: 4px 0 14px; }
  .nav .brandrow .brand span.word { display: none; }
  .top { padding: 14px 24px; }
  .top .brand.phone-only { display: none; }
  .top .page-title { display: block; }
  .farm, .avatar { display: inline-flex; }
  main { padding: 22px 24px 32px; }
}
@media (min-width: 1200px) { .app { grid-template-columns: 100px minmax(0, 1fr); background: linear-gradient(90deg, var(--surface) 100px, var(--paper) 100px); } main { padding: 24px 28px 36px; } }
.page-title { display: none; font-size: 1.5rem; font-weight: 700; }

/* ---------- components ---------- */
.card { background: var(--surface); border: var(--bw) solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.card-h h2, .card-h h3 { font-size: 1.0625rem; }
.stack { display: grid; gap: 16px; }
.btn { min-height: var(--tap); padding: 0 24px; border-radius: 999px; border: 2px solid var(--brand); background: var(--brand); color: #fff; font-weight: 600; font-size: 1.0625rem; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.btn.secondary { background: var(--surface); color: var(--brand); }
.btn.block { width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 2.25rem; padding: 4px 12px 4px 8px; border-radius: 999px; font-weight: 600; font-size: .9375rem; border: var(--bw) solid transparent; white-space: nowrap; }
.chip svg { width: 1.25rem; height: 1.25rem; }
.s-go { color: var(--go); background: var(--go-bg); } .s-okay { color: var(--okay); background: var(--okay-bg); } .s-stop { color: var(--stop); background: var(--stop-bg); }
.s-closed { color: var(--closed); background: var(--closed-bg); } .s-none { color: var(--none); background: var(--none-bg); }
body.sun .chip { background: #fff !important; border-color: currentColor; border-width: 2px; }
.eyebrow { font-size: .9375rem; font-weight: 600; color: var(--ink-2); }
.pagehead { display: grid; gap: 4px; margin-bottom: 18px; }
.dots { color: var(--ink-2); font-weight: 700; letter-spacing: 2px; }

/* decision: the most important card */
.decision { border-radius: var(--r); padding: 20px; display: grid; gap: 14px; background: var(--surface); border: var(--bw) solid var(--line); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.decision::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 8px; background: currentColor; }
.decision .big { display: flex; gap: 14px; align-items: flex-start; }
.decision .big svg { width: 2.75rem; height: 2.75rem; }
.decision h2 { font-size: 1.625rem; color: var(--ink); }
.decision.s-go { color: var(--go); background: var(--go-bg); } .decision.s-stop { color: var(--stop); background: var(--stop-bg); } .decision.s-okay { color: var(--okay); background: var(--okay-bg); } .decision.s-closed { color: var(--closed); background: var(--closed-bg); } .decision.s-none { color: var(--none); background: var(--none-bg); }
body.sun .decision { background: #fff !important; border: 3px solid currentColor; }
.decision p { color: var(--ink); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: 10px; }
.fact { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; border: var(--bw) solid var(--line); color: var(--ink); }
.fact b { font-size: 1.0625rem; } .fact span { font-size: .9375rem; color: var(--ink-2); }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: var(--bw) solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 4px; box-shadow: var(--shadow); }
.tile span { font-size: .9375rem; color: var(--ink-2); display: flex; justify-content: space-between; }
.tile b { font-size: 2rem; line-height: 1.1; letter-spacing: -.02em; }
.tile b small { font-size: 1rem; font-weight: 500; color: var(--ink-2); margin-left: 4px; }

/* soil health: the green feature card */
.soil { background: linear-gradient(160deg, #2A6226 0%, #2F6B2A 55%, #37752F 100%); color: #fff; border: 0; }
.soil .card-h h2, .soil .dots, .soil .muted { color: #fff; }
.bar-row { display: grid; gap: 6px; margin-top: 12px; }
.bar-row .lab { display: flex; justify-content: space-between; font-size: .9375rem; font-weight: 600; }
.hbar { height: 26px; border-radius: 8px; background: rgba(255,255,255,.18); overflow: hidden; }
.hbar i { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, rgba(255,255,255,.55), #fff); }
body.sun .soil { background: #fff; color: #000; border: 2px solid #000; } body.sun .soil .muted, body.sun .soil .card-h h2 { color: #000; } body.sun .hbar { background: #fff; border: 2px solid #000; } body.sun .hbar i { background: #000; }

/* risk meter */
.risk { height: 26px; border-radius: 999px; background: linear-gradient(90deg, #4E8C43, #9CC66B 30%, #F2C14E 55%, #E8833A 78%, #C8372D); position: relative; margin: 14px 0 6px; }
.risk i { position: absolute; top: -6px; width: 6px; height: 38px; border-radius: 3px; background: var(--ink); box-shadow: 0 0 0 3px #fff; transform: translateX(-50%); }
.risk-l { display: flex; justify-content: space-between; font-size: .875rem; color: var(--ink-2); font-weight: 600; }

/* donut */
.donut { display: grid; place-items: center; position: relative; margin: 6px auto 4px; width: 11rem; }
.donut svg { width: 100%; height: auto; transform: rotate(-90deg); }
.donut b { position: absolute; font-size: 2rem; letter-spacing: -.02em; margin-top: 1.1rem; }
.donut small { position: absolute; top: 33%; font-size: .8125rem; color: var(--ink-2); font-weight: 600; }
.key { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: .875rem; color: var(--ink-2); }
.key span { display: inline-flex; gap: 6px; align-items: center; } .key i { width: 10px; height: 10px; border-radius: 50%; }

/* lists */
.rows { display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
.row { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 16px; min-height: 4.5rem; background: var(--surface); border: var(--bw) solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.row[aria-current="true"] { border: 2px solid var(--brand); }
.row .t { font-weight: 700; font-size: 1.125rem; }
.row .d { grid-column: 1 / -1; color: var(--ink-2); font-size: .9375rem; display: flex; gap: 6px 16px; flex-wrap: wrap; }
.row .d span { display: inline-flex; gap: 6px; align-items: center; }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 18px; background: var(--surface); border: 2px solid var(--stop); }
.alert svg { color: var(--stop); }
.alert b { display: block; }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { min-height: 5.5rem; border-radius: 16px; border: var(--bw) solid var(--line); background: var(--surface); display: grid; justify-items: center; align-content: center; gap: 4px; padding: 6px 2px; }
.wd small { font-size: .875rem; font-weight: 600; }
.wd .wl { font-size: .75rem; font-weight: 700; text-align: center; line-height: 1.1; }
.wd.today { background: var(--brand); color: #fff; border-color: var(--brand); }
.wd.today .chip { background: #fff !important; }
@media (max-width: 759px) { .week { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 5.25rem; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; } .week::-webkit-scrollbar { display: none; } }

/* aerial map with floating labels */
.map { position: relative; border-radius: var(--r); overflow: hidden; background: #3d6b33 url(aerial.webp) center / cover; min-height: 22rem; box-shadow: var(--shadow); }
.map .mtop { position: absolute; left: 14px; top: 14px; right: 14px; display: flex; justify-content: space-between; gap: 8px; z-index: 2; }
.glass { background: rgba(255,255,255,.88); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: var(--ink); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: .9375rem; display: inline-flex; gap: 8px; align-items: center; border: 1px solid rgba(255,255,255,.6); }
.pin { position: absolute; transform: translate(-50%, -50%); display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 8px; min-height: 2.75rem; border-radius: 999px; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); color: var(--ink); font-weight: 600; font-size: .9375rem; border: 2px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,.25); white-space: nowrap; }
.pin .ic { display: grid; place-items: center; width: 1.75rem; height: 1.75rem; border-radius: 50%; }
.pin .ic svg { width: 1.25rem; height: 1.25rem; }
.pin[aria-current="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
.pin::after { content: ""; position: absolute; left: 50%; bottom: -14px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--brand); transform: translateX(-50%); }
body.sun .map { background: #fff; border: 2px solid #000; } body.sun .pin { border: 2px solid #000; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* task photo cards */
.tasks { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 12px; }
.task { position: relative; min-height: 10rem; border-radius: 18px; overflow: hidden; background: #2F6B2A center / cover; color: #fff; display: grid; align-content: space-between; padding: 12px; text-align: left; border: 0; }
.task::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05) 30%, rgba(10,20,10,.82)); }
.task > * { position: relative; }
.task .chip { justify-self: start; background: #fff !important; }
.task b { font-size: 1.0625rem; line-height: 1.3; }
.task small { display: block; font-size: .875rem; opacity: .95; }

/* field detail */
.need { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: var(--bw) solid var(--line); }
.need:last-child { border-bottom: 0; }
.need .n { width: 2.75rem; height: 2.75rem; border-radius: 50%; background: var(--brand-tint); color: var(--green); display: grid; place-items: center; font-weight: 700; font-size: 1.125rem; }
.need b { font-size: 1.125rem; }
.need .amt { font-weight: 700; font-size: 1.125rem; text-align: right; }
.meter { height: 12px; border-radius: 6px; background: var(--none-bg); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--green-2); border-radius: 6px; }
.meter.low i { background: var(--stop); }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .h { text-align: center; font-weight: 600; font-size: .875rem; color: var(--ink-2); padding-bottom: 4px; }
.cd { min-height: 5.5rem; gap: 4px; border-radius: 14px; border: var(--bw) solid var(--line); background: var(--surface); padding: 8px; display: grid; align-content: space-between; text-align: left; }
.cd b { font-size: 1.0625rem; }
.cd .cl { display: grid; gap: 2px; justify-items: start; font-size: .8125rem; font-weight: 700; line-height: 1.1; }
.cd .cl svg { width: 1.125rem; height: 1.125rem; }
.cd.past { opacity: .55; }
.cd.blank { border: 0; background: none; }
.cd[aria-pressed="true"] { border: 3px solid var(--brand); }
.cd.today { background: var(--brand-tint); }
.cd.today b::after { content: "Today"; display: block; font-size: .75rem; color: var(--green); }

/* forms */
.field { display: grid; gap: 8px; }
.field label, .field legend { font-weight: 700; font-size: 1.125rem; padding: 0; }
.field .hint { color: var(--ink-2); font-size: 1rem; }
.field input[type="text"] { min-height: var(--tap); border: 2px solid var(--line-strong); border-radius: 14px; padding: 0 16px; font-size: 1.25rem; background: var(--surface); letter-spacing: .08em; }
.field input[aria-invalid="true"] { border-color: var(--stop); }
.err { display: flex; gap: 8px; align-items: center; color: var(--stop); font-weight: 700; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center; padding: 14px 16px; min-height: var(--tap); border: 2px solid var(--line); border-radius: 16px; background: var(--surface); cursor: pointer; }
.opt input { width: 1.5rem; height: 1.5rem; accent-color: var(--green); margin: 0; grid-row: span 2; }
.opt b { font-size: 1.0625rem; } .opt span { color: var(--ink-2); font-size: .9375rem; }
.opt:has(input:checked) { border-color: var(--green); background: var(--brand-tint); }
.steps { display: flex; gap: 6px; list-style: none; padding: 0; margin: 0 0 18px; }
.steps li { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.steps li.done { background: var(--green-2); }
.review { display: grid; gap: 0; }
.review div { display: flex; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: var(--bw) solid var(--line); }
.review dt { color: var(--ink-2); } .review dd { margin: 0; font-weight: 700; text-align: right; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
.actions .btn { flex: 1 1 10rem; }

/* settings */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--brand-tint); border-radius: 999px; }
.seg button { min-height: 3rem; border: 0; background: transparent; font-weight: 600; color: var(--ink); border-radius: 999px; }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; border-bottom: var(--bw) solid var(--line); min-height: var(--tap); }
.switch { width: 4rem; height: 2.25rem; border-radius: 999px; border: 2px solid var(--ink-2); background: var(--surface); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: calc(2.25rem - 10px); height: calc(2.25rem - 10px); border-radius: 50%; background: var(--ink-2); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--green-2); border-color: var(--green-2); }
.switch[aria-checked="true"]::after { background: #fff; transform: translateX(1.75rem); }

/* layouts */
.split { display: grid; gap: 18px; }
.dash { display: grid; gap: 16px; }
@media (min-width: 760px) {
  .split { grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); align-items: start; }
  .split > .pane { position: sticky; top: 96px; }
  .dash { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .dash .wide { grid-column: 1 / -1; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 1200px) {
  .dash { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.25fr); }
  .dash .mapcol { grid-column: 3; grid-row: 1 / span 3; align-self: stretch; }
  .dash .mapcol { align-self: start; position: sticky; top: 96px; }
  .dash .mapcol .map { height: min(44rem, calc(100vh - 140px)); min-height: 30rem; }
  .dash > .stack:nth-of-type(4) { grid-column: 1 / 3; }
  .dash .wide { grid-column: 1 / 3; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--brand); color: #fff; padding: 14px 20px; border-radius: 999px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }

/* wireframe mode (low fidelity stage for the case study) */
body.wire { --backdrop: #E6E6E6; --paper: #F4F4F4; --surface: #FFF; --brand: #6B6B6B; --brand-tint: #EDEDED; --ink: #333; --ink-2: #777; --line: #BDBDBD; --green: #777; --green-2: #999; --shadow: none;
  --go: #555; --go-bg: #E4E4E4; --okay: #555; --okay-bg: #E4E4E4; --stop: #555; --stop-bg: #E4E4E4; --closed: #555; --closed-bg: #E4E4E4; --none: #555; --none-bg: #E4E4E4; }
body.wire .map, body.wire .task { background: repeating-linear-gradient(45deg, #ddd 0 10px, #e9e9e9 10px 20px) !important; }
body.wire .soil { background: #E4E4E4; color: #333; } body.wire .soil .card-h h2, body.wire .soil .muted { color: #333; } body.wire .hbar i { background: #999; }
body.wire .risk { background: #ccc; } body.wire .avatar, body.wire .mark { background: #bbb; }
body.wire .task::before { display: none; } body.wire .task { color: #333; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <header class="top">

    <span class="page-title" data-title>My Farm</span>

  </nav>
</div>
<div class="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ---------------- icons ---------------- */
const I = {
  go: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 9.5"/></svg>',
  okay: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
  stop: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"/><path d="m9 9 6 6M15 9l-6 6"/></svg>',
  closed: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  none: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/><path d="M8 12h8"/></svg>',
  today: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  fields: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>',
  plan: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  sensors: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M8 12h8l-1 9H9z"/><path d="M5 6a10 10 0 0 1 3-3M19 6a10 10 0 0 0-3-3"/></svg>',
  battery: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2"/></svg>',
  signal: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 4v16"/></svg>',
  nosignal: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20h.01M7 20v-4M12 20v-8M17 20v-3M3 3l18 18"/></svg>',
  warn: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>',
  back: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  list: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  map: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
};

/* ---------------- data (from the 2024 project; sample values for the prototype) ---------------- */
const STATUS = {
  go: { word: "Spread", long: "Good day to spread" },
  okay: { word: "Okay", long: "Okay to spread if needed" },
  stop: { word: "Don't spread", long: "Don't spread" },
  closed: { word: "Closed", long: "Closed period" },
  none: { word: "Not needed", long: "No fertiliser needed" },
};
const DAYKIND = {
  closed: { title: "Closed period", why: "Spreading isn't allowed on these dates under government rules.", risk: null },
  best: { title: "Good day to spread", why: "Low chance of fertiliser washing away. Soil moisture and temperature are in the safe range.", risk: "Low" },
  okay: { title: "Okay to spread if needed", why: "Some chance of leaching. If you can wait, a better day is coming.", risk: "Medium" },
  worst: { title: "Don't spread", why: "High chance of leaching. Soil moisture and temperature are outside the safe range.", risk: "High (70%)" },
};
const NOV = { 1: "closed", 2: "closed", 3: "best", 4: "best", 5: "best", 6: "best", 7: "worst", 8: "okay", 9: "okay" };
const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]; // 1 Nov is a Monday
const dow = d => DOW[(d - 1) % 7];
const TODAY = 3;
const FIELDS = [
  { id: "f1", n: 1, name: "Field 1", needs: [["P", "Phosphorus", 20], ["K", "Potassium", 10]], sensor: { id: "104 221", battery: 64 }, pts: "205,170 355,150 442,410 176,465 139,301 237,280", at: [300, 330] },
  { id: "f2", n: 2, name: "Field 2", needs: [["K", "Potassium", 10]], sensor: { id: "104 222", battery: 80 }, pts: "360,155 595,60 650,315 450,410", at: [530, 250] },
  { id: "f3", n: 3, name: "Field 3", needs: [], sensor: { id: "104 223", battery: 90 }, pts: "0,515 165,480 290,865 0,995", at: [110, 720] },
  { id: "f4", n: 4, name: "Field 4", needs: [["N", "Nitrogen", 30], ["P", "Phosphorus", 30], ["K", "Potassium", 28]], sensor: { id: "104 224", battery: 15 }, pts: "165,480 450,413 650,315 655,740 290,865", at: [470, 610] },
];
const kindOf = d => NOV[d] || null;
function fieldStatus(f, d) {
  const k = kindOf(d);
  if (k === "closed") return "closed";
  if (!f.needs.length) return "none";
  if (k === "worst") return "stop";
  if (k === "okay") return "okay";
  if (k === "best") return "go";
  return null;
}
const dayStatus = k => ({ closed: "closed", best: "go", okay: "okay", worst: "stop" })[k];

/* ---------------- state ---------------- */
const S = { route: "today", field: "f1", day: TODAY, offline: false, mapView: "list", add: { step: 1, num: "", soil: "Clay", field: "", err: "" }, sensors: [...FIELDS.map(f => ({ ...f.sensor, field: f.id }))] };
const wide = () => innerWidth >= 760;
const chip = (s, label) => `<span class="chip s-${s}">${I[s]}${label || STATUS[s].word}</span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------------- nav ---------------- */
const NAV = [["today", "Today"], ["fields", "Fields"], ["plan", "Plan"], ["sensors", "Sensors"]];
const navEl = document.querySelector(".nav");
navEl.insertAdjacentHTML("beforeend", NAV.map(([k, l]) => `<button data-go="${k}">${I[k]}<span>${l}</span></button>`).join(""));
function markNav() {
  const top = { field: "fields", day: "plan", add: "sensors" }[S.route] || S.route;
  navEl.querySelectorAll("button").forEach(b => b.dataset.go === top ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  document.querySelector('.top [data-go="settings"]').setAttribute("aria-pressed", S.route === "settings");
}

/* ---------------- views ---------------- */
function weekStrip() {
  let h = "";
  for (let d = 1; d <= 7; d++) {
    const k = kindOf(d), s = dayStatus(k);
    h += `<button class="wd${d === TODAY ? " today" : ""}" data-day="${d}" aria-label="${dow(d)} ${d} November: ${DAYKIND[k].title}${d === TODAY ? ", today" : ""}">
      <small>${dow(d)} ${d}</small><span class="chip s-${s}" style="padding:4px;min-height:0">${I[s]}</span><span class="wl">${STATUS[s].word}</span></button>`;
  }
  return `<div class="week">${h}</div>`;
}
const PINPOS = { f1: [28, 30], f2: [72, 24], f3: [30, 72], f4: [70, 68] };
function mapHTML(day, opts = {}) {
  const ready = FIELDS.filter(f => fieldStatus(f, day) === "go").length;
  return `<div class="map" role="group" aria-label="Farm map for ${dow(day)} ${day} November" ${opts.h ? `style="min-height:${opts.h}"` : ""}>
    <div class="mtop"><span class="glass">${I.map}Map</span><span class="glass">${ready} of ${FIELDS.length} fields ready</span></div>
    ${FIELDS.map(f => { const st = fieldStatus(f, day), [x, y] = PINPOS[f.id];
      return `<button class="pin" data-field="${f.id}" style="left:${x}%;top:${y}%" ${opts.sel === f.id ? 'aria-current="true"' : ""}><span class="ic s-${st}">${I[st]}</span>${f.name}<span class="sr">:</span> <span>${STATUS[st].word}</span></button>`; }).join("")}
  </div>`;
}
function fieldRows(day, sel) {
  return `<ul class="rows">${FIELDS.map(f => { const s = fieldStatus(f, day); const low = f.sensor.battery <= 20; return `<li><button class="row" data-field="${f.id}" ${sel === f.id ? 'aria-current="true"' : ""}>
    <span class="t">${f.name}</span>${chip(s)}
    <span class="d"><span>${f.needs.length ? "Needs " + f.needs.map(n => n[1].toLowerCase()).join(", ") : "No fertiliser needed"}</span><span>${I.battery}${low ? `<b style="color:var(--stop)">Low battery ${f.sensor.battery}%</b>` : `Battery ${f.sensor.battery}%`}</span></span>
  </button></li>`; }).join("")}</ul>`;
}

function vToday() {
  const k = kindOf(TODAY), st = dayStatus(k), ready = FIELDS.filter(f => fieldStatus(f, TODAY) === "go");
  const low = FIELDS.filter(f => f.sensor.battery <= 20);
  const tiles = `<div class="tiles">
    <div class="tile"><span>Fields</span><b>${FIELDS.length}<small>fields</small></b></div>
    <div class="tile"><span>Ready today</span><b>${ready.length}<small>fields</small></b></div>
    <div class="tile"><span>Sensors</span><b>${FIELDS.length}<small>online</small></b></div>
    <div class="tile"><span>Need charging</span><b>${low.length}<small>sensor</small></b></div></div>`;
  const decision = `<section class="decision s-${st}" aria-labelledby="dh">
      <div class="big">${I[st]}<div><p class="eyebrow">Today, ${dow(TODAY)} ${TODAY} November</p><h2 id="dh">${DAYKIND[k].title}</h2></div></div>
      <p>${ready.length} of ${FIELDS.length} fields are ready. ${DAYKIND[k].why}</p>
      <button class="btn block" data-go="fields">See which fields</button></section>`;
  const riskPos = { Low: 14, Medium: 55, "High (70%)": 86 }[DAYKIND[k].risk] ?? 0;
  const risk = `<section class="card" aria-labelledby="rk"><div class="card-h"><h2 id="rk">Leaching risk</h2><span class="dots" aria-hidden="true">···</span></div>
      <p style="font-size:1.75rem;font-weight:700;letter-spacing:-.02em">${DAYKIND[k].risk}</p>
      <div class="risk" role="img" aria-label="Leaching risk ${DAYKIND[k].risk}"><i style="left:${riskPos}%"></i></div><div class="risk-l"><span>Low</span><span>Medium</span><span>High</span></div>
      <p class="muted" style="margin-top:10px;font-size:1rem">Good days to spread until Sat 6 Nov.</p></section>`;
  const soil = `<section class="card soil" aria-labelledby="sl"><div class="card-h"><h2 id="sl">Soil nutrients</h2><span class="dots" aria-hidden="true">···</span></div>
      <p class="muted" style="font-size:1rem">Fields that need each nutrient</p>
      ${[["Nitrogen (N)", 1], ["Phosphorus (P)", 2], ["Potassium (K)", 3]].map(([n, c]) => `<div class="bar-row"><div class="lab"><span>${n}</span><span>${c} of 4 fields</span></div><div class="hbar" role="img" aria-label="${n}: ${c} of 4 fields need it"><i style="width:${c * 25}%"></i></div></div>`).join("")}</section>`;
  const R = 54, C = 2 * Math.PI * R;
  const health = `<section class="card" aria-labelledby="hl"><div class="card-h"><h2 id="hl">Farm health</h2><span class="dots" aria-hidden="true">···</span></div>
      <div class="donut" role="img" aria-label="Overall soil health 70%"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="${R}" fill="none" stroke="#E3F1DE" stroke-width="20"/><circle cx="70" cy="70" r="${R}" fill="none" stroke="#4E8C43" stroke-width="20" stroke-dasharray="${C * .7} ${C}" stroke-linecap="round"/></svg><small>Overall</small><b>70%</b></div>
      <div class="key"><span><i style="background:#4E8C43"></i>Healthy</span><span><i style="background:#E3F1DE;border:1px solid #9CB896"></i>Needs nutrients</span></div></section>`;
  const tasks = `<section class="wide" aria-labelledby="tk"><div class="card-h" style="margin-bottom:10px"><h2 id="tk">To do</h2></div><div class="tasks">
      <button class="task" data-field="f1" style="background-image:url(task-field.webp)">${chip("go", "Today")}<span><b>Spread Field 1</b><small>Phosphorus 20 kg/ha, potassium 10 kg/ha</small></span></button>
      <button class="task" data-field="f4" style="background-image:url(task-sensor.webp)">${chip("stop", "Low battery")}<span><b>Charge Field 4 sensor</b><small>Battery at 15%</small></span></button>
      <button class="task" data-go="plan" style="background-image:url(task-phone.webp)">${chip("okay", "This week")}<span><b>Plan spreading</b><small>Best days: Wed 3 to Sat 6 Nov</small></span></button></div></section>`;
  const head = `<div class="pagehead"><h1>Good morning</h1><p class="muted">North Fields · readings ${S.offline ? "last updated" : "updated"} 6:40am</p></div>`;
  if (!wide()) return head + `<div class="stack">${decision}${low.map(f => `<div class="alert" role="note">${I.warn}<div><b>${f.name} sensor battery is low (${f.sensor.battery}%)</b><span class="muted">Charge it soon so readings don't stop.</span></div></div>`).join("")}
      <section class="stack" aria-labelledby="wk"><h2 id="wk">This week</h2>${weekStrip()}</section>${risk}<section class="stack" aria-labelledby="fl"><h2 id="fl">Fields today</h2>${fieldRows(TODAY)}</section>${tasks}</div>`;
  return head + `<div class="dash">
      <div class="stack">${tiles}${decision}</div>
      <div class="stack">${risk}${health}</div>
      <div class="mapcol">${mapHTML(TODAY)}</div>
      <section class="stack wide" aria-labelledby="wk"><h2 id="wk">This week</h2>${weekStrip()}</section>
      <div class="stack">${soil}</div>
      ${tasks}</div>`;
}

function fieldDetail(id, day) {
  const f = FIELDS.find(x => x.id === id), s = fieldStatus(f, day), k = kindOf(day);
  const low = f.sensor.battery <= 20;
  return `<section class="stack" aria-labelledby="fd">
    ${!wide() ? `<button class="iconbtn" data-go="fields" style="justify-self:start">${I.back}All fields</button>` : ""}
    <div class="decision s-${s}"><div class="big" style="color:var(--${s})">${I[s]}<div><p class="eyebrow" style="color:inherit">${f.name} · ${dow(day)} ${day} Nov</p><h2 id="fd">${STATUS[s].long}</h2></div></div>
      <p>${s === "none" ? "This field has enough nutrients. Leave it this time." : DAYKIND[k].why}</p></div>
    <div class="card"><h3 style="margin-bottom:4px">What to add</h3>${f.needs.length ? f.needs.map(([l, n, kg]) => `<div class="need"><span class="n" aria-hidden="true">${l}</span><b>${n}</b><span class="amt">${kg} kg/ha</span></div>`).join("") : `<p class="muted" style="padding:12px 0 4px">Nothing. Nitrogen, phosphorus and potassium are all sufficient.</p>`}</div>
    <div class="card stack"><h3>Sensor ${f.sensor.id}</h3>
      <div><div style="display:flex;justify-content:space-between"><span>Battery</span><b ${low ? 'style="color:var(--stop)"' : ""}>${f.sensor.battery}%${low ? " · Low" : ""}</b></div><div class="meter${low ? " low" : ""}" role="img" aria-label="Battery ${f.sensor.battery}%"><i style="width:${f.sensor.battery}%"></i></div></div>
      <p class="muted">Last reading 6:40am${S.offline ? " (no signal since)" : ""}</p></div>
    <button class="btn secondary block" data-go="plan">Plan when to spread</button>
  </section>`;
}
function vFields() {
  const toggle = `<div class="seg" role="group" aria-label="View" style="grid-template-columns:1fr 1fr;max-width:22rem;margin-bottom:16px">
    <button data-mapview="list" aria-pressed="${S.mapView === "list"}">List</button><button data-mapview="map" aria-pressed="${S.mapView === "map"}">Map</button></div>`;
  const head = `<div class="pagehead"><h1>Fields</h1><p class="muted">Status for today, ${dow(TODAY)} ${TODAY} November.</p></div>`;
  if (!wide()) return head + toggle + (S.mapView === "map" ? mapHTML(TODAY) : fieldRows(TODAY));
  return head + `<div class="split"><div class="pane stack">${fieldRows(TODAY, S.field)}${innerWidth >= 1200 ? mapHTML(TODAY, { sel: S.field, h: "22rem" }) : ""}</div><div>${fieldDetail(S.field, TODAY)}</div></div>`;
}

function dayDetail(d) {
  const k = kindOf(d);
  if (!k) return `<section class="card stack"><h2>${dow(d)} ${d} November</h2><p class="muted">No forecast yet. Agrilite is accurate up to one week ahead, so check back closer to the date.</p></section>`;
  const s = dayStatus(k);
  return `<section class="stack" aria-labelledby="dd">
    ${!wide() ? `<button class="iconbtn" data-go="plan" style="justify-self:start">${I.back}Plan</button>` : ""}
    <div class="decision s-${s}"><div class="big" style="color:var(--${s})">${I[s]}<div><p class="eyebrow" style="color:inherit">${dow(d)} ${d} November${d === TODAY ? " · Today" : ""}</p><h2 id="dd">${DAYKIND[k].title}</h2></div></div><p>${DAYKIND[k].why}</p>
      ${DAYKIND[k].risk ? `<div class="facts"><div class="fact"><span>Leaching risk</span><b>${DAYKIND[k].risk}</b></div><div class="fact"><span>Soil moisture</span><b>${k === "worst" ? "Outside safe range" : "Safe"}</b></div><div class="fact"><span>Soil temperature</span><b>${k === "worst" ? "Outside safe range" : "Safe"}</b></div></div>` : ""}</div>
    <div class="card"><h3>By field</h3><ul class="rows" style="margin-top:12px">${FIELDS.map(f => { const fs = fieldStatus(f, d); return `<li class="row" style="min-height:3.5rem"><span class="t">${f.name}</span>${chip(fs)}</li>`; }).join("")}</ul></div>
  </section>`;
}
function vPlan() {
  const head = `<div class="pagehead"><h1>Plan</h1><p class="muted">The best days to spread, up to one week ahead.</p></div>`;
  if (!wide()) {
    let rows = "";
    for (let d = TODAY; d <= TODAY + 6; d++) { const k = kindOf(d), s = dayStatus(k);
      rows += `<li><button class="row" data-day="${d}"><span class="t">${dow(d)} ${d} Nov${d === TODAY ? " · Today" : ""}</span>${chip(s)}<span class="d">${DAYKIND[k].risk ? "Leaching risk: " + DAYKIND[k].risk : DAYKIND[k].why}</span></button></li>`; }
    return head + `<ul class="rows">${rows}</ul>`;
  }
  let cal = DOW.map(d => `<div class="h" aria-hidden="true">${d}</div>`).join("");
  for (let d = 1; d <= 30; d++) { const k = kindOf(d), s = k ? dayStatus(k) : null;
    cal += `<button class="cd${d < TODAY ? " past" : ""}${d === TODAY ? " today" : ""}" data-day="${d}" aria-pressed="${S.day === d}" aria-label="${d} November${k ? ", " + DAYKIND[k].title : ", no forecast yet"}"><b>${d}</b>${s ? `<span class="cl" style="color:var(--${s})" aria-hidden="true">${I[s]}<span>${({ stop: "Don't", go: "Spread", okay: "Okay", closed: "Closed" })[s]}</span></span>` : ""}</button>`; }
  for (let i = 0; i < 5; i++) cal += `<span class="cd blank" aria-hidden="true"></span>`;
  return head + `<div class="split" style="grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr)"><section class="card" aria-labelledby="mo"><h2 id="mo" style="margin-bottom:14px">November</h2><div class="cal">${cal}</div>
    <div class="legend">${["go", "okay", "stop", "closed"].map(s => chip(s)).join("")}</div></section><div>${dayDetail(S.day)}</div></div>`;
}

function vSensors() {
  return `<div class="pagehead"><h1>Sensors</h1><p class="muted">One sensor in each field.</p></div>
    <div class="split" style="${wide() ? "grid-template-columns:minmax(0,1fr) minmax(280px,360px)" : ""}">
    <ul class="rows">${S.sensors.map(x => { const f = FIELDS.find(y => y.id === x.field); const low = x.battery <= 20; return `<li class="row"><span class="t">Sensor ${esc(x.id)}</span><span class="chip ${low ? "s-stop" : "s-none"}">${I.battery}${x.battery}%${low ? " Low" : ""}</span>
      <span class="d"><span>${I.map}${f ? f.name : "Not placed"}</span><span>${S.offline ? I.nosignal + "No signal" : I.signal + "Connected"}</span><span>Last reading 6:40am</span></span></li>`; }).join("")}</ul>
    <div class="card stack"><h2>Add a sensor</h2><p class="muted">Takes about a minute. You'll need the number on the sensor's label.</p><button class="btn block" data-go="add">${I.plus}Add a sensor</button></div></div>`;
}

function vAdd() {
  const A = S.add, steps = `<ol class="steps" aria-label="Step ${A.step} of 4">${[1, 2, 3, 4].map(i => `<li class="${i <= A.step ? "done" : ""}"></li>`).join("")}</ol>`;
  let body = "";
  if (A.step === 1) body = `<form class="stack" data-form="num" novalidate><div class="field"><label for="num">Sensor number</label><p class="hint" id="numhint">6 digits, printed on the label under the lid. For example 104 225.</p>
      ${A.err ? `<p class="err" id="numerr">${I.warn}${A.err}</p>` : ""}
      <input type="text" id="num" inputmode="numeric" autocomplete="off" value="${esc(A.num)}" aria-describedby="numhint${A.err ? " numerr" : ""}" ${A.err ? 'aria-invalid="true"' : ""}></div>
      <div class="actions"><button type="button" class="btn secondary" data-go="sensors">Cancel</button><button class="btn">Next</button></div></form>`;
  if (A.step === 2) body = `<form class="stack" data-form="soil"><fieldset><legend class="field" style="font-weight:700;font-size:1.125rem;margin-bottom:6px">What type of soil is this field?</legend>
      ${[["Clay", "Heavy and sticky when wet"], ["Loamy", "Crumbly, holds water well"], ["Sandy", "Gritty, drains quickly"]].map(([v, d]) => `<label class="opt"><input type="radio" name="soil" value="${v}" ${A.soil === v ? "checked" : ""}><b>${v}</b><span>${d}</span></label>`).join("")}</fieldset>
      <p class="hint muted">Not sure? Choose your best guess. You can change it later.</p>
      <div class="actions"><button type="button" class="btn secondary" data-back>Back</button><button class="btn">Next</button></div></form>`;
  if (A.step === 3) body = `<form class="stack" data-form="field"><fieldset><legend style="font-weight:700;font-size:1.125rem;margin-bottom:6px">Which field is it in?</legend>
      ${A.err ? `<p class="err">${I.warn}${A.err}</p>` : ""}
      ${FIELDS.map(f => `<label class="opt"><input type="radio" name="field" value="${f.id}" ${A.field === f.id ? "checked" : ""}><b>${f.name}</b><span>${S.sensors.some(x => x.field === f.id) ? "Already has 1 sensor" : "No sensor yet"}</span></label>`).join("")}</fieldset>
      <div class="actions"><button type="button" class="btn secondary" data-back>Back</button><button class="btn">Next</button></div></form>`;
  if (A.step === 4) { const f = FIELDS.find(x => x.id === A.field); body = `<div class="stack"><h2>Check before saving</h2>
      <dl class="review"><div><dt>Sensor number</dt><dd>${esc(A.num)}</dd></div><div><dt>Soil type</dt><dd>${A.soil}</dd></div><div><dt>Field</dt><dd>${f.name}</dd></div></dl>
      <p class="muted">Wrong? Go back and change it. Nothing is saved until you press Save.</p>
      <div class="actions"><button class="btn secondary" data-back>Back</button><button class="btn" data-save>Save sensor</button></div></div>`; }
  return `<div class="pagehead"><button class="iconbtn" data-go="sensors" style="justify-self:start">${I.back}Sensors</button><h1>Add a sensor</h1><p class="muted">Step ${A.step} of 4</p></div><div style="max-width:36rem">${steps}${body}</div>`;
}

function vSettings() {
  const size = document.documentElement.dataset.size || "standard";
  const sw = (key, on, label, hint) => `<div class="toggle"><div><b id="l-${key}">${label}</b><p class="muted" style="font-size:1rem">${hint}</p></div><button class="switch" role="switch" aria-checked="${on}" aria-labelledby="l-${key}" data-switch="${key}"></button></div>`;
  return `<div class="pagehead"><h1>Settings</h1><p class="muted">Make Agrilite easier to use outdoors.</p></div>
    <div class="card stack" style="max-width:40rem"><div class="field"><span id="tsz" style="font-weight:700">Text size</span>
      <div class="seg" role="group" aria-labelledby="tsz">${[["standard", "Standard"], ["large", "Large"], ["largest", "Largest"]].map(([v, l]) => `<button data-size="${v}" aria-pressed="${size === v}">${l}</button>`).join("")}</div></div>
      ${sw("sun", document.body.classList.contains("sun"), "Bright sunlight mode", "Pure black and white with thicker outlines, for reading outdoors.")}
      ${sw("calm", document.body.classList.contains("calm"), "Reduce motion", "Turns off animations.")}
      ${sw("offline", S.offline, "Simulate no signal", "Prototype only: see how Agrilite behaves with no connection.")}
      <div class="stack" style="padding-top:8px"><b>How to read Agrilite</b><div class="legend" style="margin:0">${["go", "okay", "stop", "none", "closed"].map(s => chip(s, STATUS[s].long)).join("")}</div><p class="muted" style="font-size:1rem">Every status has its own shape and word, so it never relies on colour alone.</p></div></div>`;
}

/* ---------------- render + routing ---------------- */
const main = document.getElementById("main");
function render(focus) {
  const v = { today: vToday, fields: vFields, field: () => fieldDetail(S.field, TODAY), plan: vPlan, day: () => dayDetail(S.day), sensors: vSensors, add: vAdd, settings: vSettings }[S.route];
  main.innerHTML = v();
  markNav();
  document.querySelector("[data-sync]").innerHTML = S.offline ? I.nosignal + '<span class="t">No signal</span>' : I.signal + '<span class="t">6:40am</span>';
  document.querySelector("[data-net]").innerHTML = S.offline ? `<div class="netbar">${I.nosignal}<span>No signal. Showing readings from 6:40am. Changes will send when you're back online.</span></div>` : "";
  document.querySelector("[data-title]").textContent = ({ today: "My Farm", fields: "Fields", field: "Fields", plan: "Plan", day: "Plan", sensors: "Sensors", add: "Sensors", settings: "Settings" })[S.route];
  document.title = ({ today: "Today", fields: "Fields", field: "Field", plan: "Plan", day: "Day", sensors: "Sensors", add: "Add a sensor", settings: "Settings" })[S.route] + " · Agrilite";
  if (focus) { const h = main.querySelector("h1, h2"); (h || main).setAttribute("tabindex", "-1"); (h || main).focus({ preventScroll: true }); scrollTo(0, 0); }
}
function go(route, extra = {}) { Object.assign(S, extra, { route }); render(true); }
const toast = m => { const t = document.querySelector(".toast"); t.textContent = m; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 3200); };

document.addEventListener("click", e => {
  const t = e.target.closest("button, a[href^='#']"); if (!t) return;
  if (t.matches("a[href='#today']")) { e.preventDefault(); return go("today"); }
  if (t.dataset.go) { if (t.dataset.go === "add") S.add = { step: 1, num: "", soil: "Clay", field: "", err: "" }; return go(t.dataset.go); }
  if (t.dataset.field) { S.field = t.dataset.field; return wide() ? go("fields") : go("field"); }
  if (t.dataset.day) { S.day = +t.dataset.day; return wide() ? go("plan") : go("day"); }
  if (t.dataset.mapview) { S.mapView = t.dataset.mapview; return render(); }
  if (t.dataset.size) { document.documentElement.dataset.size = t.dataset.size; render(); return main.querySelector(`[data-size="${t.dataset.size}"]`).focus(); }
  if (t.dataset.switch) { const k = t.dataset.switch, on = t.getAttribute("aria-checked") !== "true";
    if (k === "offline") S.offline = on; else document.body.classList.toggle(k, on);
    render(); main.querySelector(`[data-switch="${k}"]`).focus(); return; }
  if (t.hasAttribute("data-back")) { S.add.err = ""; S.add.step--; return render(true); }
  if (t.hasAttribute("data-save")) { const A = S.add; S.sensors.push({ id: A.num, battery: 100, field: A.field });
    toast(S.offline ? `Sensor ${A.num} saved on this phone. We'll connect it when you have signal.` : `Sensor ${A.num} added to ${FIELDS.find(f => f.id === A.field).name}.`); return go("sensors"); }
});
document.addEventListener("click", e => { const p = e.target.closest("polygon[data-field]"); if (p) { S.field = p.dataset.field; wide() ? go("fields") : go("field"); } });
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target, A = S.add;
  if (f.dataset.form === "num") { const v = f.num.value.replace(/\s/g, ""); A.num = f.num.value.trim();
    if (!/^\d{6}$/.test(v)) { A.err = v ? "That number should be 6 digits. Check the label and try again." : "Enter the sensor number to continue."; render(); return document.getElementById("num").focus(); }
    A.num = v.slice(0, 3) + " " + v.slice(3); A.err = ""; A.step = 2; }
  else if (f.dataset.form === "soil") { A.soil = f.soil.value; A.step = 3; }
  else if (f.dataset.form === "field") { if (!f.field.value) { A.err = "Choose the field this sensor is in."; render(); return main.querySelector("input[name=field]").focus(); } A.field = f.field.value; A.err = ""; A.step = 4; }
  render(true);
});
let lastWide = wide();
addEventListener("resize", () => { if (wide() !== lastWide) { lastWide = wide(); if (lastWide && (S.route === "field")) S.route = "fields"; if (lastWide && S.route === "day") S.route = "plan"; render(); } else if (S.route === "fields" || S.route === "today") render(); });

/* deep links for the case study: ?view=plan&size=large&sun=1&offline=1&wire=1 */
const q = new URLSearchParams(location.search);
if (q.get("view")) S.route = q.get("view");
if (q.get("field")) S.field = q.get("field");
if (q.get("day")) S.day = +q.get("day");
if (q.get("map")) S.mapView = "map";
if (q.get("size")) document.documentElement.dataset.size = q.get("size");
if (q.get("sun")) document.body.classList.add("sun");
if (q.get("wire")) document.body.classList.add("wire");
if (q.get("offline")) S.offline = true;
if (q.get("step")) Object.assign(S.add, { step: +q.get("step"), num: q.get("num") || "", field: q.get("f") || "", err: q.get("err") || "" });
render();
addEventListener("message", e => { if (e.data === "agrilite:restart") { S.route = "today"; S.offline = false; document.body.classList.remove("sun", "calm"); document.documentElement.dataset.size = ""; render(); } });
</script>
</body>
</html>
