<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Chores prototype</title>
<style>
:root { --l: #D4B3FF; --k: #121212; --y: #FFD84A; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(70% 70% at 50% 40%, #E4CCFF 0%, transparent 70%), linear-gradient(170deg, #D9BAFF, #B98EF5); font-family: "Figtree", "Helvetica Neue", Arial, sans-serif; color: var(--k); display: grid; place-items: center; overflow: hidden; }
.wrap { display: grid; grid-template-columns: auto minmax(0, 300px); gap: 48px; align-items: center; padding: 16px; }
.phone { position: relative; height: min(86vh, 760px); aspect-ratio: 600 / 1298; background: var(--k); padding: 10px; border-radius: 52px; box-shadow: 0 30px 60px -20px rgba(40, 10, 90, .5); }
.scr { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: var(--l); cursor: pointer; }
.scr img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; opacity: 0; transition: opacity .35s ease, transform .35s ease; transform: translateX(16px); }
.scr img.on { opacity: 1; transform: none; }
.notch { position: absolute; left: 50%; top: 18px; width: 30%; height: 26px; transform: translateX(-50%); background: var(--k); border-radius: 99px; z-index: 2; }
.side h1 { font-size: 30px; line-height: 1.1; margin: 0 0 10px; }
.side p { margin: 0 0 20px; font-size: 16px; line-height: 1.5; }
.n { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .6; margin-bottom: 8px; }
.btns { display: flex; gap: 10px; }
button { font: inherit; font-weight: 700; font-size: 15px; padding: 12px 22px; border-radius: 99px; border: 1.5px solid var(--k); background: #fff; cursor: pointer; box-shadow: 0 3px 0 var(--k); }
button.y { background: var(--y); }
button:disabled { opacity: .4; cursor: default; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 22px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(18,18,18,.25); cursor: pointer; }
.dots i.on { background: var(--k); }
.tip { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); background: var(--k); color: #fff; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 99px; white-space: nowrap; z-index: 3; animation: bob 1.6s ease-in-out infinite; pointer-events: none; transition: opacity .3s; }
.tip.gone { opacity: 0; }
#tip { display: none !important; }
.hs { position: absolute; z-index: 4; border-radius: 14px; cursor: pointer; }
.hs.flash { box-shadow: 0 0 0 3px #F47B4B, 0 0 0 7px rgba(244,123,75,.35); animation: fl .9s ease; }
@keyframes fl { 0%,100% { opacity: 0; } 30%,70% { opacity: 1; } }
.tick { position: absolute; z-index: 3; width: 6%; aspect-ratio: 1; border-radius: 5px; background: #121212; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; pointer-events: none; }
@keyframes bob { 50% { margin-bottom: 6px; } }
@media (max-width: 720px) { .wrap { grid-template-columns: 1fr; gap: 16px; justify-items: center; text-align: center; } .side h1 { font-size: 22px; } .btns, .dots { justify-content: center; } .phone { height: 70vh; } }
</style></head><body>
<div class="wrap">
  <div class="phone"><div class="notch"></div><div class="scr" id="scr"><span class="tip" id="tip">Tap a button to continue</span></div></div>
  <div class="side">
    <div class="n" id="n"></div><h1 id="t"></h1><p id="d"></p>
    <div class="btns"><button type="button" id="prev">Back</button><button type="button" class="y" id="next">Next</button></div>
    <div class="dots" id="dots"></div>
  </div>
</div>
<script>
const S = [
  ["welcome", "Welcome", "Less nagging, more date nights. Couples sign in together."],
  ["signup", "Sign up", "A quick sign up with email or social accounts."],
  ["partner", "Find your other half", "Search for your partner by username and link your accounts."],
  ["linked", "You're linked", "Now you can split the chores together."],
  ["chores", "Who does what?", "Assign each room and its points together, so nobody has to ask."],
  ["leader", "Home", "Your team goal and both scores, side by side."],
  ["bath", "A room checklist", "Tick off each chore, then take a photo."],
  ["camera", "Photo proof", "A funny prompt on the camera turns proof into a laugh."],
  ["done", "A fun finish", "Turn your photo into a jungle explorer or a cleaning bodybuilder."],
  ["chat", "Sent to your partner", "The photo lands in your partner's chat straight away."],
  ["prizes", "Prize shop", "Spend points on treats your partner makes happen."],
  ["prizepick", "Pick a prize", "Choose a reward and unlock it with your points."],
  ["cal", "Date calendar", "Every prize is booked into one shared calendar."],
  ["profile", "Profile", "Your linked partner, points and settings."],
];
const scr = document.getElementById("scr"), dots = document.getElementById("dots"), tip = document.getElementById("tip");
const idx = n => S.findIndex(x => x[0] === n);
const imgs = S.map(([f]) => { const i = new Image(); i.src = "../../lc/" + f + ".webp"; i.alt = ""; scr.appendChild(i); return i; });
S.forEach((_, k) => { const d = document.createElement("i"); d.onclick = () => go(k); dots.appendChild(d); });
/* hotspots in % of the screen: [left, top, width, height, action] ; action = screen name, or "tick:n" */
const TABS = (h, p, c, r) => [[5, 88, h - 5, 9, "leader"], [h, 88, p - h, 9, "prizes"], [p, 88, c - p, 9, "cal"], [c, 88, r - c, 9, "profile"]];
const HS = {
  welcome: [[8, 81.5, 84, 6.5, "signup"], [62, 90, 22, 4, "signup"]],
  leader: [[63, 61.5, 22, 5.5, "bath"], [63, 71, 22, 5.5, "bath"], [63, 80.5, 22, 5.5, "bath"], ...TABS(45, 57, 70, 85).slice(1)],
  bath: [[8, 3.5, 12, 6, "leader"], [9, 37, 82, 5.5, "tick:0"], [9, 44, 82, 5.5, "tick:1"], [9, 51, 82, 5.5, "tick:2"], [8, 60, 84, 7.5, "camera"]],
  camera: [[36, 80, 28, 13, "done"]],
  prizes: [[8, 40, 48, 26, "prizepick"], [59, 40, 40, 26, "prizepick"], ...TABS(24, 58, 71, 86).filter(t => t[4] !== "prizes")],
  cal: TABS(20, 34, 70, 86).filter(t => t[4] !== "cal"),
  profile: TABS(20, 34, 48, 86).filter(t => t[4] !== "profile"),
};
const TICKS = [[15.5, 37.6], [15.5, 44.4], [15.5, 51.2]];
let at = 0, ticked = new Set();
function hotspots() {
  scr.querySelectorAll(".hs, .tick").forEach(n => n.remove());
  const name = S[at][0];
  (HS[name] || []).forEach(([l, t, w, h, act]) => {
    const d = document.createElement("div"); d.className = "hs";
    Object.assign(d.style, { left: l + "%", top: t + "%", width: w + "%", height: h + "%" });
    d.onclick = e => { e.stopPropagation(); tip.classList.add("gone");
      if (act.startsWith("tick:")) { const k = +act.slice(5); ticked.has(k) ? ticked.delete(k) : ticked.add(k); drawTicks(); }
      else go(idx(act)); };
    scr.appendChild(d);
  });
  drawTicks();
}
function drawTicks() {
  scr.querySelectorAll(".tick").forEach(n => n.remove());
  if (S[at][0] !== "bath") return;
  ticked.forEach(k => { const t = document.createElement("span"); t.className = "tick"; t.textContent = "✓"; t.style.left = TICKS[k][0] + "%"; t.style.top = TICKS[k][1] + "%"; scr.appendChild(t); });
}
function go(k) {
  at = Math.max(0, Math.min(S.length - 1, k));
  imgs.forEach((im, j) => im.classList.toggle("on", j === at));
  [...dots.children].forEach((d, j) => d.classList.toggle("on", j === at));
  document.getElementById("n").textContent = "Step " + (at + 1) + " of " + S.length;
  document.getElementById("t").textContent = S[at][1];
  document.getElementById("d").textContent = S[at][2];
  document.getElementById("prev").disabled = at === 0;
  document.getElementById("next").textContent = at === S.length - 1 ? "Start again" : "Next";
  tip.textContent = HS[S[at][0]] ? "Tap a button to continue" : "Tap the screen to continue";
  hotspots();
}
scr.onclick = () => {
  tip.classList.add("gone");
  const hs = scr.querySelectorAll(".hs");
  if (hs.length) { hs.forEach(h => { h.classList.remove("flash"); void h.offsetWidth; h.classList.add("flash"); }); return; }
  go(at + 1);
};
document.getElementById("prev").onclick = () => go(at - 1);
document.getElementById("next").onclick = () => { tip.classList.add("gone"); go(at === S.length - 1 ? 0 : at + 1); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") go(at + 1); if (e.key === "ArrowLeft") go(at - 1); });
go(0);
</script>
</body></html>
